<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>路线图编辑</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:#0a0e17;color:#e0e0f0;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
:root{--accent:#3b82f6;--green:#10b981;--danger:#ef4444;--bg:#0d1117;--panel:rgba(12,18,30,0.95);--border:rgba(255,255,255,0.06)}

/* Top bar */
#topbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--border);min-height:44px;z-index:20}
#topbar .brand{font-weight:700;font-size:0.85rem;letter-spacing:0.04em;white-space:nowrap}
#topbar .brand span{color:var(--accent)}
.sep{width:1px;height:20px;background:rgba(255,255,255,0.08);margin:0 2px}

.btn{padding:4px 12px;border-radius:5px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#aaaacc;font-size:0.78rem;font-family:inherit;cursor:pointer;transition:all 0.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.btn:hover{color:#fff;border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.06)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:rgba(239,68,68,0.12)}
.btn:disabled{opacity:0.3;cursor:default;pointer-events:none}
.spacer{flex:1}
#status-text{font-size:0.7rem;color:rgba(255,255,255,0.35);min-width:100px;text-align:right}
#zoom-label{font-size:0.7rem;color:rgba(255,255,255,0.4);min-width:40px;text-align:center}

/* Main layout */
#main{flex:1;display:flex;overflow:hidden}
#map-wrap{flex:1;position:relative}

/* Map controls overlay */
#map-controls{position:absolute;bottom:16px;right:16px;z-index:10;display:flex;flex-direction:column;gap:4px}
#map-controls button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:var(--panel);color:rgba(255,255,255,0.5);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
#map-controls button:hover{color:#fff;border-color:rgba(255,255,255,0.2)}

/* 搜索地点：浮动搜索框 */
#search-bar{position:absolute;top:12px;left:12px;z-index:20;width:280px}
#search-bar input{width:100%;padding:8px 32px 8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(12,18,30,0.92);color:#e0e0f0;font-size:0.82rem;font-family:inherit;outline:none;box-shadow:0 4px 16px rgba(0,0,0,0.35)}
#search-bar input:focus{border-color:var(--accent)}
#search-bar input::placeholder{color:rgba(255,255,255,0.35)}
#search-clear{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:20px;height:20px;border:none;background:transparent;color:rgba(255,255,255,0.4);cursor:pointer;font-size:0.9rem;line-height:1}
#search-clear:hover{color:#fff}
#search-results{display:none;margin-top:4px;background:rgba(12,18,30,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;max-height:280px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.45)}
.search-item{padding:8px 12px;font-size:0.78rem;cursor:pointer;color:rgba(255,255,255,0.75);border-bottom:1px solid rgba(255,255,255,0.05)}
.search-item:hover{background:rgba(59,130,246,0.15);color:#fff}
.search-item:last-child{border-bottom:none}

/* Right panel */
#panel{width:280px;min-width:280px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;font-size:0.78rem}
.ps{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04)}
.pl{font-size:0.6rem;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px}
.layer-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;font-size:0.78rem;cursor:pointer;transition:all 0.12s;border:1px solid transparent}
.layer-row:hover{background:rgba(255,255,255,0.04)}
.layer-row.selected{border-color:var(--accent);background:rgba(59,130,246,0.1)}
.layer-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-vis{color:rgba(255,255,255,0.4);font-size:0.75rem;padding:2px 4px;border-radius:3px}
.layer-vis:hover{color:#fff;background:rgba(255,255,255,0.08)}
.layer-del{color:var(--danger);font-size:0.7rem;padding:2px 5px;border-radius:3px;cursor:pointer}
.layer-del:hover{background:rgba(239,68,68,0.15)}
.layer-copy{color:rgba(255,255,255,0.5);font-size:0.75rem;padding:2px 5px;border-radius:3px;cursor:pointer}
.layer-copy:hover{color:#fff;background:rgba(255,255,255,0.08)}
.layer-time{font-size:0.66rem;color:rgba(255,255,255,0.35);flex-shrink:0;font-variant-numeric:tabular-nums}
.layer-replay{color:rgba(255,255,255,0.45);font-size:0.8rem;padding:2px 5px;border-radius:3px;cursor:pointer;flex-shrink:0}
.layer-replay:hover{color:#ffd400;background:rgba(255,212,0,0.12)}
.replay-dot{width:18px;height:18px;border-radius:50%;background:#ffd400;box-shadow:0 0 12px #ffd400;animation:replay-pulse 1.2s ease-in-out infinite}
@keyframes replay-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:0.6}}

/* Props inputs */
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prop-row label{width:60px;font-size:0.7rem;color:rgba(255,255,255,0.5);flex-shrink:0}
.prop-row input,.prop-row select{flex:1;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#e0e0f0;font-size:0.78rem;font-family:inherit;outline:none}
.prop-row input:focus{border-color:var(--accent)}
.prop-row input[type=color]{width:32px;flex:0 0 32px;height:26px;padding:1px;cursor:pointer}
.color-presets{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.color-preset{width:18px;height:18px;border-radius:3px;cursor:pointer;border:2px solid transparent}
.color-preset:hover{border-color:#fff}

/* Status bar */
#statusbar{display:flex;align-items:center;gap:12px;padding:3px 14px;background:rgba(0,0,0,0.3);border-top:1px solid var(--border);height:24px;min-height:24px;font-size:0.65rem;color:rgba(255,255,255,0.3);z-index:10}
#statusbar .s{white-space:nowrap}

/* Modal */
.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center}
.modal-box{background:rgba(22,27,34,0.98);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:22px 28px;min-width:340px;box-shadow:0 16px 48px rgba(0,0,0,0.5);animation:modalIn 0.2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(0.95)}}
.modal-box h2{font-size:1rem;margin-bottom:10px}
.modal-box input{width:100%;padding:9px 12px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#e0e0f0;font-size:0.85rem;font-family:inherit;outline:none}
.modal-box input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:2000;background:#1a1a2e;color:#fff;font-weight:700;padding:9px 20px;border-radius:8px;font-size:0.9rem;border:1px solid rgba(255,255,255,0.25);pointer-events:none;opacity:0;transition:opacity 0.3s}

/* 图片灯箱：点击缩略图放大，多图左右切换 */
#img-lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#img-lightbox.show{display:flex}
#img-lightbox img{max-width:86vw;max-height:86vh;object-fit:contain;border-radius:6px;box-shadow:0 10px 48px rgba(0,0,0,0.65);background:#000;cursor:default}
.img-lb-btn{position:absolute;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;z-index:1}
.img-lb-btn:hover{background:rgba(0,0,0,0.8)}
#img-lb-prev{left:18px;top:50%;transform:translateY(-50%)}
#img-lb-next{right:18px;top:50%;transform:translateY(-50%)}
#img-lb-close{top:16px;right:16px;font-size:18px;width:36px;height:36px;border-radius:8px}
#img-lb-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.75);font-size:0.85rem;letter-spacing:1px}

/* 测距距离标签：高德默认白底，但文字继承页面浅色(#e0e0f0)导致看不清 → 强制黑字加粗 */
.amap-ranging-label{color:#000 !important;font-weight:700 !important;background:#fff !important;border:1px solid #bbb !important;border-radius:4px !important;text-shadow:none !important}
</style>
</head>
<body>

<div id="topbar">
    <div class="brand">🗺️ 路线图<span>编辑</span></div>
    <div class="sep"></div>
    <button class="btn active" data-tool="pointer">🖱️ 选择</button>
    <button class="btn" data-tool="polyline">📏 路线</button>
    <button class="btn" data-tool="polygon">⬡ 区域</button>
    <button class="btn" data-tool="rectangle">▭ 画框</button>
    <button class="btn" data-tool="circle">◯ 画圆</button>
    <button class="btn" data-tool="ranging">📐 测距</button>
    <button class="btn" data-tool="measure-area">🧮 测面积</button>
    <button class="btn" data-tool="marker">📍 标记点</button>
    <button class="btn" data-tool="text">🅰 文字</button>
    <div class="sep"></div>
    <button class="btn" id="btn-undo" disabled title="撤销 Ctrl+Z">↩</button>
    <button class="btn" id="btn-redo" disabled title="重做 Ctrl+Y">↪</button>
    <div class="sep"></div>
    <button class="btn" id="btn-delete" disabled>🗑</button>
    <button class="btn" id="btn-duplicate" disabled>📋</button>
    <div class="sep"></div>
    <button class="btn primary" id="btn-save">💾 保存</button>
    <button class="btn" id="btn-export">📤 导出</button>
    <span class="spacer"></span>
    <select id="map-style" title="地图样式" style="background:#141a26;border:1px solid rgba(255,255,255,0.1);color:#e0e0f0;border-radius:5px;padding:4px 8px;font-size:0.78rem;font-family:inherit;cursor:pointer;outline:none">
        <option value="dark" selected>🌙 暗黑</option>
        <option value="normal">🗺️ 标准</option>
        <option value="satellite">🛰️ 卫星</option>
    </select>
    <label id="roadnet-toggle" title="卫星模式下显示/隐藏路网标注" style="display:none;align-items:center;gap:4px;font-size:0.78rem;color:#e0e0f0;cursor:pointer;user-select:none;white-space:nowrap"><input type="checkbox" id="roadnet-check" checked style="cursor:pointer;vertical-align:middle" />路网</label>
    <span id="zoom-label">100%</span>
    <span class="sep"></span>
    <span id="status-text">就绪</span>
    <a href="/index.html" class="btn" title="返回首页">🏠 首页</a>
    <a href="/admin.html" class="btn">← 后台</a>
</div>

<div id="main">
    <div id="map-wrap">
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="🔍 搜索地点..." autocomplete="off" />
            <button id="search-clear" title="清除搜索" type="button">✕</button>
            <div id="search-results"></div>
        </div>
        <div id="map-controls">
            <button id="btn-zoom-in" title="放大">+</button>
            <button id="btn-zoom-out" title="缩小">−</button>
            <button id="btn-reset-view" title="重置">⌂</button>
        </div>
    </div>

    <div id="panel">
        <div class="ps">
            <div class="pl">方案</div>
            <div id="plan-list"></div>
            <button class="btn" id="btn-new-plan" style="width:100%;margin-top:6px;justify-content:center">＋ 新建方案</button>
        </div>
        <div class="ps"><div class="pl">图层</div><div id="layer-list"></div></div>
        <div class="ps" id="props-section" style="display:none">
            <div class="pl">属性</div>
            <div class="prop-row"><label>名称</label><input type="text" id="prop-name" /></div>
            <div class="prop-row"><label>介绍</label><input type="text" id="prop-desc" placeholder="可选，首页点击时显示" /></div>
            <div class="prop-row"><label>颜色</label><input type="color" id="prop-color" /></div>
            <div class="color-presets" id="color-presets"></div>
            <div class="prop-row"><label>线宽</label><input type="range" id="prop-stroke" min="1" max="12" value="3" style="flex:1" /></div>
            <div class="prop-row"><label>透明度</label><input type="range" id="prop-opacity" min="5" max="100" value="100" style="flex:1" /></div>
            <div class="prop-row"><label>速度</label><input type="range" id="prop-speed" min="1" max="50" value="9" style="flex:1" /><span id="prop-speed-val" style="font-size:0.7rem;color:rgba(255,255,255,0.5);min-width:34px;text-align:right">0.9</span></div>
            <div class="prop-row"><label>方向</label><select id="prop-direction" style="flex:1"><option value="1">正向 →（起点到终点）</option><option value="-1">反向 ←（终点到起点）</option></select></div>
            <div class="prop-row" id="prop-rotation-row"><label>旋转</label><input type="range" id="prop-rotation" min="-180" max="180" value="0" style="flex:1" /><span id="prop-rotation-val" style="font-size:0.7rem;color:rgba(255,255,255,0.5);min-width:34px;text-align:right">0°</span></div>
            <div id="prop-images-block" style="margin-top:6px">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
                    <label style="font-size:0.7rem;color:rgba(255,255,255,0.5)">🖼️ 图片（首页点击放大）</label>
                    <button class="btn" id="btn-add-images" style="padding:2px 8px;font-size:0.7rem">＋ 添加</button>
                </div>
                <div id="prop-images-thumbs" style="display:flex;flex-wrap:wrap;gap:4px"></div>
            </div>
            <input type="file" id="prop-img-input" accept="image/*" multiple style="display:none" />
            <div id="prop-points-info" style="font-size:0.7rem;color:rgba(255,255,255,0.35);margin-top:4px"></div>
            <div style="display:flex;gap:4px;margin-top:8px">
                <button class="btn" id="btn-bring-front">⬆ 置顶</button>
                <button class="btn" id="btn-send-back">⬇ 置底</button>
            </div>
        </div>
        <div class="ps"><div class="pl">统计</div><span id="stats" style="color:rgba(255,255,255,0.5)"></span></div>
    </div>
</div>

<div id="statusbar">
    <span class="s" id="sb-name"></span>
    <span class="s" id="sb-counts"></span>
    <span class="spacer"></span>
    <span class="s" id="sb-zoom"></span>
    <span class="s" id="sb-history"></span>
</div>

<div id="login-modal" class="modal" style="display:none">
    <div class="modal-box"><h2>🔐 管理员验证</h2>
        <input type="password" id="login-pwd" placeholder="管理员密码" />
        <div class="modal-actions"><button class="btn" id="login-cancel">取消</button><button class="btn primary" id="login-submit">确认</button></div>
    </div>
</div>

<div id="name-modal" class="modal" style="display:none">
    <div class="modal-box"><h2>💾 保存方案</h2>
        <p style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:10px">给这个方案起个名字，方便以后识别</p>

        <div class="modal-actions"><button class="btn" id="name-cancel">取消</button><button class="btn primary" id="name-submit">保存</button></div>
    </div>
</div>

<div id="img-lightbox">
    <button class="img-lb-btn" id="img-lb-prev" title="上一张">‹</button>
    <img id="img-lightbox-img" alt="图片预览" />
    <button class="img-lb-btn" id="img-lb-next" title="下一张">›</button>
    <button class="img-lb-btn" id="img-lb-close" title="关闭">✕</button>
    <span id="img-lb-count"></span>
</div>

<script>
(function(){
'use strict';

const DEFAULT_CENTER = [104.14141, 30.67133], DEFAULT_ZOOM = 17;
const SEARCH_CITY = '成都';   // 高德 POI 联想限定城市（场馆在成都）
const COLOR_PRESETS = ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#14b8a6','#6366f1','#d946ef','#0ea5e9','#e11d48','#eab308','#a855f7','#64748b','#ffffff','#000000'];
const MAX_HISTORY = 50;

let map, mouseTool, rangingTool=null, currentTool='pointer', overlays=[], selectedOv=null;
let activeEditor=null, preEditSnapshot=null;
let searchMarker=null;              // 搜索定位的临时标记（不落库）
let satelliteLayer=null, roadNetLayer=null, saveToken=null;
let history=[], historyIdx=-1;
let currentPlanId=null, plans=[];
let planOverlayGroups={}, activePlanIds=new Set();
let config={geo:{amapKey:'',amapSecurityCode:'',center:DEFAULT_CENTER,zoom:DEFAULT_ZOOM,pitch:55,rotation:20,mapStyle:'amap://styles/dark'}};

async function loadConfig(){
    try{const r=await fetch('/config.json');if(r.ok)config=await r.json()}catch(e){}
}

// —— 方框旋转支持：bounds（轴对齐）+ rotation（绕中心顺时针，度）——
function rectBoundsOf(ov){
    if(ov._bounds)return ov._bounds;
    if(ov.getBounds){const b=ov.getBounds();return [[b.getSouthWest().lng,b.getSouthWest().lat],[b.getNorthEast().lng,b.getNorthEast().lat]];}
    return null;
}
function rectCorners(bounds, rotation){
    const sw=bounds[0], ne=bounds[1];
    const cx=(sw[0]+ne[0])/2, cy=(sw[1]+ne[1])/2;
    const hl=(ne[0]-sw[0])/2, hla=(ne[1]-sw[1])/2;
    const corners=[[cx-hl,cy-hla],[cx+hl,cy-hla],[cx+hl,cy+hla],[cx-hl,cy+hla]];
    if(!rotation)return corners;
    const rad=rotation*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
    const mLng=111320*Math.cos(cy*Math.PI/180);
    return corners.map(([lng,lat])=>{
        const dx=(lng-cx)*mLng, dy=(lat-cy)*111320;
        const dx2=dx*cos+dy*sin, dy2=-dx*sin+dy*cos;
        return [cx+dx2/mLng, cy+dy2/111320];
    });
}
function buildRectOv(bounds, rotation, d){
    if(rotation){
        const ov=new AMap.Polygon({path:rectCorners(bounds,rotation),strokeColor:d._color,strokeWeight:d._stroke||2,fillColor:d._color,fillOpacity:d._opacity??0.2,zIndex:5});
        ov._bounds=bounds; ov._rotation=rotation;
        return ov;
    }
    return new AMap.Rectangle({bounds:new AMap.Bounds(bounds[0],bounds[1]),strokeColor:d._color,strokeWeight:d._stroke||2,fillColor:d._color,fillOpacity:d._opacity??0.2,zIndex:5});
}
// —— 三点式画框：点1=角点A、点2=角点B（定义边长+方向）、点3=定义垂直宽度 ——
// 返回轴对齐 bounds + rotation（绕中心顺时针度），供 buildRectOv / 持久化使用
function threePointRect(path){
    const A=path[0], B=path[1], C=path[2];
    const lat0=(A[1]+B[1]+C[1])/3;
    const mLng=111320*Math.cos(lat0*Math.PI/180);
    const ax=A[0]*mLng, ay=A[1]*111320;
    const bx=B[0]*mLng, by=B[1]*111320;
    const cx=C[0]*mLng, cy=C[1]*111320;
    const vx=bx-ax, vy=by-ay;
    const vlen=Math.hypot(vx,vy);
    if(vlen<1e-6) return {bounds:[[A[0],A[1]],[A[0],A[1]]], rotation:0};
    const nx=-vy/vlen, ny=vx/vlen;                 // 基边的单位法向量（逆时针90°）
    const w=(cx-ax)*nx+(cy-ay)*ny;                 // 有符号宽度（C 到基边的垂距）
    // 真实矩形中心 = A + 基边一半 + 法向一半；bounds 存「未旋转」的半长/半宽，
    // rectCorners 会拿这个 bounds 再旋转 rotation，二者必须匹配（不能存旋转后的外接包围盒）
    const mcx=ax+vx/2+nx*w/2, mcy=ay+vy/2+ny*w/2;
    const hl=vlen/2/mLng, hla=Math.abs(w)/2/111320;
    const cll=mcx/mLng, clat=mcy/111320;
    const bounds=[[cll-hl,clat-hla],[cll+hl,clat+hla]];
    const rotation=-Math.atan2(vy,vx)*180/Math.PI; // 基边方向角取反，匹配 rectCorners 的顺时针约定
    return {bounds, rotation};
}

function replaceRectOv(ov, rotation){
    const bounds=rectBoundsOf(ov);
    if(!bounds)return ov;
    const idx=overlays.indexOf(ov);
    const nv=buildRectOv(bounds, rotation, ov);
    nv._type='rect';nv._name=ov._name;nv._color=ov._color;nv._stroke=ov._stroke;nv._opacity=ov._opacity;nv._speed=ov._speed;nv._direction=ov._direction;nv._desc=ov._desc;nv._images=ov._images||[];
    nv._rotation=rotation;
    nv.setMap(map);
    nv.on('click',()=>selectOv(nv));
    bindWholeDrag(nv);
    if(idx>=0)overlays[idx]=nv; else overlays.push(nv);
    map.remove(ov);
    return nv;
}

function captureOverlays(){
    return JSON.parse(JSON.stringify(overlays.map(o=>{
        const base={_type:o._type,_name:o._name,_color:o._color,_stroke:o._stroke,_opacity:o._opacity,_speed:o._speed,_direction:o._direction,_desc:o._desc,_images:o._images||[]};
        if(o._type==='marker'||o._type==='text')return {...base,path:[[o.getPosition().lng,o.getPosition().lat]]};
        if(o._type==='rect'){const b=rectBoundsOf(o);return {...base,_rotation:o._rotation||0,bounds:b};}
        if(o._type==='circle'){const c=o.getCenter();return {...base,center:[c.lng,c.lat],radius:o.getRadius()};}
        if(o._type==='ellipse'){const c=o.getCenter();return {...base,center:[c.lng,c.lat],radius:o.getRadius()};}
        return {...base,path:o.getPath().map(p=>[p.lng,p.lat])};
    })));
}
function saveSnapshot(){
    const snap=captureOverlays();
    history=history.slice(0,historyIdx+1);history.push(snap);
    if(history.length>MAX_HISTORY)history.shift();
    historyIdx=history.length-1;
    updateUI();
}

function undo(){
    if(historyIdx<0)return;
    const snap=history[historyIdx];
    overlays.forEach(o=>map.remove(o));
    overlays=[];
    restoreSnapshot(snap);
    historyIdx--;
    deselectOv();
    updateUI();
}

function redo(){
    if(historyIdx>=history.length-2)return;
    historyIdx+=2;
    const snap=history[historyIdx];
    overlays.forEach(o=>map.remove(o));
    overlays=[];
    restoreSnapshot(snap);
    updateUI();
}

function restoreSnapshot(snap){
    snap.forEach(d=>{
        let ov;
        if(d._type==='marker'){
            ov=new AMap.Marker({position:d.path[0],content:markerContent(d._color,false),offset:new AMap.Pixel(-8,-8),title:d._name});
        }else if(d._type==='text'){
            ov=new AMap.Text({text:d._name,position:d.path[0],anchor:'center',style:{'color':'#ffffff','font-size':'14px','background-color':'rgba(0,0,0,0.55)','padding':'3px 8px','border-radius':'4px','border':'1px solid rgba(255,255,255,0.25)'},zIndex:20});
        }else if(d._type==='route'){
            ov=new AMap.Polyline({strokeColor:d._color,strokeWeight:d._stroke||3,strokeOpacity:d._opacity??0.9,zIndex:10,path:d.path.map(p=>[p[0],p[1]])});
        }else if(d._type==='rect'){
            ov=buildRectOv(d.bounds, d._rotation||0, d);
        }else if(d._type==='circle'){
            ov=new AMap.Circle({center:d.center,radius:d.radius,strokeColor:d._color,strokeWeight:d._stroke||2,fillColor:d._color,fillOpacity:d._opacity??0.2,zIndex:5});
        }else if(d._type==='ellipse'){
            const rr=Array.isArray(d.radius)?d.radius:[d.radius||80,d.radius||80];
            ov=new AMap.Ellipse({center:d.center,radius:rr,strokeColor:d._color,strokeWeight:d._stroke||2,fillColor:d._color,fillOpacity:d._opacity??0.2,zIndex:5});
        }else{
            ov=new AMap.Polygon({strokeColor:d._color,strokeWeight:d._stroke||2,fillColor:d._color,fillOpacity:d._opacity??0.2,zIndex:5,path:d.path.map(p=>[p[0],p[1]])});
        }
        ov.setMap(map);
        ov._type=d._type;ov._name=d._name;ov._color=d._color;ov._stroke=d._stroke;ov._opacity=d._opacity;ov._speed=d._speed;ov._direction=d._direction;ov._desc=d._desc;ov._rotation=d._rotation||0;ov._images=d._images||[];
        ov.on('click',()=>selectOv(ov));
        if(d._type==='marker')bindMarkerDrag(ov);
        else bindWholeDrag(ov);
        if(d._type==='area')bindAreaHover(ov);
        overlays.push(ov);
    });
}

    AMap.plugin('AMap.AutoComplete',()=>{

function addRoutesAreas(routes,areas,target){
    const arr=target||overlays;
    if(routes)Object.entries(routes).forEach(([n,r])=>{
        if(!r.pts||r.pts.length<2)return;
        const ov=new AMap.Polyline({strokeColor:r.color||'#3b82f6',strokeWeight:r.strokeWidth||3,strokeOpacity:r.opacity??0.9,zIndex:10,path:r.pts.map(p=>[p[0],p[1]])});
        ov.setMap(map);ov._type='route';ov._name=n;ov._color=r.color||'#3b82f6';ov._stroke=r.strokeWidth||3;ov._opacity=r.opacity??0.9;ov._speed=r.speed??0.9;ov._direction=r.direction??1;ov._desc=r.desc||'';ov._images=r.images||[];if(arr===overlays){ov.on('click',()=>selectOv(ov));bindWholeDrag(ov)}arr.push(ov);
    });
    if(areas)Object.entries(areas).forEach(([n,a])=>{
        if(!a.pts||a.pts.length<3)return;
        const ov=new AMap.Polygon({strokeColor:a.color||'#10b981',strokeWeight:a.strokeWidth||2,fillColor:a.color||'#10b981',fillOpacity:a.opacity??0.2,zIndex:5,path:a.pts.map(p=>[p[0],p[1]])});
        ov.setMap(map);ov._type='area';ov._name=n;ov._color=a.color||'#10b981';ov._stroke=a.strokeWidth||2;ov._opacity=a.opacity??0.2;ov._desc=a.desc||'';ov._images=a.images||[];if(arr===overlays){ov.on('click',()=>selectOv(ov));bindAreaHover(ov);bindWholeDrag(ov)}arr.push(ov);
    });
}

function addMarkers(markers,target){
    if(!markers)return;
    const arr=target||overlays;
    Object.entries(markers).forEach(([n,m])=>{
        const ov=new AMap.Marker({position:[m.lng,m.lat],content:markerContent(m.color||'#f59e0b',false),offset:new AMap.Pixel(-8,-8),title:n});
        ov.setMap(map);ov._type='marker';ov._name=n;ov._color=m.color||'#f59e0b';ov._stroke=0;ov._opacity=1;ov._images=m.images||[];
        if(arr===overlays){ov.on('click',()=>selectOv(ov));bindMarkerDrag(ov);}arr.push(ov);
    });
}

function addRectsCircles(rects,circles,target){
    const arr=target||overlays;
    if(rects)Object.entries(rects).forEach(([n,r])=>{
        if(!r.bounds||!r.bounds[0]||!r.bounds[1])return;
        const ov=buildRectOv(r.bounds, r.rotation||0, {_color:r.color||'#8b5cf6',_stroke:r.strokeWidth||2,_opacity:r.opacity??0.2});
        ov.setMap(map);ov._type='rect';ov._name=n;ov._color=r.color||'#8b5cf6';ov._stroke=r.strokeWidth||2;ov._opacity=r.opacity??0.2;ov._desc=r.desc||'';ov._images=r.images||[];if(arr===overlays){ov.on('click',()=>selectOv(ov));bindWholeDrag(ov)}arr.push(ov);
    });
    if(circles)Object.entries(circles).forEach(([n,c])=>{
        if(!c.center||c.radius==null)return;
        const ov=new AMap.Circle({center:c.center,radius:c.radius,strokeColor:c.color||'#ec4899',strokeWeight:c.strokeWidth||2,fillColor:c.color||'#ec4899',fillOpacity:c.opacity??0.2,zIndex:5});
        ov.setMap(map);ov._type='circle';ov._name=n;ov._color=c.color||'#ec4899';ov._stroke=c.strokeWidth||2;ov._opacity=c.opacity??0.2;ov._desc=c.desc||'';ov._images=c.images||[];if(arr===overlays){ov.on('click',()=>selectOv(ov));bindWholeDrag(ov)}arr.push(ov);
    });
}

function addEllipsesTexts(ellipses,texts,target){
    const arr=target||overlays;
    if(ellipses)Object.entries(ellipses).forEach(([n,e])=>{
        if(!e.center)return;
        const rr=Array.isArray(e.radius)?e.radius:[e.radius||80,e.radius||80];
        const ov=new AMap.Ellipse({center:e.center,radius:rr,strokeColor:e.color||'#06b6d4',strokeWeight:e.strokeWidth||2,fillColor:e.color||'#06b6d4',fillOpacity:e.opacity??0.2,zIndex:5});
        ov.setMap(map);ov._type='ellipse';ov._name=n;ov._color=e.color||'#06b6d4';ov._stroke=e.strokeWidth||2;ov._opacity=e.opacity??0.2;ov._desc=e.desc||'';ov._images=e.images||[];if(arr===overlays){ov.on('click',()=>selectOv(ov));bindWholeDrag(ov)}arr.push(ov);
    });
    if(texts)Object.entries(texts).forEach(([n,t])=>{
        if(t.lng==null||t.lat==null)return;
        const ov=new AMap.Text({text:n,position:[t.lng,t.lat],anchor:'center',style:{'color':t.color||'#ffffff','font-size':'14px','background-color':'rgba(0,0,0,0.55)','padding':'3px 8px','border-radius':'4px','border':'1px solid rgba(255,255,255,0.25)'},zIndex:20});
        ov.setMap(map);ov._type='text';ov._name=n;ov._color=t.color||'#ffffff';ov._stroke=0;ov._opacity=1;ov._speed=0;ov._direction=1;ov._desc='';ov._images=t.images||[];if(arr===overlays)ov.on('click',()=>selectOv(ov));arr.push(ov);
    });
}

// —— 多方案管理 ——
async function loadPlans(){
    loadActivePlanIds();
    try{
        const t=localStorage.getItem('admin_token');
        const r=await fetch('/api/editor/projects',{headers:t?{'Authorization':'Bearer '+t}:{}});
        const j=await r.json();
        plans=(j.data||[]).filter(p=>p.data&&p.data.kind==='map');
    }catch(e){plans=[]}
    renderPlanList();
}

function renderPlanList(){
    const box=document.getElementById('plan-list');if(!box)return;
    box.innerHTML='';
    if(plans.length===0){
        box.innerHTML='<div style="font-size:0.72rem;color:rgba(255,255,255,0.35);padding:4px 0;">暂无方案</div>';
        return;
    }
    plans.forEach(p=>{
        const isCurrent=String(p.id)===String(currentPlanId);
        const row=document.createElement('div');
        row.className='layer-row'+(isCurrent?' selected':'');
        row.style.cursor='pointer';
        const dot=document.createElement('span');dot.className='layer-dot';dot.style.background='#8b5cf6';
        const name=document.createElement('span');name.className='layer-name';name.textContent=p.name||('方案 '+p.id);name.title=p.name||'';
        if(isCurrent){
            const badge=document.createElement('span');badge.textContent='✏️';badge.title='编辑中';badge.style.cssText='font-size:0.7rem;flex-shrink:0';
            row.appendChild(dot);row.appendChild(badge);row.appendChild(name);
        }else{
            const cb=document.createElement('input');cb.type='checkbox';
            cb.checked=activePlanIds.has(String(p.id));
            cb.style.cssText='flex-shrink:0;accent-color:#3b82f6;cursor:pointer';
            cb.addEventListener('change',()=>togglePlanOverlay(p.id,cb.checked));
            row.appendChild(dot);row.appendChild(cb);row.appendChild(name);
        }
        const time=document.createElement('span');time.className='layer-time';time.textContent=(p.updated_at||'').slice(5,16).replace('T',' ');time.title=p.updated_at||'';
        const cp=document.createElement('span');cp.className='layer-copy';cp.textContent='⧉';cp.title='复制方案';
        const del=document.createElement('span');del.className='layer-del';del.textContent='✕';
        row.appendChild(time);row.appendChild(cp);row.appendChild(del);
        row.addEventListener('click',e=>{
            if(e.target===del){deletePlan(p.id);return}
            if(e.target===cp){copyPlan(p);return}
            if(e.target.tagName==='INPUT')return;
            loadPlan(p);
        });
        box.appendChild(row);
    });
}

// —— 方案多选叠加（只读图层，不参与编辑/保存/撤销） ——
const ADMIN_PLAN_MEMORY_KEY='admin_active_plans';
function saveActivePlanIds(){ try{ localStorage.setItem(ADMIN_PLAN_MEMORY_KEY, JSON.stringify([...activePlanIds])); }catch(_){} }
function loadActivePlanIds(){ try{ activePlanIds=new Set((JSON.parse(localStorage.getItem(ADMIN_PLAN_MEMORY_KEY)||'[]')||[]).map(String)); }catch(_){ activePlanIds=new Set(); } }
function renderPlanReadonly(id,data){
    removePlanReadonly(id);
    const g=[];
    addRoutesAreas(data.routes,data.areas,g);
    addMarkers(data.markers,g);
    addRectsCircles(data.rects,data.circles,g);
    addEllipsesTexts(data.ellipses,data.texts,g);
    planOverlayGroups[String(id)]=g;
}
function removePlanReadonly(id){
    const g=planOverlayGroups[String(id)];
    if(g){ g.forEach(o=>{ try{o.setMap(null)}catch(_){} }); delete planOverlayGroups[String(id)]; }
}
async function togglePlanOverlay(id,on){
    id=String(id);
    if(on){
        let p=plans.find(x=>String(x.id)===id);
        if(!p){ try{ const t=localStorage.getItem('admin_token'); const r=await fetch('/api/editor/projects/'+id,{headers:t?{'Authorization':'Bearer '+t}:{}}); const j=await r.json(); p=j.data; }catch(_){ p=null; } }
        if(p)renderPlanReadonly(id,p.data||{});
        activePlanIds.add(id);
    }else{
        removePlanReadonly(id);
        activePlanIds.delete(id);
    }
    saveActivePlanIds();
}
function restoreActivePlanOverlays(){
    activePlanIds.forEach(id=>{
        if(String(id)!==String(currentPlanId)){
            const p=plans.find(x=>String(x.id)===String(id));
            if(p&&p.data)renderPlanReadonly(id,p.data);
        }
    });
}

function clearOverlays(){
    overlays.forEach(o=>map.remove(o));
    overlays=[];
}

function loadPlan(p){
    clearOverlays();
    const data=p.data||{};
    addRoutesAreas(data.routes,data.areas);
    addMarkers(data.markers);
    addRectsCircles(data.rects,data.circles);
    addEllipsesTexts(data.ellipses,data.texts);
    currentPlanId=p.id;
    document.getElementById('sb-name').textContent=p.name||'未命名方案';
    deselectOv();saveSnapshot();updateUI();renderPlanList();
    toast('✅ 已加载「'+(p.name||'')+'」');
}

function deletePlan(id){
    const t=localStorage.getItem('admin_token');if(!t){showLogin();return}
    if(!confirm('删除该方案？'))return;
    fetch('/api/editor/projects/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+t}})
        .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
        .then(()=>{
            if(String(id)===String(currentPlanId)){currentPlanId=null;clearOverlays();document.getElementById('sb-name').textContent='未命名方案';updateUI();}
            removePlanReadonly(id);activePlanIds.delete(String(id));saveActivePlanIds();
            loadPlans();toast('✅ 已删除');
        })
        .catch(()=>toast('❌ 删除失败'));
}

async function copyPlan(p){
    const t=localStorage.getItem('admin_token');if(!t){showLogin();return}
    const name=(p.name||'方案')+' 副本';
    try{
        const r=await fetch('/api/editor/projects',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({name,data:p.data})});
        const j=await r.json();
        if(r.ok){await loadPlans();toast('✅ 已复制为「'+name+'」');}
        else toast('❌ 复制失败: '+(j.error||('HTTP '+r.status)));
    }catch(e){toast('❌ 网络错误')}
}

document.querySelectorAll('#topbar button[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));

function setTool(tool){
    currentTool=tool;
    document.querySelectorAll('#topbar button[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));
    if(mouseTool)mouseTool.close();
    if(rangingTool)rangingTool.turnOff();
    deselectOv();
    const st=document.getElementById('status-text');
    if(tool==='pointer')st.textContent='就绪';
    else if(tool==='polyline'){mouseTool.polyline({strokeColor:'#3b82f6',strokeWeight:3,strokeOpacity:0.9});st.textContent='📏 画路线 — 点击加顶点，双击完成'}
    else if(tool==='polygon'){mouseTool.polygon({strokeColor:'#10b981',strokeWeight:2,strokeOpacity:0.8,fillColor:'#10b981',fillOpacity:0.2});st.textContent='⬡ 画区域 — 点击加顶点，双击完成'}
    else if(tool==='rectangle'){mouseTool.polyline({strokeColor:'#8b5cf6',strokeWeight:2,strokeOpacity:0.8});st.textContent='▭ 画框(三点) — 点1角点、点2边长、点3宽度，双击完成'}
    else if(tool==='circle'){mouseTool.circle({strokeColor:'#ec4899',strokeWeight:2,strokeOpacity:0.8,fillColor:'#ec4899',fillOpacity:0.2});st.textContent='◯ 画圆 — 点击圆心，拖拽设定半径'}
    else if(tool==='ranging'){if(rangingTool)rangingTool.turnOn();st.textContent='📐 测距 — 点击加测量点，双击结束'}
    else if(tool==='measure-area'){mouseTool.polygon({strokeColor:'#f59e0b',strokeWeight:2,strokeOpacity:0.8,fillColor:'#f59e0b',fillOpacity:0.2});st.textContent='🧮 测面积 — 点击加顶点，双击出面积'}
    else if(tool==='marker'){mouseTool.marker();st.textContent='📍 标记点 — 点击地图放置一个标记点'}
    else if(tool==='text'){st.textContent='🅰 文字 — 点击地图放置文字标注'}
}

function markerContent(color,selected){
    const ring=selected?'box-shadow:0 0 0 3px #ffd400,0 2px 8px rgba(0,0,0,0.6)':'box-shadow:0 2px 8px rgba(0,0,0,0.6)';
    return '<div style="width:12px;height:12px;background:'+color+';border:2px solid #fff;border-radius:50%;'+ring+';cursor:pointer"></div>';
}

const TOOL_TYPE={polyline:'route',polygon:'area',marker:'marker',rectangle:'rect',circle:'circle'};
const TYPE_NAME={route:'路线',area:'区域',rect:'画框',circle:'画圆'};
const TYPE_COLOR={route:'#3b82f6',area:'#10b981',rect:'#8b5cf6',circle:'#ec4899'};

function onDraw(e){
    // 面积测量：临时多边形，算完即删，不落库
    if(currentTool==='measure-area'){
        const path=e.obj.getPath().map(p=>[p.lng,p.lat]);
        const area=polygonAreaMeters(path);
        e.obj.setMap(null);
        setTool('pointer');
        toast('🧮 面积: '+formatArea(area));
        return;
    }
    // 三点式画框：点1角点、点2边长方向、点3垂直宽度 → 转成旋转矩形
    if(currentTool==='rectangle'){
        const path=e.obj.getPath().map(p=>[p.lng,p.lat]);
        e.obj.setMap(null);
        if(path.length<3){setTool('pointer');toast('⚠️ 画框需要3个点');return;}
        const rb=threePointRect(path);
        saveSnapshot();
        const cnt=overlays.filter(o=>o._type==='rect').length+1;
        const ov=buildRectOv(rb.bounds,rb.rotation,{_color:TYPE_COLOR.rect,_stroke:2,_opacity:0.2});
        ov.setMap(map);
        ov._type='rect';ov._name='画框 '+cnt;ov._color=TYPE_COLOR.rect;ov._stroke=2;ov._opacity=0.2;ov._speed=0.9;ov._direction=1;ov._desc='';ov._images=[];
        ov.on('click',()=>selectOv(ov));
        bindWholeDrag(ov);
        overlays.push(ov);
        updateUI();setTool('pointer');
        toast('✅ 已添加: '+ov._name);
        return;
    }
    saveSnapshot();
    let ov=e.obj;
    const type=TOOL_TYPE[currentTool]||'route';
    if(type==='marker'){
        const cnt=overlays.filter(o=>o._type==='marker').length+1;
        ov._type='marker';ov._name='标记 '+cnt;ov._color='#f59e0b';ov._stroke=0;ov._opacity=1;ov._images=[];
        ov.setContent(markerContent(ov._color,false));ov.setOffset(new AMap.Pixel(-8,-8));ov.setTitle(ov._name);
        ov.setMap(map);
        ov.on('click',()=>selectOv(ov));
        bindMarkerDrag(ov);
        overlays.push(ov);
        updateUI();setTool('pointer');
        toast('✅ 已添加: '+ov._name);
        return;
    }
    const cnt=overlays.filter(o=>o._type===type).length+1;
    const isAreaLike=(type==='area'||type==='rect'||type==='circle'||type==='ellipse');
    ov._type=type;ov._name=TYPE_NAME[type]+' '+cnt;
    ov._color=TYPE_COLOR[type];
    ov._stroke=isAreaLike?2:3;
    ov._opacity=isAreaLike?0.2:0.9;
    ov._speed=0.9;
    ov._direction=1;
    ov._desc='';
    ov._images=[];
    ov.setMap(map);  // 确保图形在地图上显示
    ov.on('click',()=>selectOv(ov));
    if(type==='area')bindAreaHover(ov);
    bindWholeDrag(ov);
    overlays.push(ov);
    updateUI();setTool('pointer');
    toast('✅ 已添加: '+ov._name);
}

// 自由文字标注：点击地图 → 输入文字 → AMap.Text（图层名即文字内容）
function placeText(lnglat){
    const txt=prompt('输入文字内容：','文字标注');
    if(txt===null)return;
    const text=txt.trim();
    if(!text){setTool('pointer');return}
    saveSnapshot();
    const cnt=overlays.filter(o=>o._type==='text').length+1;
    const ov=new AMap.Text({text,position:lnglat,anchor:'center',style:{'color':'#ffffff','font-size':'14px','background-color':'rgba(0,0,0,0.55)','padding':'3px 8px','border-radius':'4px','border':'1px solid rgba(255,255,255,0.25)'},zIndex:20});
    ov.setMap(map);
    ov._type='text';ov._name=text;ov._color='#ffffff';ov._stroke=0;ov._opacity=1;ov._speed=0;ov._direction=1;ov._desc='';ov._images=[];
    ov.on('click',()=>selectOv(ov));
    overlays.push(ov);
    updateUI();setTool('pointer');
    toast('✅ 已添加文字: '+text);
}

// 测面积：等距圆柱局部近似 + shoelace（校园尺度精度足够）
function polygonAreaMeters(path){
    if(!path||path.length<3)return 0;
    const R=6371000,k=R*Math.PI/180;
    let latSum=0;path.forEach(p=>latSum+=p[1]);
    const cos=Math.cos(latSum/path.length*Math.PI/180);
    const pts=path.map(p=>[p[0]*k*cos,p[1]*k]);
    let area=0;
    for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;area+=pts[i][0]*pts[j][1]-pts[j][0]*pts[i][1]}
    return Math.abs(area/2);
}
function formatArea(m2){
    if(m2>=1e6)return (m2/1e6).toFixed(2)+' 平方公里';
    return Math.round(m2)+' 平方米';
}

function selectOv(ov){
    if(currentTool!=='pointer')return;
    deselectOv();selectedOv=ov;selectedOv._images=selectedOv._images||[];
    if(ov._type==='marker'){
        ov.setContent(markerContent(ov._color,true));
    }else if(ov._type!=='text'){
        const base=ov._stroke||(ov instanceof AMap.Polyline?3:2);
        ov.setOptions({strokeWeight:base+3,strokeColor:'#ffd400'});
    }
    openEditorFor(ov);
    if(activeEditor)setShapeDraggable(ov,false);   // 只有开了编辑器(顶点编辑)才关整体拖拽；画框无编辑器，选中仍可拖
    document.getElementById('btn-delete').disabled=false;
    document.getElementById('btn-duplicate').disabled=false;
    document.getElementById('status-text').textContent='已选中: '+(ov._name||'');
    updateUI();updateProps();
}

function deselectOv(){
    if(!selectedOv)return;
    if(selectedOv._type==='marker'){
        selectedOv.setContent(markerContent(selectedOv._color,false));
    }else if(selectedOv._type!=='text'){
        const base=selectedOv._stroke||(selectedOv instanceof AMap.Polyline?3:2);
        selectedOv.setOptions({strokeWeight:base,strokeColor:selectedOv._color});
    }
    setShapeDraggable(selectedOv,true);   // 取消选中后恢复整体拖拽
    closeEditor();
    selectedOv=null;
    document.getElementById('btn-delete').disabled=true;
    document.getElementById('btn-duplicate').disabled=true;
    document.getElementById('status-text').textContent='就绪';
    updateUI();updateProps();
}

// —— 图形编辑器（拖动顶点 / 整体移动 / 缩放）——
function openEditorFor(ov){
    closeEditor();
    if(!ov||ov._type==='marker'||ov._type==='text')return;
    // 编辑前快照：真正发生编辑时才提交到历史，避免「只选中不改」污染撤销栈
    preEditSnapshot=captureOverlays();
    let ed=null;
    if(ov._type==='area'&&AMap.PolygonEditor){
        ed=new AMap.PolygonEditor(map,ov);
        // 吸附：编辑时顶点自动吸附到其它区域多边形的边/顶点，避免重叠或留缝
        const others=overlays.filter(o=>o!==ov&&o._type==='area');
        if(others.length&&typeof ed.addAdsorbPolygons==='function'){try{ed.addAdsorbPolygons(others)}catch(_){}}
    }
    else if(ov._type==='route'&&AMap.PolylineEditor)ed=new AMap.PolylineEditor(map,ov);
    else if(ov._type==='circle'&&AMap.CircleEditor)ed=new AMap.CircleEditor(map,ov);
    else if(ov._type==='rect'&&!ov._rotation&&AMap.RectangleEditor)ed=new AMap.RectangleEditor(map,ov);
    else if(ov._type==='ellipse'&&AMap.EllipseEditor)ed=new AMap.EllipseEditor(map,ov);
    if(ed){
        // AMap 2.0 折线编辑器需显式 setTarget 指定要编辑的覆盖物，
        // 否则 open() 后无目标、拖动顶点无效（表现为「路线不能编辑」）
        try{ed.setTarget(ov)}catch(_){}
        ed.on('adjust',commitPreEdit);ed.on('addnode',commitPreEdit);ed.on('removenode',commitPreEdit);
        try{ed.open()}catch(_){}
        activeEditor=ed;
    }else{
        preEditSnapshot=null;
    }
}
function closeEditor(){
    if(activeEditor){try{activeEditor.close()}catch(_){}activeEditor=null}
    preEditSnapshot=null;
}
function commitPreEdit(){
    if(preEditSnapshot===null)return;
    history=history.slice(0,historyIdx+1);history.push(preEditSnapshot);
    if(history.length>MAX_HISTORY)history.shift();
    historyIdx=history.length-1;
    preEditSnapshot=null;
    updateUI();
}
// 多边形 hover 高亮：鼠标悬停时提高填充透明度 + 加粗描边，移出还原
function bindAreaHover(ov){
    if(!ov||!ov.setOptions)return;
    const base=ov._opacity??0.2;
    ov.on('mouseover',()=>{if(currentTool!=='pointer'||selectedOv===ov)return;ov.setOptions({fillOpacity:Math.min(0.6,base+0.35),strokeWeight:(ov._stroke||2)+1})});
    ov.on('mouseout',()=>{if(selectedOv===ov)return;ov.setOptions({fillOpacity:base,strokeWeight:ov._stroke||2})});
}
function bindMarkerDrag(ov){
    if(!ov||!ov.setDraggable)return;
    ov.setDraggable(true);
    ov.on('dragstart',()=>{preEditSnapshot=captureOverlays()});
    ov.on('dragend',commitPreEdit);
}
// 搜索定位的临时标记：黄色光点，仅辅助定位，不进方案数据（下一次搜索/清除时移除）
function placeSearchMarker(lnglat, name){
    if(searchMarker){searchMarker.setMap(null);searchMarker=null;}
    searchMarker=new AMap.Marker({
        map, position:lnglat,
        content:'<div style="width:14px;height:14px;background:#ffd400;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px #ffd400,0 0 22px rgba(255,212,0,0.55)"></div>',
        offset:new AMap.Pixel(-7,-7), zIndex:300, title:name
    });
    toast('📍 定位到: '+(name||'目标点'));
}
// 整体拖动：区域/路线/画框/圆/椭圆等形状可整体拖动移动（选中后由编辑器负责顶点编辑，故选中时关掉拖拽避免冲突）
const DRAG_SHAPES=new Set(['route','area','rect','circle','ellipse']);   // 圆/椭圆的中心点即 getCenter()，持久化时读活值，无需像 rect 那样同步 _bounds
function bindWholeDrag(ov){
    if(!ov||!ov.setOptions||!DRAG_SHAPES.has(ov._type))return;
    ov.setOptions({draggable:true});
    ov.on('dragstart',()=>{
        preEditSnapshot=captureOverlays();
        // 记录拖动前路径：画框(rect)以 _bounds 为持久化源，dragend 需据此同步平移量
        ov._dragPath0 = ov.getPath ? ov.getPath().map(p=>[p.lng,p.lat]) : null;
    });
    ov.on('dragend',()=>{
        if(ov._type==='rect' && ov._dragPath0 && ov._bounds && ov.getPath){
            const np=ov.getPath().map(p=>[p.lng,p.lat]);
            if(np.length && ov._dragPath0.length){
                const dx=np[0][0]-ov._dragPath0[0][0];
                const dy=np[0][1]-ov._dragPath0[0][1];
                ov._bounds=[[ov._bounds[0][0]+dx,ov._bounds[0][1]+dy],[ov._bounds[1][0]+dx,ov._bounds[1][1]+dy]];
            }
        }
        ov._dragPath0=null;
        commitPreEdit();
    });
}
function setShapeDraggable(ov,on){
    if(!ov||!ov.setOptions||!DRAG_SHAPES.has(ov._type))return;
    ov.setOptions({draggable:on});
}

// Delete
document.getElementById('btn-delete').addEventListener('click',()=>{
    if(!selectedOv)return;
    const ov=selectedOv;
    stopReplay();saveSnapshot();
    deselectOv();                    // 先关编辑器（清掉顶点手柄/高亮），避免删除后残留图形
    map.remove(ov);
    overlays=overlays.filter(o=>o!==ov);
    document.getElementById('btn-delete').disabled=true;
    updateUI();toast('已删除');
});

// 复制图层（selectedOv 或指定图层）
function duplicateOverlay(source){
    if(!source)return;
    saveSnapshot();
    const type=source._type;
    const sw=source._stroke||(type==='route'?3:2),op=source._opacity;
    const D=0.00015;   // 副本偏移（约 15 米），避免与原图完全重叠，便于选中后拖动
    let ov;
    if(type==='marker'){
        const pos=source.getPosition();
        ov=new AMap.Marker({map,position:[pos.lng+D,pos.lat+D],content:markerContent(source._color,false),offset:new AMap.Pixel(-8,-8),title:source._name+' 副本'});
        ov._stroke=0;ov._opacity=1;
    }else if(type==='rect'){
        const b=rectBoundsOf(source);
        const nb=[[b[0][0]+D,b[0][1]+D],[b[1][0]+D,b[1][1]+D]];   // 直接偏移轴对齐包围盒，旋转矩形也能正确偏移
        ov=buildRectOv(nb, source._rotation||0, {_color:source._color,_stroke:sw,_opacity:op});
        ov.setMap(map);
    }else if(type==='circle'){
        const c=source.getCenter();
        ov=new AMap.Circle({map,center:[c.lng+D,c.lat+D],radius:source.getRadius(),strokeColor:source._color,strokeWeight:sw,fillColor:source._color,fillOpacity:op??0.2,zIndex:5});
    }else if(type==='ellipse'){
        const c=source.getCenter(),r=source.getRadius();
        ov=new AMap.Ellipse({map,center:[c.lng+D,c.lat+D],radius:Array.isArray(r)?r:[r,r],strokeColor:source._color,strokeWeight:sw,fillColor:source._color,fillOpacity:op??0.2,zIndex:5});
    }else if(type==='text'){
        const pos=source.getPosition();
        ov=new AMap.Text({map,text:source._name+' 副本',position:[pos.lng+D,pos.lat+D],anchor:'center',style:{'color':'#ffffff','font-size':'14px','background-color':'rgba(0,0,0,0.55)','padding':'3px 8px','border-radius':'4px','border':'1px solid rgba(255,255,255,0.25)'},zIndex:20});
    }else{
        const path=source.getPath().map(p=>[p.lng+D,p.lat+D]);
        if(type==='route')ov=new AMap.Polyline({map,path,strokeColor:source._color,strokeWeight:sw,strokeOpacity:op??0.9,zIndex:10});
        else ov=new AMap.Polygon({map,path,strokeColor:source._color,strokeWeight:sw,fillColor:source._color,fillOpacity:op??0.2,zIndex:5});
    }
    ov._type=type;ov._name=source._name+' 副本';ov._color=source._color;ov._stroke=sw;ov._opacity=op;ov._speed=source._speed;ov._direction=source._direction;ov._desc=source._desc;ov._rotation=source._rotation||0;ov._images=(source._images||[]).slice();
    ov.on('click',()=>selectOv(ov));
    if(type==='marker')bindMarkerDrag(ov);
    else bindWholeDrag(ov);
    if(type==='area')bindAreaHover(ov);
    overlays.push(ov);updateUI();
    toast('已复制（已偏移 15 米，直接拖动即可移动）');
}
document.getElementById('btn-duplicate').addEventListener('click',()=>{ if(selectedOv)duplicateOverlay(selectedOv); });

// Z-order
document.getElementById('btn-bring-front').addEventListener('click',()=>{
    if(!selectedOv)return;
    saveSnapshot();
    const idx=overlays.indexOf(selectedOv);
    if(idx>=0&&idx<overlays.length-1){overlays.splice(idx,1);overlays.push(selectedOv);}
    overlays.forEach((o,i)=>{if(o.setOptions)o.setOptions({zIndex:(i+1)*10})});
    updateUI();
});

document.getElementById('btn-send-back').addEventListener('click',()=>{
    if(!selectedOv)return;
    saveSnapshot();
    const idx=overlays.indexOf(selectedOv);
    if(idx>0){overlays.splice(idx,1);overlays.unshift(selectedOv);}
    overlays.forEach((o,i)=>{if(o.setOptions)o.setOptions({zIndex:(i+1)*10})});
    updateUI();
});

// Properties panel
function updateProps(){
    const section=document.getElementById('props-section');
    if(!selectedOv){section.style.display='none';return}
    section.style.display='block';
    document.getElementById('prop-name').value=selectedOv._name||'';
    document.getElementById('prop-color').value=selectedOv._color||'#3b82f6';
    const isMarker=selectedOv._type==='marker';
    const isText=selectedOv._type==='text';
    const isRoute=selectedOv._type==='route';
    document.getElementById('prop-stroke').closest('.prop-row').style.display=(isMarker||isText)?'none':'';
    document.getElementById('prop-opacity').closest('.prop-row').style.display=(isMarker||isText)?'none':'';
    document.getElementById('prop-speed').closest('.prop-row').style.display=isRoute?'':'none';
    document.getElementById('prop-direction').closest('.prop-row').style.display=isRoute?'':'none';
    document.getElementById('prop-rotation-row').style.display=(selectedOv._type==='rect')?'':'none';
    document.getElementById('prop-rotation').value=selectedOv._rotation||0;
    document.getElementById('prop-rotation-val').textContent=(selectedOv._rotation||0)+'°';
    document.getElementById('prop-desc').closest('.prop-row').style.display=(isMarker||isText)?'none':'';
    document.getElementById('prop-color').closest('.prop-row').style.display=isText?'none':'';
    document.getElementById('color-presets').style.display=isText?'none':'';
    const isLine=selectedOv instanceof AMap.Polyline;
    document.getElementById('prop-stroke').value=selectedOv._stroke||(isLine?3:2);
    document.getElementById('prop-opacity').value=Math.round((selectedOv._opacity??(isLine?0.9:0.2))*100);
    const spd=selectedOv._speed??0.9;
    document.getElementById('prop-speed').value=Math.round(spd*10);
    document.getElementById('prop-speed-val').textContent=spd.toFixed(1);
    document.getElementById('prop-direction').value=String(selectedOv._direction??1);
    document.getElementById('prop-desc').value=selectedOv._desc||'';
    if(isMarker){
        const pos=selectedOv.getPosition();
        document.getElementById('prop-points-info').textContent='坐标: '+pos.lng.toFixed(6)+', '+pos.lat.toFixed(6);
    }else if(isText){
        const pos=selectedOv.getPosition();
        document.getElementById('prop-points-info').textContent='文字标注 · 坐标: '+pos.lng.toFixed(6)+', '+pos.lat.toFixed(6);
    }else if(selectedOv._type==='rect'){
        document.getElementById('prop-points-info').textContent='矩形（两个对角点）';
    }else if(selectedOv._type==='circle'){
        document.getElementById('prop-points-info').textContent='半径: '+Math.round(selectedOv.getRadius())+' 米';
    }else if(selectedOv._type==='ellipse'){
        const rr=selectedOv.getRadius();
        document.getElementById('prop-points-info').textContent='椭圆轴: '+(Array.isArray(rr)?Math.round(rr[0])+' × '+Math.round(rr[1]):'')+' 米';
    }else{
        document.getElementById('prop-points-info').textContent='顶点: '+(selectedOv.getPath?selectedOv.getPath().length:'-')+' 个';
    }
    renderPropImages();
}

document.getElementById('prop-direction').addEventListener('change',function(){

    saveSnapshot();
    selectedOv._direction=Number(this.value);

let _rotating=false;
document.getElementById('prop-rotation').addEventListener('input',function(){
    if(!selectedOv||selectedOv._type!=='rect')return;
    const v=Number(this.value);
    document.getElementById('prop-rotation-val').textContent=v+'°';
    if(!_rotating){ saveSnapshot(); _rotating=true; }  // 旋转前推入一次快照（连续拖动只记一次撤销）
    const old=selectedOv;
    closeEditor();
    if(old._type!=='text'){ old.setOptions({strokeWeight:old._stroke||2,strokeColor:old._color}); }

// —— 元素图片：多张上传，base64 存进方案数据，首页点击放大 ——
function optimizeImg(dataUrl, maxDim){
    maxDim=maxDim||1400;
    return new Promise(resolve=>{
        const img=new Image();
        img.onload=()=>{
            const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
            const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
            const c=document.createElement('canvas');c.width=w;c.height=h;
            c.getContext('2d').drawImage(img,0,0,w,h);
            resolve(c.toDataURL('image/jpeg',0.82));
        };
        img.onerror=()=>resolve(dataUrl);
        img.src=dataUrl;
    });
}
function renderPropImages(){
    const box=document.getElementById('prop-images-thumbs');
    if(!box)return;

    box.innerHTML='';

}

async function doSave(token,name){
    const routes={},areas={},markers={},rects={},circles={},ellipses={},texts={};
    let skipped=0;
    overlays.forEach(o=>{
        const imgs=o._images||[];
        if(o._type==='marker'){
            const pos=o.getPosition();
            markers[o._name]={lng:pos.lng,lat:pos.lat,color:o._color||'#f59e0b',images:imgs};
            return;
        }
        if(o._type==='rect'){
            const b=rectBoundsOf(o);
            rects[o._name]={bounds:b,rotation:o._rotation||0,color:o._color||'#8b5cf6',strokeWidth:o._stroke||2,opacity:o._opacity??0.2,desc:o._desc||'',images:imgs};
            return;
        }
        if(o._type==='circle'){
            const c=o.getCenter();
            circles[o._name]={center:[c.lng,c.lat],radius:o.getRadius(),color:o._color||'#ec4899',strokeWidth:o._stroke||2,opacity:o._opacity??0.2,desc:o._desc||'',images:imgs};
            return;
        }
        if(o._type==='ellipse'){
            const c=o.getCenter(),r=o.getRadius();
            ellipses[o._name]={center:[c.lng,c.lat],radius:Array.isArray(r)?r:[r,r],color:o._color||'#06b6d4',strokeWidth:o._stroke||2,opacity:o._opacity??0.2,desc:o._desc||'',images:imgs};
            return;
        }
        if(o._type==='text'){
            const pos=o.getPosition();
            texts[o._name]={lng:pos.lng,lat:pos.lat,color:o._color||'#ffffff',images:imgs};
            return;
        }
        const pts=o.getPath().map(p=>[p.lng,p.lat]);
        if(o._type==='route'){
            if(pts.length<2){skipped++;return}
            routes[o._name]={pts,color:o._color||'#3b82f6',strokeWidth:o._stroke||3,opacity:o._opacity??0.9,speed:o._speed??0.9,direction:o._direction??1,desc:o._desc||'',images:imgs};
        }else{
            if(pts.length<3){skipped++;return}
            areas[o._name]={pts,color:o._color||'#10b981',strokeWidth:o._stroke||2,opacity:o._opacity??0.2,desc:o._desc||'',images:imgs};
        }
    });
    const data={kind:'map',routes,areas,markers,rects,circles,ellipses,texts};
    const isNew=!currentPlanId;
    const url='/api/editor/projects'+(isNew?'':'/'+currentPlanId);
    try{
        const r=await fetch(url,{method:isNew?'POST':'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name,data})});
        const j=await r.json();
        if(r.ok){
            if(isNew&&j.id)currentPlanId=j.id;
            document.getElementById('sb-name').textContent=name||'未命名方案';
            await loadPlans();
            toast('✅ 已保存「'+(name||'')+'」'+(skipped?('，跳过 '+skipped+' 个无效图形'):''));
        }else toast('❌ 保存失败: '+(j.error||('HTTP '+r.status)));
    }catch(e){toast('❌ 网络错误')}
}

// ========================================================
// 轨迹回放：逐条播放路线（图层列表每条路线一个 ▶，点击播放 / 再点停止）
// ========================================================
let replay = { active: false, raf: null, marker: null, trail: null, route: null };

function _distMeters(a, b) {
    const R = 6371000, k = R * Math.PI / 180;
    const dx = (b[0] - a[0]) * k * Math.cos((a[1] + b[1]) / 2 * Math.PI / 180);
    const dy = (b[1] - a[1]) * k;
    return Math.sqrt(dx * dx + dy * dy);
}

function stopReplay() {
    replay.active = false;
    if (replay.raf) { cancelAnimationFrame(replay.raf); replay.raf = null; }
    if (replay.marker) { try { replay.marker.setMap(null); } catch (_) {} replay.marker = null; }
    if (replay.trail) { try { replay.trail.setMap(null); } catch (_) {} replay.trail = null; }
    replay.route = null;
    updateReplayUI();
}

function playRoute(ov) {
    if (!ov || ov._type !== 'route' || !ov.getPath) return;
    // 再次点击同一条 → 停止
    if (replay.active && replay.route === ov) { stopReplay(); return; }
    let pts = ov.getPath().map(p => [p.lng, p.lat]);
    if (pts.length < 2) { toast('⚠️ 路线点不足'); return; }
    if (ov._direction === -1) pts = pts.slice().reverse();
    stopReplay();

    const segments = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
        const len = _distMeters(pts[i], pts[i + 1]);
        total += len;
        segments.push({ p0: pts[i], p1: pts[i + 1], len, cum: total });
    }
    if (!segments.length || total <= 0) { toast('⚠️ 路线无有效点'); return; }

    const color = ov._color || '#ffd400';
    replay.marker = new AMap.Marker({
        map, position: segments[0].p0,
        content: '<div class="replay-dot" style="background:' + color + ';box-shadow:0 0 12px ' + color + ';"></div>',
        offset: new AMap.Pixel(-9, -9), zIndex: 300,
    });
    replay.trail = new AMap.Polyline({ map, path: [segments[0].p0], strokeColor: color, strokeWeight: 4, strokeOpacity: 0.85, zIndex: 299 });
    replay.route = ov;
    replay.active = true;
    updateReplayUI();

    const speed = Math.max(0.2, Number(ov._speed) || 0.9);
    const DURATION = Math.max(5000, Math.min(30000, total * 0.35 / speed));
    const t0 = performance.now();
    const step = (now) => {
        if (!replay.active) return;
        const t = Math.min(1, (now - t0) / DURATION);
        const cut = t * total;
        let pos = null;
        for (const s of segments) { if (cut <= s.cum) { const f = s.len ? (cut - (s.cum - s.len)) / s.len : 0; pos = [s.p0[0] + (s.p1[0] - s.p0[0]) * f, s.p0[1] + (s.p1[1] - s.p0[1]) * f]; break; } }
        if (!pos) pos = segments[segments.length - 1].p1;
        replay.marker.setPosition(pos);
        const trailPts = [];
        for (const s of segments) { if (s.cum < cut) trailPts.push(s.p0); }
        trailPts.push(pos);
        replay.trail.setPath(trailPts);
        if (t >= 1) { stopReplay(); return; }
        replay.raf = requestAnimationFrame(step);
    };
    replay.raf = requestAnimationFrame(step);
}

function updateReplayUI() {
    document.querySelectorAll('#layer-list .layer-replay').forEach(b => {
        const idx = parseInt(b.dataset.index, 10);
        const ov = overlays[idx];
        const playing = replay.active && replay.route === ov;
        b.textContent = playing ? '⏹' : '▶';
        b.style.color = playing ? '#ef4444' : 'rgba(255,255,255,0.45)';
        b.title = playing ? '停止回放' : '轨迹回放';
    });
}

initMap().catch(err=>{document.getElementById('map-wrap').textContent='地图加载失败: '+err.message});
})();
</script>
</body>
