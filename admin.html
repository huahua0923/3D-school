﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>后台配置 · 会展中心导览</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Inter', 'Microsoft YaHei', system-ui, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; height: 100vh; overflow: hidden;
}
a { color: #58a6ff; }

/* -- Login overlay -- */
#login-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: #0d1117;
    display: flex; align-items: center; justify-content: center;
}
#login-overlay.hidden { display: none; }
.login-box {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 40px 36px; width: 360px; text-align: center;
}
.login-box h1 { font-size: 1.4rem; margin-bottom: 6px; color: #f0f6fc; }
.login-box p { font-size: 0.85rem; color: #8b949e; margin-bottom: 24px; }
.login-box input {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #30363d; background: #0d1117; color: #f0f6fc;
    font-size: 1rem; font-family: inherit; outline: none; margin-bottom: 16px;
}
.login-box input:focus { border-color: #58a6ff; }
.login-box button {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: #238636; color: #fff; font-size: 1rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
}
.login-box button:hover { background: #2ea043; }
.login-box .err { color: #f85149; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }

/* -- Sidebar -- */
#sidebar {
    width: 200px; min-width: 200px; background: #161b22;
    border-right: 1px solid #30363d; padding: 20px 0;
    display: flex; flex-direction: column;
}
#sidebar .logo { padding: 0 20px 16px; font-size: 1.1rem; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #21262d; margin-bottom: 8px; }
#sidebar nav button {
    display: block; width: 100%; text-align: left; padding: 10px 20px;
    border: none; background: none; color: #8b949e; font-size: 0.9rem;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
    border-left: 3px solid transparent;
}
#sidebar nav button:hover { color: #f0f6fc; background: #1c2128; }
#sidebar nav button.active { color: #f0f6fc; border-left-color: #58a6ff; background: #1c2128; }

/* -- Main content -- */
#main { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* -- Top bar -- */
#topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #21262d;
}
#topbar h2 { font-size: 1.25rem; color: #f0f6fc; }
#topbar .actions { display: flex; gap: 10px; }
#topbar .actions button {
    padding: 8px 18px; border-radius: 8px; border: none; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-save { background: #238636; color: #fff; }
.btn-save:hover { background: #2ea043; }
.btn-preview { background: #1f6feb; color: #fff; }
.btn-preview:hover { background: #388bfd; }
.btn-logout { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
.btn-logout:hover { color: #f0f6fc; }

/* -- Form panels -- */
.panel { display: none; }
.panel.active { display: block; }

/* -- Section card -- */
.section {
    background: #161b22; border: 1px solid #21262d; border-radius: 10px;
    padding: 20px 24px; margin-bottom: 20px;
}
.section h3 { font-size: 1rem; color: #f0f6fc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

/* -- Form grid -- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 0.78rem; color: #8b949e; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
.form-group input, .form-group textarea, .form-group select {
    padding: 8px 10px; border-radius: 6px; border: 1px solid #30363d;
    background: #0d1117; color: #f0f6fc; font-size: 0.88rem; font-family: inherit; outline: none;
}
.form-group input:focus, .form-group textarea:focus { border-color: #58a6ff; }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group .color-input { display: flex; align-items: center; gap: 8px; }
.form-group .color-input input[type="color"] { width: 36px; height: 36px; padding: 0; border: none; cursor: pointer; border-radius: 4px; }
.form-group .color-input input[type="text"] { flex: 1; }

/* -- Features list (entrance editor) -- */
.feature-list { display: flex; flex-direction: column; gap: 6px; }
.feature-row { display: flex; gap: 8px; align-items: center; }
.feature-row input { flex: 1; }
.feature-row button {
    padding: 4px 10px; border-radius: 4px; border: 1px solid #30363d;
    background: #21262d; color: #f85149; cursor: pointer; font-size: 0.8rem;
}
.feature-row button:hover { background: #da3633; color: #fff; }
.btn-add-feat {
    padding: 6px 14px; border-radius: 6px; border: 1px dashed #30363d;
    background: none; color: #8b949e; cursor: pointer; font-size: 0.82rem;
    align-self: flex-start; margin-top: 4px;
}
.btn-add-feat:hover { border-color: #58a6ff; color: #58a6ff; }
.btn-del {
    padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d;
    background: #21262d; color: #f85149; cursor: pointer; font-size: 0.82rem;
    margin-top: 12px;
}
.btn-del:hover { background: #da3633; color: #fff; border-color: #da3633; }

/* -- Logo uploader -- */
.logo-uploader { display: flex; align-items: center; gap: 12px; }
.logo-preview {
    width: 52px; height: 52px; flex: none; border-radius: 8px;
    background: #fff; border: 1px solid #30363d;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.logo-preview img { width: 100%; height: 100%; object-fit: contain; padding: 4px; box-sizing: border-box; }
.logo-preview span { font-size: 1.6rem; }
.logo-actions { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.logo-actions input[type="text"] { width: 100%; }
.btn-file {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 7px 14px; border-radius: 6px; border: 1px dashed #30363d;
    background: none; color: #58a6ff; font-size: 0.85rem; align-self: flex-start;
}
.btn-file:hover { border-color: #58a6ff; background: #1c2128; }
.btn-file input[type="file"] { display: none; }
.logo-clear { margin-top: 0; }

/* -- Route points editor -- */
.point-list { display: flex; flex-direction: column; gap: 6px; }
.point-row { display: flex; gap: 8px; align-items: center; }
.point-row input { width: 80px; }

/* -- Sub-buildings -- */
.sub-list { display: flex; flex-direction: column; gap: 12px; }

/* -- Status bar -- */
#statusbar {
    padding: 12px 24px; background: #161b22; border-top: 1px solid #21262d;
    font-size: 0.82rem; color: #8b949e; display: flex; align-items: center; justify-content: space-between;
    position: fixed; bottom: 0; left: 200px; right: 0;
}
#statusbar .success { color: #3fb950; }
#statusbar .error { color: #f85149; }

/* -- Toast -- */
#toast {
    position: fixed; top: 20px; right: 20px; z-index: 200;
    padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
#toast.show { opacity: 1; }
#toast.ok { background: #238636; color: #fff; }
#toast.err { background: #da3633; color: #fff; }

@media (max-width: 768px) {
    #sidebar { width: 140px; min-width: 140px; }
    #main { padding: 16px; }
    #statusbar { left: 140px; }
    .form-grid { grid-template-columns: 1fr; }
}

#sidebar nav a.nav-link {
    display: block; text-align: left; padding: 10px 20px;
    border: none; background: none; color: #8b949e;
    font-size: 0.9rem; cursor: pointer; font-family: inherit;
    transition: all 0.15s; border-left: 3px solid transparent;
    text-decoration: none;
}
#sidebar nav a.nav-link:hover { color: #f0f6fc; background: #1c2128; }
#sidebar nav a.nav-link.active { color: #f0f6fc; border-left-color: #58a6ff; background: #1c2128; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-overlay">
    <div class="login-box">
        <h1>⚙️ 后台配置</h1>
        <p>会展中心 3D 导览管理系统</p>
        <input type="text" id="login-user" placeholder="用户名" value="admin" autocomplete="username" />
        <input type="password" id="login-pwd" placeholder="密码" autocomplete="current-password" autofocus />
        <button id="login-btn">登 录</button>
        <div class="err" id="login-err"></div>
    </div>
</div>

<!-- Sidebar -->
<div id="sidebar">
    <div class="logo">🏛️ 导览配置</div>
    <nav>
    <button class="active" data-panel="brand">⚙️ 系统配置</button>
    <button data-panel="building">🏢 建筑 & 场景</button>
    <button data-panel="markers">📍 标记点</button>
    <button data-panel="routes">🛤️ 路线</button>
    <button data-panel="areas">🗺️ 区域</button>
    <button data-panel="camera">📷 相机</button>
    <button data-panel="geo">🌍 地理信息</button>
    <button data-panel="plans">📋 方案</button>
    <button data-panel="users">👥 用户管理</button>
    <a href="admin-map.html" class="nav-link">🗺️ 路线图编辑</a>
    <a href="editor.html" class="nav-link">✏️ 室内编辑</a>
</nav>
</div>

<!-- Main -->
<div id="main">
    <div id="topbar">
        <h2 id="panel-title">📐 建筑 & 场景</h2>
        <div class="actions">
            <button class="btn-preview" onclick="preview()">👁️ 预览</button>
            <button class="btn-save" onclick="saveConfig()">💾 保存配置</button>
            <button class="btn-logout" onclick="logout()">退出</button>
        </div>
    </div>

    <!-- ====== Building Panel ====== -->
    
    <!-- ====== Brand Panel ====== -->
    <div class="panel active" id="panel-brand">
        <div class="section"><h3>🏷️ 品牌信息</h3>
            <div class="form-grid" id="form-brand"></div>
        </div>
    </div>

    <div class="panel" id="panel-building">
        <div class="section"><h3>🏢 主建筑</h3>
            <div class="form-grid" id="form-main-building"></div>
        </div>
        <div class="section"><h3>🏗️ 配楼</h3>
            <div class="sub-list" id="form-subs"></div>
        </div>
        <div class="section"><h3>🛣️ 其他</h3>
            <div class="form-grid" id="form-scene"></div>
        </div>
    </div>

    <!-- ====== Markers Panel ====== -->
    <div class="panel" id="panel-markers">
        <div id="form-markers"></div>
    </div>

    <!-- ====== Routes Panel ====== -->
    <div class="panel" id="panel-routes">
        <div id="form-routes"></div>
    </div>

    <!-- ====== Areas Panel ====== -->
    <div class="panel" id="panel-areas">
        <div id="form-areas"></div>
    </div>

    <!-- ====== Camera Panel ====== -->
    <div class="panel" id="panel-camera">
        <div class="section"><h3>📷 相机参数</h3>
            <div class="form-grid" id="form-camera-params"></div>
        </div>
        <div class="section"><h3>🎯 视角预设</h3>
            <div id="form-presets"></div>
        </div>
    </div>

    <!-- ====== Geo Panel ====== -->
    <div class="panel" id="panel-geo">
        <div class="section"><h3>🌍 高德地图设置</h3>
            <div class="form-grid" id="form-geo"></div>
        </div>
    </div>

    <!-- ====== Plans Panel ====== -->
    <div class="panel" id="panel-plans">
        <div id="form-plans"></div>
    </div>

    <!-- ====== Users Panel ====== -->
    <div class="panel" id="panel-users">
        <div id="form-users"></div>
    </div>
</div>

<!-- Status bar -->
<div id="statusbar">
    <span id="status-text">就绪</span>
    <span id="status-time"></span>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ============================================================
// Admin Panel JS
// ============================================================

let config = null;
let mapPlans = [];   // 地图方案（kind='map'）数据，供「标记点/路线/区域」面板显示真实数据
let token = localStorage.getItem('admin_token') || '';
let currentRole = '';

function authHeaders() {
    return token ? { 'Authorization': 'Bearer ' + token } : {};
}

// ---------- Auth ----------
async function login() {
    const username = (document.getElementById('login-user').value || '').trim();
    const pwd = document.getElementById('login-pwd').value;
    const errEl = document.getElementById('login-err');
    try {
        const resp = await fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username || 'admin', password: pwd }),
        });
        const data = await resp.json();
        if (!resp.ok) { errEl.textContent = data.error || '登录失败'; return; }
        if (data.role !== 'admin') { errEl.textContent = '该账号不是管理员，无法进入后台'; return; }
        token = data.token;
        currentRole = data.role;
        localStorage.setItem('admin_token', token);
        document.getElementById('login-overlay').classList.add('hidden');
        await loadConfig();
    } catch (e) {
        errEl.textContent = '网络错误: ' + e.message;
    }
}

function logout() {
    token = '';
    localStorage.removeItem('admin_token');
    document.getElementById('login-overlay').classList.remove('hidden');
}

// Enter key to login
document.getElementById('login-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('login-user').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('login-btn').addEventListener('click', login);

// ---------- Tab switching ----------

    // Default to brand panel
    document.getElementById('panel-brand').classList.add('active');
    document.getElementById('panel-building').classList.remove('active');
    document.querySelectorAll('#sidebar nav button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#sidebar nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
        document.getElementById('panel-title').textContent = btn.textContent;
        renderAll(); // re-render
    });
});

// ---------- Config loading ----------
async function loadConfig() {
    try {
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        const resp = await fetch('/api/config', { headers });
        if (resp.status === 401) { logout(); return; }
        config = await resp.json();
        renderAll();
        loadMapPlans();   // 异步拉取地图方案，刷新「标记点/路线/区域」面板
    } catch (e) {
        showToast('加载配置失败: ' + e.message, 'err');
    }
}

// ---------- Save ----------
async function saveConfig() {
    collectAll();
    try {
        const resp = await fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(config),
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        if (resp.ok) {
            showToast('✅ 配置已保存', 'ok');
            document.getElementById('status-time').textContent = '上次保存: ' + new Date(data.time).toLocaleString();
        } else {
            showToast('❌ ' + (data.error || '保存失败'), 'err');
        }
    } catch (e) {
        showToast('网络错误: ' + e.message, 'err');
    }
}

function preview() { window.open('/', '_blank'); }

// ---------- Toast ----------
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = type + ' show';
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ---------- Form helpers ----------
function fld(key, label, type = 'text', opts = {}) {
    const isColor = type === 'color';
    let inputHtml;
    if (isColor) {
        inputHtml = `<div class="color-input">
            <input type="color" value="${opts.value || '#000000'}" onchange="updateNested(config, '${key}', this.value)" />
            <input type="text" value="${opts.value || ''}" onchange="updateNested(config, '${key}', this.value)" />
        </div>`;
    } else if (type === 'textarea') {
        inputHtml = `<textarea onchange="updateNested(config, '${key}', this.value)">${opts.value || ''}</textarea>`;
    } else {
        inputHtml = `<input type="${type}" value="${opts.value || ''}" step="${opts.step || 'any'}"${opts.min !== undefined ? ` min="${opts.min}"` : ''}${opts.max !== undefined ? ` max="${opts.max}"` : ''} onchange="updateNested(config, '${key}', this.type === 'number' ? +this.value : this.value)" />`;
    }
    return `<div class="form-group"><label>${label}</label>${inputHtml}</div>`;
}

function updateNested(obj, path, value) {
    const keys = path.split('.');
    let cur = obj;
    for (let i = 0; i < keys.length - 1; i++) {
        if (keys[i].includes('[')) {
            const [name, idx] = keys[i].split('[');
            cur = cur[name][parseInt(idx)];
        } else {
            cur = cur[keys[i]];
        }
    }
    const lastKey = keys[keys.length - 1];
    if (lastKey.includes('[')) {
        const [name, idx] = lastKey.split('[');
        cur[name][parseInt(idx)] = value;
    } else {
        cur[lastKey] = value;
    }
}

function getNested(obj, path) {
    const keys = path.split('.');
    let cur = obj;
    for (const k of keys) {
        if (k.includes('[')) {
            const [name, idx] = k.split('[');
            cur = cur[name] ? cur[name][parseInt(idx)] : undefined;
        } else {
            cur = cur ? cur[k] : undefined;
        }
        if (cur === undefined) return '';
    }
    return cur;
}

// ---------- Add / Delete helpers ----------
function addMarker() {
    const k = prompt('新标记的 key（英文，如 entrance）');
    if (!k || !k.trim()) return;
    config.markers = config.markers || {};
    if (config.markers[k]) { alert('该 key 已存在'); return; }
    config.markers[k] = { label: '新标记', icon: '📍', badge: '', color: '#4ea1ff', pos: [0, 0, 30], desc: '', features: [] };
    renderMarkers();
}
function delMarker(key) { if (confirm('删除标记「' + key + '」？')) { delete config.markers[key]; renderMarkers(); saveConfig(); } }

function addRoute() {
    const k = prompt('新路线的 key（如 public / vip）');
    if (!k || !k.trim()) return;
    config.routes = config.routes || {};
    if (config.routes[k]) { alert('该 key 已存在'); return; }
    config.routes[k] = { color: '#4ea1ff', speed: 2, strokeWidth: 3, opacity: 1, pts: [[0, 0.6, 0]] };
    renderRoutes();
}
function delRoute(key) { if (confirm('删除路线「' + key + '」？')) { delete config.routes[key]; renderRoutes(); saveConfig(); } }

function addArea() {
    const k = prompt('新区域的 key（英文）');
    if (!k || !k.trim()) return;
    config.areas = config.areas || {};
    if (config.areas[k]) { alert('该 key 已存在'); return; }
    config.areas[k] = { color: '#10b981', strokeWidth: 2, opacity: 0.2, pts: [[104.14, 30.67], [104.141, 30.671]] };
    renderAreas();
}
function delArea(key) { if (confirm('删除区域「' + key + '」？')) { delete config.areas[key]; renderAreas(); saveConfig(); } }

function addPreset() {
    const k = prompt('新视角预设的名称（如 overview）');
    if (!k || !k.trim()) return;
    config.camera.presets = config.camera.presets || {};
    if (config.camera.presets[k]) { alert('该预设已存在'); return; }
    config.camera.presets[k] = { pos: [70, 50, 80], target: [0, 4, 0] };
    renderCamera();
}
function delPreset(key) { if (confirm('删除预设「' + key + '」？')) { delete config.camera.presets[key]; renderCamera(); saveConfig(); } }

function addSub() {
    config.building.subs = config.building.subs || [];
    config.building.subs.push({ w: 4, d: 4, h: 4, x: 15, z: 0, color: '#2a3f7a' });
    renderBuilding();
}
function delSub(i) { config.building.subs.splice(i, 1); renderBuilding(); }

const DEFAULT_MAIN = { w: 10, d: 10, h: 10, color: '#1e2d5a', pos: [0, 0, 0] };
function delMain() { if (confirm('删除主建筑？首页将不再显示。')) { config.building.main = null; renderBuilding(); saveConfig(); } }
function restoreMain() { config.building.main = Object.assign({}, DEFAULT_MAIN); renderBuilding(); saveConfig(); }
function delRoad() { if (confirm('删除道路？首页将不再显示道路/场地高亮。')) { config.building.roadVisible = false; renderBuilding(); saveConfig(); } }
function restoreRoad() { config.building.roadVisible = true; renderBuilding(); saveConfig(); }

// ---------- Render functions ----------
function renderAll() {
    if (!config) return;
    renderBrand();
    renderBuilding();
    renderMarkers();
    renderRoutes();
    renderAreas();
    renderCamera();
    renderGeo();
    renderPlans();
    renderUsers();
}


function renderBrand() {
    var b = config.brand || {name:'',subtitle:'',logo:'',logoText:''};
    var logoImg = /^(data:image|https?:\/\/)/i.test(b.logo || '') ? b.logo : '';
    var logoText = b.logoText || '';
    document.getElementById('form-brand').innerHTML =
        fld('brand.name', '项目名称', 'text', {value:b.name||''}) +
        fld('brand.subtitle', '副标题', 'text', {value:b.subtitle||''}) +
        `<div class="form-group"><label>Logo 图片</label>
            <div class="logo-uploader">
                <div class="logo-preview">${logoImg ? `<img src="${escHtml(logoImg)}" alt="logo" onload="applyLogoBg(this)"/>` : `<span style="font-size:0.8rem;color:#8b949e;">未上传</span>`}</div>
                <div class="logo-actions">
                    <label class="btn-file">📁 上传图片<input type="file" accept="image/*" onchange="handleLogoUpload(this)"/></label>

function applyLogoBg(img) {
    try {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) return;
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var d = ctx.getImageData(0, 0, w, h).data;
        var sum = 0, n = 0;
        for (var i = 0; i < d.length; i += 4) {
            if (d[i + 3] > 10) { sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
        }
        if (!n) return;
        var preview = img.closest('.logo-preview');
        if (preview) {
            preview.style.background = (sum / n > 165) ? '#0b1220' : '#ffffff';
        }
    } catch (e) { /* 保持默认白底 */ }
}

function handleLogoUpload(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { alert('请选择图片文件'); return; }
    var reader = new FileReader();
    reader.onload = function(e) {
        var dataUrl = e.target.result;
        if (file.type === 'image/svg+xml') { config.brand.logo = dataUrl; renderBrand(); saveConfig(); return; }
        resizeLogo(dataUrl, 256, function(out) { config.brand.logo = out; renderBrand(); saveConfig(); });
    };
    reader.readAsDataURL(file);
}

function resizeLogo(dataUrl, maxSize, cb) {
    var img = new Image();
    img.onload = function() {
        var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/png'));
    };
    img.onerror = function() { cb(dataUrl); };
    img.src = dataUrl;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

        else showToast('❌ ' + (data.error || '重置失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

async function deleteUser(id, username) {
    if (!confirm('确定删除用户「' + username + '」？')) return;
    try {
        const resp = await fetch('/api/users/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token },
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) { showToast('✅ 用户已删除', 'ok'); renderUsers(); }
        else showToast('❌ ' + (data.error || '删除失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

function collectAll() {
    // All updates happen live via onchange, this is a no-op but kept for explicitness.
    // Ensure colors are valid hex strings
    for (const [, m] of Object.entries(config.markers)) {
        if (m.color && !m.color.startsWith('#')) m.color = '#' + m.color;
    }
    for (const [, r] of Object.entries(config.routes)) {
        if (r.color && !r.color.startsWith('#')) r.color = '#' + r.color;
    }
}

// ---------- Init ----------
(async () => {
    if (token) {
        // Verify token
        try {
            const resp = await fetch('/api/check', { headers: { 'Authorization': 'Bearer ' + token } });
            if (resp.ok) {
                document.getElementById('login-overlay').classList.add('hidden');
                await loadConfig();
                return;
            }
        } catch (_) {}
    }
    // Show login
    document.getElementById('login-overlay').classList.remove('hidden');
})();
</script>
