﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>后台配置 · 会展中心导览</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Inter', 'Microsoft YaHei', system-ui, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; height: 100vh; overflow: hidden;
}
a { color: #58a6ff; }

/* -- Login overlay -- */
#login-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: #0d1117;
    display: flex; align-items: center; justify-content: center;
}
#login-overlay.hidden { display: none; }
.login-box {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 40px 36px; width: 360px; text-align: center;
}
.login-box h1 { font-size: 1.4rem; margin-bottom: 6px; color: #f0f6fc; }
.login-box p { font-size: 0.85rem; color: #8b949e; margin-bottom: 24px; }
.login-box input {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #30363d; background: #0d1117; color: #f0f6fc;
    font-size: 1rem; font-family: inherit; outline: none; margin-bottom: 16px;
}
.login-box input:focus { border-color: #58a6ff; }
.login-box button {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: #238636; color: #fff; font-size: 1rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
}
.login-box button:hover { background: #2ea043; }
.login-box .err { color: #f85149; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }

/* -- Sidebar -- */
#sidebar {
    width: 200px; min-width: 200px; background: #161b22;
    border-right: 1px solid #30363d; padding: 20px 0;
    display: flex; flex-direction: column;
}
#sidebar .logo { padding: 0 20px 16px; font-size: 1.1rem; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #21262d; margin-bottom: 8px; }
#sidebar nav button {
    display: block; width: 100%; text-align: left; padding: 10px 20px;
    border: none; background: none; color: #8b949e; font-size: 0.9rem;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
    border-left: 3px solid transparent;
}
#sidebar nav button:hover { color: #f0f6fc; background: #1c2128; }
#sidebar nav button.active { color: #f0f6fc; border-left-color: #58a6ff; background: #1c2128; }

/* -- Main content -- */
#main { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* -- Top bar -- */
#topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #21262d;
}
#topbar h2 { font-size: 1.25rem; color: #f0f6fc; }
#topbar .actions { display: flex; gap: 10px; }
#topbar .actions button {
    padding: 8px 18px; border-radius: 8px; border: none; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-save { background: #238636; color: #fff; }
.btn-save:hover { background: #2ea043; }
.btn-preview { background: #1f6feb; color: #fff; }
.btn-preview:hover { background: #388bfd; }
.btn-logout { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
.btn-logout:hover { color: #f0f6fc; }

/* -- Form panels -- */
.panel { display: none; }
.panel.active { display: block; }

/* -- Section card -- */
.section {
    background: #161b22; border: 1px solid #21262d; border-radius: 10px;
    padding: 20px 24px; margin-bottom: 20px;
}
.section h3 { font-size: 1rem; color: #f0f6fc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

/* -- Form grid -- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 0.78rem; color: #8b949e; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
.form-group input, .form-group textarea, .form-group select {
    padding: 8px 10px; border-radius: 6px; border: 1px solid #30363d;
    background: #0d1117; color: #f0f6fc; font-size: 0.88rem; font-family: inherit; outline: none;
}
.form-group input:focus, .form-group textarea:focus { border-color: #58a6ff; }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group .color-input { display: flex; align-items: center; gap: 8px; }
.form-group .color-input input[type="color"] { width: 36px; height: 36px; padding: 0; border: none; cursor: pointer; border-radius: 4px; }
.form-group .color-input input[type="text"] { flex: 1; }

/* -- Features list (entrance editor) -- */
.feature-list { display: flex; flex-direction: column; gap: 6px; }
.feature-row { display: flex; gap: 8px; align-items: center; }
.feature-row input { flex: 1; }
.feature-row button {
    padding: 4px 10px; border-radius: 4px; border: 1px solid #30363d;
    background: #21262d; color: #f85149; cursor: pointer; font-size: 0.8rem;
}
.feature-row button:hover { background: #da3633; color: #fff; }
.btn-add-feat {
    padding: 6px 14px; border-radius: 6px; border: 1px dashed #30363d;
    background: none; color: #8b949e; cursor: pointer; font-size: 0.82rem;
    align-self: flex-start; margin-top: 4px;
}
.btn-add-feat:hover { border-color: #58a6ff; color: #58a6ff; }
.btn-del {
    padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d;
    background: #21262d; color: #f85149; cursor: pointer; font-size: 0.82rem;
    margin-top: 12px;
}
.btn-del:hover { background: #da3633; color: #fff; border-color: #da3633; }

/* -- Logo uploader -- */
.logo-uploader { display: flex; align-items: center; gap: 12px; }
.logo-preview {
    width: 52px; height: 52px; flex: none; border-radius: 8px;
    background: #fff; border: 1px solid #30363d;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.logo-preview img { width: 100%; height: 100%; object-fit: contain; padding: 4px; box-sizing: border-box; }
.logo-preview span { font-size: 1.6rem; }
.logo-actions { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.logo-actions input[type="text"] { width: 100%; }
.btn-file {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 7px 14px; border-radius: 6px; border: 1px dashed #30363d;
    background: none; color: #58a6ff; font-size: 0.85rem; align-self: flex-start;
}
.btn-file:hover { border-color: #58a6ff; background: #1c2128; }
.btn-file input[type="file"] { display: none; }
.logo-clear { margin-top: 0; }

/* -- Route points editor -- */
.point-list { display: flex; flex-direction: column; gap: 6px; }
.point-row { display: flex; gap: 8px; align-items: center; }
.point-row input { width: 80px; }

/* -- Sub-buildings -- */
.sub-list { display: flex; flex-direction: column; gap: 12px; }

/* -- Status bar -- */
#statusbar {
    padding: 12px 24px; background: #161b22; border-top: 1px solid #21262d;
    font-size: 0.82rem; color: #8b949e; display: flex; align-items: center; justify-content: space-between;
    position: fixed; bottom: 0; left: 200px; right: 0;
}
#statusbar .success { color: #3fb950; }
#statusbar .error { color: #f85149; }

/* -- Toast -- */
#toast {
    position: fixed; top: 20px; right: 20px; z-index: 200;
    padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
#toast.show { opacity: 1; }
#toast.ok { background: #238636; color: #fff; }
#toast.err { background: #da3633; color: #fff; }

@media (max-width: 768px) {
    #sidebar { width: 140px; min-width: 140px; }
    #main { padding: 16px; }
    #statusbar { left: 140px; }
    .form-grid { grid-template-columns: 1fr; }
}

#sidebar nav a.nav-link {
    display: block; text-align: left; padding: 10px 20px;
    border: none; background: none; color: #8b949e;
    font-size: 0.9rem; cursor: pointer; font-family: inherit;
    transition: all 0.15s; border-left: 3px solid transparent;
    text-decoration: none;
}
#sidebar nav a.nav-link:hover { color: #f0f6fc; background: #1c2128; }
#sidebar nav a.nav-link.active { color: #f0f6fc; border-left-color: #58a6ff; background: #1c2128; }
</style>

<script src="shared.js"></script>
<script>
// ============================================================
// Admin Panel JS
// ============================================================

let config = null;
let mapPlans = [];   // 地图方案（kind='map'）数据，供「标记点/路线/区域」面板显示真实数据
let token = localStorage.getItem('admin_token') || '';
let currentRole = '';

function authHeaders() {
    return token ? { 'Authorization': 'Bearer ' + token } : {};
}

// ---------- Auth ----------
async function login() {
    const username = (document.getElementById('login-user').value || '').trim();
    const pwd = document.getElementById('login-pwd').value;
    const errEl = document.getElementById('login-err');
    try {
        const resp = await fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username || 'admin', password: pwd }),
        });
        const data = await resp.json();
        if (!resp.ok) { errEl.textContent = data.error || '登录失败'; return; }
        if (data.role !== 'admin') { errEl.textContent = '该账号不是管理员，无法进入后台'; return; }
        token = data.token;
        currentRole = data.role;
        localStorage.setItem('admin_token', token);
        document.getElementById('login-overlay').classList.add('hidden');
        await loadConfig();
    } catch (e) {
        errEl.textContent = '网络错误: ' + e.message;
    }
}

function logout() {
    token = '';
    localStorage.removeItem('admin_token');
    document.getElementById('login-overlay').classList.remove('hidden');
}

// Enter key to login
document.getElementById('login-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('login-user').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('login-btn').addEventListener('click', login);

// ---------- Tab switching ----------

    // Default to brand panel
    document.getElementById('panel-brand').classList.add('active');
    document.getElementById('panel-building').classList.remove('active');
    document.querySelectorAll('#sidebar nav button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#sidebar nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
        document.getElementById('panel-title').textContent = btn.textContent;
        renderAll(); // re-render
        if (btn.dataset.panel === 'nav') { initNavMap(); renderNavRoutes(); }
    });
});

// ---------- Config loading ----------
async function loadConfig() {
    try {
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        const resp = await fetch('/api/config', { headers });
        if (resp.status === 401) { logout(); return; }
        config = await resp.json();
        renderAll();
        loadMapPlans();   // 异步拉取地图方案，刷新「标记点/路线/区域」面板
    } catch (e) {
        showToast('加载配置失败: ' + e.message, 'err');
    }
}

// ---------- Save ----------
async function saveConfig() {
    collectAll();
    try {
        const resp = await fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(config),
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        if (resp.ok) {
            showToast('✅ 配置已保存', 'ok');
            document.getElementById('status-time').textContent = '上次保存: ' + new Date(data.time).toLocaleString();
        } else {
            showToast('❌ ' + (data.error || '保存失败'), 'err');
        }
    } catch (e) {
        showToast('网络错误: ' + e.message, 'err');
    }
}

function preview() { window.open('/', '_blank'); }

// ---------- Toast ----------
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = type + ' show';
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ---------- Form helpers ----------
function fld(key, label, type = 'text', opts = {}) {
    const isColor = type === 'color';
    let inputHtml;
    if (type === 'checkbox') {
        inputHtml = `<input type="checkbox" ${opts.value ? 'checked' : ''} onchange="updateNested(config, '${key}', this.checked)" />`;
    } else if (type === 'select') {
        const options = Object.entries(opts.options || {})
            .map(([v, l]) => `<option value="${v}" ${opts.value === v ? 'selected' : ''}>${l}</option>`).join('');
        inputHtml = `<select onchange="updateNested(config, '${key}', this.value)">${options}</select>`;
    } else if (isColor) {
        inputHtml = `<div class="color-input">
            <input type="color" value="${opts.value || '#000000'}" onchange="updateNested(config, '${key}', this.value)" />
            <input type="text" value="${opts.value || ''}" onchange="updateNested(config, '${key}', this.value)" />
        </div>`;
    } else if (type === 'textarea') {
        inputHtml = `<textarea onchange="updateNested(config, '${key}', this.value)">${opts.value || ''}</textarea>`;
    } else {
        inputHtml = `<input type="${type}" value="${opts.value || ''}" step="${opts.step || 'any'}"${opts.min !== undefined ? ` min="${opts.min}"` : ''}${opts.max !== undefined ? ` max="${opts.max}"` : ''} onchange="updateNested(config, '${key}', this.type === 'number' ? +this.value : this.value)" />`;
    }
    if (type === 'checkbox') {
        return `<div class="form-group"><label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:0.85rem;color:#f0f6fc;">${inputHtml}<span>${label}</span></label></div>`;
    }
    return `<div class="form-group"><label>${label}</label>${inputHtml}</div>`;
}

function updateNested(obj, path, value) {
    const keys = path.split('.');
    let cur = obj;
    for (let i = 0; i < keys.length - 1; i++) {
        if (keys[i].includes('[')) {
            const [name, idx] = keys[i].split('[');
            cur = cur[name][parseInt(idx)];
        } else {
            cur = cur[keys[i]];
        }
    }
    const lastKey = keys[keys.length - 1];
    if (lastKey.includes('[')) {
        const [name, idx] = lastKey.split('[');
        cur[name][parseInt(idx)] = value;
    } else {
        cur[lastKey] = value;
    }
}

function getNested(obj, path) {
    const keys = path.split('.');
    let cur = obj;
    for (const k of keys) {
        if (k.includes('[')) {
            const [name, idx] = k.split('[');
            cur = cur[name] ? cur[name][parseInt(idx)] : undefined;
        } else {
            cur = cur ? cur[k] : undefined;
        }
        if (cur === undefined) return '';
    }
    return cur;
}

// ---------- Add / Delete helpers ----------
function addPreset() {
    const k = prompt('新视角预设的名称（如 overview）');
    if (!k || !k.trim()) return;
    config.camera.presets = config.camera.presets || {};
    if (config.camera.presets[k]) { alert('该预设已存在'); return; }
    config.camera.presets[k] = { pos: [70, 50, 80], target: [0, 4, 0] };
    renderCamera();
}
function delPreset(key) { if (confirm('删除预设「' + key + '」？')) { delete config.camera.presets[key]; renderCamera(); saveConfig(); } }

function addSub() {
    config.building.subs = config.building.subs || [];
    config.building.subs.push({ w: 4, d: 4, h: 4, x: 15, z: 0, color: '#2a3f7a' });

function applyLogoBg(img) {
    try {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) return;
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var d = ctx.getImageData(0, 0, w, h).data;
        var sum = 0, n = 0;
        for (var i = 0; i < d.length; i += 4) {
            if (d[i + 3] > 10) { sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
        }
        if (!n) return;
        var preview = img.closest('.logo-preview');
        if (preview) {
            preview.style.background = (sum / n > 165) ? '#0b1220' : '#ffffff';
        }
    } catch (e) { /* 保持默认白底 */ }
}

function handleLogoUpload(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { alert('请选择图片文件'); return; }
    var reader = new FileReader();
    reader.onload = function(e) {
        var dataUrl = e.target.result;
        if (file.type === 'image/svg+xml') { config.brand.logo = dataUrl; renderBrand(); saveConfig(); return; }
        resizeLogo(dataUrl, 256, function(out) { config.brand.logo = out; renderBrand(); saveConfig(); });
    };
    reader.readAsDataURL(file);
}

function resizeLogo(dataUrl, maxSize, cb) {
    var img = new Image();
    img.onload = function() {
        var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/png'));
    };
    img.onerror = function() { cb(dataUrl); };
    img.src = dataUrl;
}

async function updatePlanVisibility(id, visibility) {
    try {
        const resp = await fetch('/api/editor/projects/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ visibility }),
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        if (resp.ok) showToast('✅ 可见性已更新', 'ok');
        else showToast('❌ ' + (data.error || '更新失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

}

async function renamePlan(id) {
    const input = document.getElementById('plan-name-' + id);
    if (!input) return;
    const name = input.value.trim();
    if (!name) { showToast('名称不能为空', 'err'); return; }
    try {
        const resp = await fetch('/api/editor/projects/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ name }),
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        if (resp.ok) { showToast('✅ 方案已改名', 'ok'); renderPlans(); }
        else showToast('❌ ' + (data.error || '改名失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

async function deletePlan(id) {
    if (!confirm('确定删除该方案？删除后不可恢复')) return;
    try {
        const resp = await fetch('/api/editor/projects/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token },
        });
        if (resp.status === 401) { logout(); return; }
        if (resp.ok) { showToast('✅ 方案已删除', 'ok'); renderPlans(); }
        else { const d = await resp.json(); showToast('❌ ' + (d.error || '删除失败'), 'err'); }
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

// ---------- 用户管理（/api/users） ----------
// 账号仅两类：管理员（全部功能）、超级用户（看全部数据）。
// 「普通用户」= 未登录访客，无需用户名/密码，靠方案「公开/受限」开关控制其首页可见范围。
const ROLE_LIST = [['admin', '管理员'], ['super', '超级用户']];

async function renderUsers() {
    const box = document.getElementById('form-users');
    if (!box) return;
    let rows = [];
    try {
        const resp = await fetch('/api/users', { headers: authHeaders() });
        if (resp.status === 401) { logout(); return; }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const json = await resp.json();
        rows = json.data || [];
    } catch (e) {
        box.innerHTML = `<div class="section"><p style="color:#f85149;">加载失败: ${escHtml(e.message)}</p></div>`;
        return;
    }

    const roleOptions = (sel) => ROLE_LIST.map(([v, label]) =>
        `<option value="${v}" ${sel === v ? 'selected' : ''}>${label}</option>`).join('');

    box.innerHTML = `
        <div class="section">
            <h3>➕ 新增用户</h3>
            <div class="form-grid">
                <div class="form-group"><label>用户名</label><input id="new-user-name" type="text" placeholder="登录用户名" autocomplete="off" /></div>
                <div class="form-group"><label>密码</label><input id="new-user-pwd" type="password" placeholder="至少 6 位" autocomplete="new-password" /></div>
                <div class="form-group"><label>角色</label><select id="new-user-role">${roleOptions('super')}</select></div>
            </div>
            <button class="btn-add-feat" style="margin-top:12px" onclick="addUser()">➕ 创建用户</button>
        </div>
        <div class="section">
            <h3>👥 用户列表</h3>
            ${rows.length === 0 ? '<p style="color:#8b949e;">暂无用户</p>' : rows.map(u => `
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #21262d;">
                    <span style="font-weight:600;color:#f0f6fc;min-width:120px;">${escHtml(u.username)}</span>
                    <select onchange="updateUserRole(${u.id}, this.value)">${roleOptions(u.role)}</select>
                    <button class="btn-add-feat" onclick="resetUserPassword(${u.id}, ${jkey(u.username)})">🔑 重置密码</button>
                    <button class="btn-del" style="margin-top:0" onclick="deleteUser(${u.id}, ${jkey(u.username)})">✕ 删除</button>
                    <span style="font-size:0.72rem;color:#8b949e;margin-left:auto;">${escHtml(u.created_at || '')}</span>
                </div>`).join('')}
        </div>`;
}

async function addUser() {
    const username = document.getElementById('new-user-name').value.trim();
    const password = document.getElementById('new-user-pwd').value;
    const role = document.getElementById('new-user-role').value;
    if (!username) { showToast('用户名不能为空', 'err'); return; }
    if (!password || password.length < 6) { showToast('密码至少 6 位', 'err'); return; }
    try {
        const resp = await fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ username, password, role }),
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        if (resp.ok) { showToast('✅ 用户已创建', 'ok'); renderUsers(); }
        else showToast('❌ ' + (data.error || '创建失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

async function updateUserRole(id, role) {
    try {
        const resp = await fetch('/api/users/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ role }),
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        if (resp.ok) { showToast('✅ 角色已更新', 'ok'); renderUsers(); }
        else showToast('❌ ' + (data.error || '更新失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

async function resetUserPassword(id, username) {
    const pwd = prompt('为用户「' + username + '」设置新密码（至少 6 位）：');
    if (pwd === null) return;
    if (pwd.length < 6) { showToast('密码至少 6 位', 'err'); return; }
    try {
        const resp = await fetch('/api/users/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ password: pwd }),
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        if (resp.ok) showToast('✅ 密码已重置', 'ok');
        else showToast('❌ ' + (data.error || '重置失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

async function deleteUser(id, username) {
    if (!confirm('确定删除用户「' + username + '」？')) return;
    try {
        const resp = await fetch('/api/users/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token },
        });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) { showToast('✅ 用户已删除', 'ok'); renderUsers(); }
        else showToast('❌ ' + (data.error || '删除失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}

(async () => {

        // Verify token
        try {
            const resp = await fetch('/api/check', { headers: { 'Authorization': 'Bearer ' + token } });
            if (resp.ok) {

// ============ 导航路线（后台路径导航 + 预设路线） ============
let navMap = null;
let navPoint = { start: null, end: null };
let navPicking = null;
let navPointMarkers = [];
let navPlanners = { walking: null, driving: null, riding: null, transfer: null };
let navOverlay = null;
let navDragRoute = null;
let navMapInited = false;
let currentNavPts = null;
let currentNavDist = 0;
let currentNavTime = 0;
let navEditingId = null;      // 正在编辑的路线 id，null = 新建
let navRoutesCache = [];      // renderNavRoutes 缓存，编辑时回填用

const NAV_MODE_LABEL = { walking: '步行', driving: '驾车', riding: '骑行', transfer: '公交' };

async function initNavMap() {
    if (navMapInited) return;
    navMapInited = true;
    const geo = (config && config.geo) || {};
    let amapKey = geo.amapKey || '';
    let sec = geo.amapSecurityCode || '';
    try { const r = await fetch('/api/amap'); const d = await r.json(); if (d && d.key) amapKey = d.key; if (d && d.securityJsCode) sec = d.securityJsCode; } catch (_) {}
    if (sec) window._AMapSecurityConfig = { securityJsCode: sec };
    await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + (amapKey || '');
        s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
    if (!window.AMap) { showToast('地图加载失败', 'err'); return; }
    navMap = new AMap.Map('nav-map', { viewMode: '2D', center: geo.center || [104.14141, 30.67133], zoom: geo.zoom || 16, mapStyle: geo.mapStyle || 'amap://styles/normal' });
    AMap.plugin('AMap.Walking', () => { navPlanners.walking = new AMap.Walking(); });
    AMap.plugin(['AMap.Driving', 'AMap.Riding', 'AMap.Transfer'], () => {
        try { navPlanners.driving = new AMap.Driving({ policy: AMap.DrivingPolicy ? AMap.DrivingPolicy.LEAST_TIME : 0, hideMarkers: true }); } catch (_) {}
        try { navPlanners.riding = new AMap.Riding({}); } catch (_) {}
        try { navPlanners.transfer = new AMap.Transfer({ city: '成都', policy: AMap.TransferPolicy ? AMap.TransferPolicy.LEAST_TIME : 0 }); } catch (_) {}
    });
    navMap.on('click', e => {
        if (!navPicking) return;
        setNavPoint(navPicking, e.lnglat.getLng(), e.lnglat.getLat());
    });
}

function pickNavPoint(which) {
    if (!navMap) { showToast('地图尚未就绪', 'err'); return; }
    navPicking = which;
    showToast(which === 'start' ? '请在地图上点击起点' : '请在地图上点击终点', '');
}

function setNavPoint(which, lng, lat) {
    navPoint[which] = { name: which === 'start' ? '起点' : '终点', lng, lat };
    const input = document.getElementById(which === 'start' ? 'nav-start-name' : 'nav-end-name');
    if (input) input.value = navPoint[which].name;
    if (window.AMap && AMap.Geocoder) {
        AMap.plugin('AMap.Geocoder', () => {
            const geo = new AMap.Geocoder();
            geo.getAddress([lng, lat], (status, result) => {
                if (status === 'complete' && result.regeocode && result.regeocode.formattedAddress) {
                    navPoint[which].name = result.regeocode.formattedAddress;
                    if (input) input.value = navPoint[which].name;
                }
            });
        });
    }
    navPicking = null;
    updateNavPointMarkers();
}

function navDotHtml(color) {
    return '<div style="width:12px;height:12px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 0 6px ' + color + ';"></div>';
}

function updateNavPointMarkers() {
    navPointMarkers.forEach(m => { try { m.setMap(null); } catch (_) {} });
    navPointMarkers = [];
    if (!navMap) return;
    if (navPoint.start) navPointMarkers.push(new AMap.Marker({ position: [navPoint.start.lng, navPoint.start.lat], content: navDotHtml('#22c55e'), offset: new AMap.Pixel(-8, -8), zIndex: 120 }));
    if (navPoint.end) navPointMarkers.push(new AMap.Marker({ position: [navPoint.end.lng, navPoint.end.lat], content: navDotHtml('#ef4444'), offset: new AMap.Pixel(-8, -8), zIndex: 120 }));
    navPointMarkers.forEach(m => m.setMap(navMap));
}

function routePathOf(route) {
    const path = [];
    (route.steps || []).forEach(s => {
        if (!s) return;
        const p = s.path || (s.bus && s.bus.path) || [];
        if (p && p.length) path.push(...p);
    });
    return path;
}

function clearNavPreview() {
    if (navOverlay) { navOverlay.setMap(null); navOverlay = null; }
    if (navDragRoute) { try { if (navDragRoute.clear) navDragRoute.clear(); } catch (_) {} navDragRoute = null; }
}

function formatNavDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' 公里' : Math.round(m) + ' 米'; }

function planNavRoute() {
    if (!navMap || !navPoint.start || !navPoint.end) { showToast('请先设起点和终点', 'err'); return; }
    const mode = document.getElementById('nav-travel-mode').value;
    const planner = navPlanners[mode];
    const start = new AMap.LngLat(navPoint.start.lng, navPoint.start.lat);
    const end = new AMap.LngLat(navPoint.end.lng, navPoint.end.lat);
    clearNavPreview();
    if (!planner) { showToast('规划插件加载中，请稍后重试', 'err'); return; }
    navOverlay = new AMap.Polyline({ path: [start, end], strokeColor: '#22d3ee', strokeWeight: 4, strokeStyle: 'dashed', strokeOpacity: 0.45, zIndex: 30 });
    navOverlay.setMap(navMap);
    planner.search(start, end, (status, result) => {
        if (status !== 'complete' || !result.routes || !result.routes[0]) { showToast('规划失败，请换交通方式或起终点', 'err'); return; }
        renderNavPreview(result.routes[0], mode);
    });
}

function renderNavPreview(route, mode) {
    const pts = routePathOf(route);
    currentNavPts = pts;
    currentNavDist = route.distance || 0;
    currentNavTime = route.time || 0;
    if (mode === 'driving' && window.AMap && AMap.DragRoute) {
        try {
            if (navOverlay) { navOverlay.setMap(null); navOverlay = null; }
            navDragRoute = new AMap.DragRoute(navMap, route, AMap.DrivingPolicy ? AMap.DrivingPolicy.LEAST_TIME : 0, { polyOptions: { strokeColor: '#22d3ee', strokeWeight: 5, strokeOpacity: 0.95 } });
            navDragRoute.on('complete', (ev) => {
                const nr = ev && ev.route;
                if (nr) { currentNavPts = routePathOf(nr); currentNavDist = nr.distance || currentNavDist; currentNavTime = nr.time || currentNavTime; showToast('已拖拽调整，可直接保存', ''); }
            });
            navDragRoute.search();
            showToast('规划成功：约 ' + formatNavDist(currentNavDist) + '（驾车可拖拽改线）', 'ok');
            return;
        } catch (_) {}
    }
    if (pts.length < 2) { showToast('未取到路径点', 'err'); return; }
    if (navOverlay) navOverlay.setMap(null);
    navOverlay = new AMap.Polyline({ path: pts, strokeColor: '#22d3ee', strokeWeight: 5, strokeStyle: 'solid', strokeOpacity: 0.95, zIndex: 30 });
    navOverlay.setMap(navMap);
    navMap.setFitView([navOverlay]);
    showToast('规划成功：约 ' + formatNavDist(currentNavDist), 'ok');
}

// 规范化路径点为纯 [lng, lat] 数组：高德 step.path 可能是 LngLat 对象，直接 JSON 存会丢数据
function normalizePts(pts) {
    return (pts || []).map(p => {
        const lng = Number(p && p.getLng ? p.getLng() : p[0]);
        const lat = Number(p && p.getLat ? p.getLat() : p[1]);
        return [lng, lat];
    }).filter(p => isFinite(p[0]) && isFinite(p[1]));
}

function resetNavForm() {
    navEditingId = null;
    navPoint = { start: null, end: null };
    currentNavPts = null; currentNavDist = 0; currentNavTime = 0;
    const nameEl = document.getElementById('nav-route-name');
    const startEl = document.getElementById('nav-start-name');
    const endEl = document.getElementById('nav-end-name');
    if (nameEl) nameEl.value = '';
    if (startEl) startEl.value = '';
    if (endEl) endEl.value = '';
    const modeEl = document.getElementById('nav-travel-mode');
    if (modeEl) modeEl.value = 'walking';
    clearNavPreview();
    updateNavPointMarkers();
    const btn = document.getElementById('btn-save-nav-route');
    const cancel = document.getElementById('btn-nav-cancel');
    if (btn) btn.innerHTML = '💾 保存路线';
    if (cancel) cancel.style.display = 'none';
}

function saveNavRoute() {
    if (!currentNavPts || currentNavPts.length < 2) { showToast('请先规划路线', 'err'); return; }
    const name = document.getElementById('nav-route-name').value.trim();
    if (!name) { showToast('请输入路线名称', 'err'); return; }
    const mode = document.getElementById('nav-travel-mode').value;
    const data = { travelMode: mode, start: navPoint.start, end: navPoint.end, pts: normalizePts(currentNavPts), distance: currentNavDist, time: currentNavTime };
    const isEdit = navEditingId != null;
    fetch(isEdit ? '/api/nav-routes/' + navEditingId : '/api/nav-routes', {
        method: isEdit ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name, data }),
    }).then(r => { if (r.status === 401) { logout(); return; } return r.json(); }).then(d => {
        if (d && (d.id || d.message)) { showToast(isEdit ? '✅ 路线已更新' : '✅ 路线已保存', 'ok'); resetNavForm(); renderNavRoutes(); }
        else if (d) showToast('❌ ' + (d.error || '保存失败'), 'err');
    }).catch(e => showToast('网络错误: ' + e.message, 'err'));
}

async function editNavRoute(id) {
    const r = navRoutesCache.find(x => x.id === id);
    if (!r) { showToast('路线不存在，请刷新列表', 'err'); return; }
    const d = r.data || {};
    navEditingId = id;
    const nameEl = document.getElementById('nav-route-name');
    const modeEl = document.getElementById('nav-travel-mode');
    const startEl = document.getElementById('nav-start-name');
    const endEl = document.getElementById('nav-end-name');
    if (nameEl) nameEl.value = r.name || '';
    if (modeEl) modeEl.value = d.travelMode || 'walking';
    navPoint = {
        start: d.start ? { name: d.start.name || '起点', lng: d.start.lng, lat: d.start.lat } : null,
        end: d.end ? { name: d.end.name || '终点', lng: d.end.lng, lat: d.end.lat } : null,
    };
    if (startEl) startEl.value = navPoint.start ? navPoint.start.name : '';
    if (endEl) endEl.value = navPoint.end ? navPoint.end.name : '';
    // 回填已保存路径（含拖拽改线结果），不重新规划；要重算可再点「取点 + 规划」
    currentNavPts = (d.pts || []).map(p => Array.isArray(p) ? [p[0], p[1]] : [p.lng, p.lat]);
    currentNavDist = d.distance || 0;
    currentNavTime = d.time || 0;
    clearNavPreview();
    if (currentNavPts.length >= 2 && navMap) {
        navOverlay = new AMap.Polyline({ path: currentNavPts, strokeColor: '#22d3ee', strokeWeight: 5, strokeStyle: 'solid', strokeOpacity: 0.95, zIndex: 30 });
        navOverlay.setMap(navMap);
        navMap.setFitView([navOverlay]);
    }
    updateNavPointMarkers();
    const btn = document.getElementById('btn-save-nav-route');
    const cancel = document.getElementById('btn-nav-cancel');
    if (btn) btn.innerHTML = '💾 更新路线';
    if (cancel) cancel.style.display = '';
    showToast('已加载路线，改完点「更新路线」', '');
}

async function renderNavRoutes() {
    const box = document.getElementById('form-nav-routes');
    if (!box) return;
    let rows = [];
    try {
        const resp = await fetch('/api/nav-routes', { headers: authHeaders() });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        rows = (await resp.json()).data || [];
    } catch (e) {
        box.innerHTML = `<div class="section"><p style="color:#f85149;">加载失败: ${escHtml(e.message)}</p></div>`;
        return;
    }
    navRoutesCache = rows;
    if (rows.length === 0) { box.innerHTML = '<div class="section"><p style="color:#8b949e;">暂无导航路线。上面规划一条并保存即可。</p></div>'; return; }
    box.innerHTML = rows.map(r => {
        const d = r.data || {};
        const modeLabel = NAV_MODE_LABEL[d.travelMode] || d.travelMode || '—';
        return `<div class="section">
            <h3>🧭 ${escHtml(r.name || ('路线 ' + r.id))}</h3>
            <div style="font-size:0.8rem;color:#8b949e;margin:4px 0 8px;">${modeLabel} · ${escHtml((d.start && d.start.name) || '起点')} → ${escHtml((d.end && d.end.name) || '终点')}${d.distance ? ' · 约 ' + Math.round(d.distance) + ' 米' : ''}</div>
            <div style="display:flex;gap:8px;">
                <button class="btn-del" style="background:#1f6feb;border-color:#1f6feb;" onclick="editNavRoute(${r.id})">✏️ 编辑</button>
                <button class="btn-del" onclick="deleteNavRoute(${r.id})">✕ 删除</button>
            </div>
        </div>`;
    }).join('');
}

async function deleteNavRoute(id) {
    if (!confirm('删除这条导航路线？')) return;
    try {
        const resp = await fetch('/api/nav-routes/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
        if (resp.status === 401) { logout(); return; }
        const d = await resp.json().catch(() => ({}));
        if (resp.ok) { showToast('✅ 已删除', 'ok'); renderNavRoutes(); }
        else showToast('❌ ' + (d.error || '删除失败'), 'err');
    } catch (e) { showToast('网络错误: ' + e.message, 'err'); }
}
