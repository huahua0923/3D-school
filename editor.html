<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>室内编辑 · 会展中心导览</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="editor.css?v=4" />
</head>
<body>

<!-- ====== Top Bar ====== -->
<div id="topbar">
  <a href="/index.html" class="toolbar-btn" title="返回主地图" style="text-decoration:none;">🏠 首页</a>
  <div class="brand">🗺️ <span>Route</span>Editor</div>
  <input type="text" id="project-name" placeholder="未命名项目" title="项目名称" />
  <label class="toolbar-btn" id="btn-import-img" title="导入图片">🖼️ 导入图片
    <input type="file" id="hidden-file-input" accept="image/*" />
  </label>
  <div class="sep"></div>
  <button class="toolbar-btn" id="btn-undo" disabled title="撤销 (Ctrl+Z)">↩</button>
  <button class="toolbar-btn" id="btn-redo" disabled title="重做 (Ctrl+Shift+Z)">↪</button>
  <div class="sep"></div>
  <button class="toolbar-btn primary" id="btn-grid" title="切换网格">📏 网格</button>
  <select id="grid-size">
    <option value="10">10px</option>
    <option value="20" selected>20px</option>
    <option value="40">40px</option>
    <option value="50">50px</option>
  </select>
  <span id="align-btns" style="display:none;display:flex;gap:2px;">
    <button class="toolbar-btn" data-align="left" title="左对齐">⫷</button>
    <button class="toolbar-btn" data-align="center" title="水平居中">⬌</button>
    <button class="toolbar-btn" data-align="right" title="右对齐">⫸</button>
    <button class="toolbar-btn" data-align="top" title="顶部对齐">⫯</button>
    <button class="toolbar-btn" data-align="middle" title="垂直居中">⬍</button>
    <button class="toolbar-btn" data-align="bottom" title="底部对齐">⫮</button>
  </span>
  <span class="spacer"></span>
  <button class="toolbar-btn" id="btn-zoom-out" title="缩小">🔍−</button>
  <input type="range" id="zoom-slider" class="zoom-slider" min="10" max="500" value="100" title="缩放" />
  <span id="zoom-label">100%</span>
  <button class="toolbar-btn" id="btn-zoom-in" title="放大">🔍+</button>
  <button class="toolbar-btn" id="btn-reset-view" title="重置视图">⊞</button>
  <span class="spacer"></span>
  <button class="toolbar-btn" id="btn-load" title="打开项目">📂 打开</button>
  <button class="toolbar-btn primary" id="btn-save" title="保存项目 (Ctrl+S)">💾 保存</button>
  <button class="toolbar-btn" id="btn-new" title="新建项目">＋</button>
  <button class="toolbar-btn" id="btn-geo" title="设置地理范围（用于 3D 地图展示）">🌐 范围</button>
  <div class="sep"></div>
  <span id="export-menu-wrap" style="position:relative;">
    <button class="toolbar-btn" id="btn-export" title="导出">📤 导出 ▾</button>
    <div id="export-dropdown">
      <button data-export="png">🖼️ PNG (含图例)</button>
      <button data-export="svg">📐 SVG 矢量图</button>
    </div>
  </span>
  <span class="sep"></span>
  <span id="history-step-label" class="stat-text"></span>
  <button class="toolbar-btn" id="btn-shortcuts" title="快捷键">⌨️</button>
</div>

<!-- ====== Ruler Top ====== -->
<div id="ruler-top"><canvas id="ruler-top-canvas"></canvas></div>

<!-- ====== Main Layout ====== -->
<div id="main">
  <!-- Left Toolbar -->
  <div id="toolbar">
    <button class="active" data-tool="select" title="选择 (V)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
    </button>
    <button data-tool="pan" title="平移 (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-4 0v1M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.21 0-4.21-.9-5.66-2.34L3.5 14.5a1.5 1.5 0 0 1 2.12-2.12L8 14.5V6"/></svg>
    </button>
    <button data-tool="draw-route" title="画线 (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/></svg>
    </button>
    <button data-tool="draw-area" title="画框 (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
    </button>
    <button data-tool="text-tool" title="文字 (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>
  </div>

  <!-- Ruler Left -->
  <div id="ruler-left"><canvas id="ruler-left-canvas"></canvas></div>

  <!-- Canvas -->
  <div id="canvas-wrap"><canvas id="editor-canvas"></canvas></div>

  <!-- Right Layer Panel -->
  <div id="layer-panel">
    <div id="plan-panel">
      <div class="plan-panel-head">
        <span class="plan-panel-title">📂 方案</span>
        <div class="plan-panel-btns">
          <button id="btn-plan-new" title="新建方案">＋ 新建</button>
          <button id="btn-plan-refresh" title="刷新方案列表">🔄</button>
        </div>
      </div>
      <div id="plan-list"></div>
    </div>
    <h3>📋 图层</h3>
    <div id="layer-list"></div>
    <div id="props-panel">
      <h3 style="margin-top:0">⚙️ 属性</h3>
      <label>名称</label>
      <input type="text" id="prop-name" />
      <div id="text-props" style="display:none">
        <label>文字内容</label>
        <input type="text" id="prop-text" placeholder="输入文字..." />
        <label>背景色</label>
        <div class="color-presets" id="text-bg-presets"></div>
      </div>
      <label>颜色</label>
      <input type="color" id="prop-color" />
      <div class="color-presets" id="color-presets"></div>
      <label id="label-stroke">线宽</label>
      <input type="range" id="prop-stroke" min="1" max="12" value="3" />
      <label>不透明度</label>
      <input type="range" id="prop-opacity" min="5" max="100" value="100" />
      <label id="label-fontsize" style="display:none">字号</label>
      <input type="range" id="prop-fontsize" min="10" max="72" value="16" style="display:none" />
      <div id="prop-point-info" style="font-size:0.7rem;color:#555577;margin-top:4px;"></div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <button class="toolbar-btn" id="btn-duplicate">📋 复制</button>
        <button class="toolbar-btn" id="btn-to-front">⬆ 置顶</button>
        <button class="toolbar-btn" id="btn-to-back">⬇ 置底</button>
        <button class="toolbar-btn danger" id="btn-delete">🗑 删除</button>
      </div>
    </div>
    <div id="no-selection">
      <p>选择图层查看属性</p>
      <div style="margin-top:12px">
        <label style="font-size:0.7rem;color:#8888aa;text-align:left">背景图透明度</label>
        <input type="range" id="bg-opacity" min="5" max="100" value="100" style="width:100%" />
        <div id="bg-img-info" style="font-size:0.7rem;color:#555577;margin-top:4px;"></div>
      </div>
      <div style="margin-top:12px">
        <label style="font-size:0.7rem;color:#8888aa;text-align:left;display:flex;align-items:center;gap:8px;">
          吸附到网格 <input type="checkbox" id="snap-toggle" checked style="accent-color:#3b82f6;" />
        </label>
      </div>
    </div>
  </div>
</div>

<!-- ====== Status Bar ====== -->
<div id="statusbar">
  <span class="stat" id="stat-project"></span>
  <span class="sep-v">|</span>
  <span class="stat" id="stat-save">● 未保存</span>
  <span class="sep-v">|</span>
  <span class="stat" id="stat-elements"></span>
  <span class="sep-v">|</span>
  <span class="stat" id="stat-snap">吸附 ✓</span>
  <span class="sep-v" id="sep-guides" style="display:none">|</span>
  <span class="stat" id="stat-guides" style="display:none"></span>
  <button class="stat-btn" id="btn-clear-guides" style="display:none">清除</button>
  <span class="spacer"></span>
  <span class="stat" id="stat-pos"></span>
  <span class="sep-v">|</span>
  <span class="stat" id="stat-zoom"></span>
  <span class="sep-v">|</span>
  <span class="stat" id="stat-history"></span>
</div>

<!-- ====== Context Menu ====== -->
<div id="ctx-menu">
  <button data-action="duplicate">📋 复制</button>
  <button data-action="toFront">⬆ 置顶</button>
  <button data-action="toBack">⬇ 置底</button>
  <hr />
  <button data-action="delete" class="danger">🗑 删除</button>
</div>

<script src="editor.js?v=2"></script>
</body>
</html>
