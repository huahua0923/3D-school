<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 智慧导览</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Inter', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background: #0a0e17;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        :root {
            --accent-main:  #4da6ff;
            --accent-east:  #00d4aa;
            --accent-west:  #ffb347;
            --accent-vip:   #c79fff;
            --bg-panel:   rgba(12, 18, 30, 0.88);
            --border-subtle: rgba(255,255,255,0.08);
            --border-active: rgba(255,255,255,0.18);
            --shadow-panel: 0 8px 32px rgba(0,0,0,0.45);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --radius-full: 9999px;
        }

        /* Map + Canvas containers */
        #map-container { position: fixed; inset: 0; z-index: 0; }
        #app-canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #atmosphere { position: fixed; inset: 0; z-index: 2; pointer-events: none; transition: background 2.5s linear; }

        /* Loading */
        #loading-screen {
            position: fixed; inset: 0; z-index: 100; background: #0a0e17;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-logo { width: 68px; height: 68px; margin: 0 auto 22px; display: flex; align-items: center; justify-content: center; }
        .loader-logo:empty { display: none; }
        .loader-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 14px; padding: 8px; box-sizing: border-box; }
        .loader-brand { font-size: 2rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
        .loader-brand span { color: var(--accent-main); }
        .loader-sub { font-size: 0.875rem; color: rgba(255,255,255,0.58); margin-bottom: 40px; letter-spacing: 0.06em; }
        .loader-track { width: 240px; height: 3px; background: rgba(255,255,255,0.08); border-radius: var(--radius-full); overflow: hidden; }
        .loader-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-main), var(--accent-vip)); border-radius: var(--radius-full); transition: width 0.3s ease; }
        .loader-pct { margin-top: 12px; font-size: 0.75rem; color: rgba(255,255,255,0.32); }

        #setup-hint {
            display: none; position: fixed; inset: 0; z-index: 101; background: #0a0e17;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px;
        }
        #setup-hint.show { display: flex; }
        #setup-hint h2 { font-size: 1.5rem; margin-bottom: 12px; color: #f0f6fc; }
        #setup-hint p { color: rgba(255,255,255,0.58); max-width: 520px; line-height: 1.7; margin-bottom: 8px; }
        #setup-hint code { background: #1c2128; padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; color: var(--accent-main); }
        #setup-hint a { color: var(--accent-main); }

        /* ====== Left Sidebar ====== */
        #sidebar {
            position: fixed; top: 16px; left: 16px; z-index: 20;
            width: 240px; max-height: calc(100vh - 32px); overflow-y: auto;
            background: rgba(12,18,30,0.92); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            padding: 0; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex; flex-direction: column;
        }
        .sb-brand { padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sb-logo { display: flex; align-items: center; gap: 8px; font-size: 1.7rem; margin-bottom: 6px; color: #f0f6fc; }
        .sb-logo img { flex: none; width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 9px; padding: 4px; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
        .sb-logo span { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
        .sb-title { font-size: 1.1rem; font-weight: 700; color: #f0f6fc; letter-spacing: 0.02em; }
        .sb-sub { font-size: 0.65rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
        .sb-section { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .sb-label { font-size: 0.6rem; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .sb-tools { display: flex; gap: 4px; }
        .sb-tools button {
            width: 42px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.5);
            font-size: 1rem; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .sb-tools button:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .sb-tools button.active { color: #fff; background: var(--accent-main); border-color: var(--accent-main); box-shadow: 0 0 16px rgba(77,166,255,0.3); }
        .sb-tools button:disabled { opacity: 0.25; cursor: default; }
        .sb-search { position: relative; }
        .sb-search input {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04); color: #f0f6fc; font-size: 0.8rem;
            font-family: inherit; outline: none;
        }
        .sb-search input:focus { border-color: var(--accent-main); }
        .sb-search input::placeholder { color: rgba(255,255,255,0.25); }
        #search-results {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            background: rgba(12,18,30,0.98); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; margin-top: 4px; max-height: 200px; overflow-y: auto; z-index: 30;
        }
        .search-item { padding: 8px 12px; font-size: 0.8rem; cursor: pointer; color: rgba(255,255,255,0.7); border-bottom: 1px solid rgba(255,255,255,0.04); }
        .search-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sb-layers { display: flex; flex-direction: column; gap: 4px; }
        .sb-layer-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 10px;
            border-radius: 6px; font-size: 0.78rem; color: rgba(255,255,255,0.55);
        }
        .layer-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .sb-actions { display: flex; flex-direction: column; gap: 6px; }
        .sb-btn {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.7);
            font-size: 0.8rem; font-family: inherit; cursor: pointer; text-align: center;
        }
        .sb-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sb-btn.primary { background: var(--accent-main); border-color: var(--accent-main); color: #fff; font-weight: 600; }
        .sb-btn.active { background: var(--accent-main); border-color: var(--accent-main); color: #fff; }
        .sb-status { font-size: 0.7rem; color: rgba(255,255,255,0.35); text-align: center; }
.plan-list { display: flex; flex-direction: column; gap: 6px; }
.plan-item { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: rgba(255,255,255,0.7); cursor: pointer; padding: 2px 0; }
.plan-item input { accent-color: var(--accent-main); cursor: pointer; flex-shrink: 0; }
.plan-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.floor-switcher { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.floor-btn { flex: 0 0 auto; padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.6); font-size: 0.74rem; font-family: inherit; cursor: pointer; white-space: nowrap; }
.floor-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.floor-btn.active { background: var(--accent-main); border-color: var(--accent-main); color: #fff; font-weight: 600; }

        /* ====== Top-Right & Bottom-Right ====== */
        #btn-auto-rotate {
            position: fixed; top: 20px; right: 20px; z-index: 20;
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(12,18,30,0.9);
            backdrop-filter: blur(16px); color: rgba(255,255,255,0.5); font-size: 1.1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        #btn-auto-rotate:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        #btn-menu { display: none; }
        #sidebar-backdrop { display: none; }
        #bottom-controls {
            position: fixed; bottom: 24px; right: 24px; z-index: 20; display: flex; gap: 8px;
        }
        .ctrl-group {
            display: flex; gap: 2px; padding: 3px; border-radius: 24px;
            background: rgba(12,18,30,0.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .ctrl-group button {
            padding: 5px 12px; border-radius: 20px; border: none; background: transparent;
            color: rgba(255,255,255,0.4); font-size: 0.7rem; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: all 0.2s;
        }
        .ctrl-group button:hover { color: rgba(255,255,255,0.7); }
        .ctrl-group button.active { background: rgba(255,255,255,0.1); color: #fff; }
        #toast {
            position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
            padding: 8px 16px; border-radius: 20px; z-index: 60;
            background: rgba(12,18,30,0.92); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 0.8rem; font-weight: 600;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(8px);
        }
        #weather-panel {
            position: fixed; top: 68px; right: 20px; z-index: 20;
            width: auto; min-width: 76px; max-width: 200px;
            padding: 7px 12px; border-radius: 20px;
            background: rgba(12,18,30,0.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            color: #fff; display: none; font-family: inherit;
            cursor: pointer; transition: all 0.2s ease;
        }
        #weather-panel:hover { border-color: rgba(255,255,255,0.16); }
        #weather-panel .w-head { display: flex; align-items: center; gap: 7px; font-size: 0.85rem; font-weight: 600; }
        #weather-panel .w-emoji { font-size: 1.15rem; line-height: 1; }
        #weather-panel .w-temp { font-size: 1rem; font-weight: 700; }
        #weather-panel .w-cond { font-size: 0.8rem; color: rgba(255,255,255,0.85); }
        #weather-panel .w-detail { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
        #weather-panel.expanded .w-detail { display: block; }
        #weather-panel .w-city { font-size: 0.75rem; color: rgba(255,255,255,0.5); font-weight: 600; margin-bottom: 4px; }
        #weather-panel .w-meta { font-size: 0.68rem; color: rgba(255,255,255,0.45); }
        #weather-panel .w-forecast { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
        #weather-panel .w-frow { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; gap: 8px; }
        #weather-panel .w-fdate { color: rgba(255,255,255,0.5); }
        #weather-panel .w-fcond { color: rgba(255,255,255,0.85); flex: 1; text-align: center; }
        #weather-panel .w-ftemp { color: rgba(255,255,255,0.6); }

        
        @keyframes bannerIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

        /* Login modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: rgba(22,27,34,0.98); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 28px 32px; min-width: 360px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5); animation: modalIn 0.2s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } }
        .modal-box h2 { font-size: 1.1rem; color: #f0f6fc; margin-bottom: 4px; }
        .modal-box input {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
            color: #f0f6fc; font-size: 0.9rem; font-family: inherit; outline: none;
        }
        .modal-box input:focus { border-color: var(--accent-main); }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }


        /* Info card */
        #info-card-backdrop {
            position: fixed; inset: 0; z-index: 25;
            background: rgba(0,0,0,0.35);
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #info-card-backdrop.show { opacity: 1; visibility: visible; }
        #info-card {
            position: fixed; z-index: 30;
            bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
            width: 420px; max-width: calc(100vw - 32px);
            background: var(--bg-panel); backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 28px 24px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #info-card.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .info-close {
            position: absolute; top: 12px; right: 14px;
            width: 32px; height: 32px; border-radius: var(--radius-full);
            border: none; background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.58); font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .info-close:hover { background: rgba(255,255,255,0.14); color: #fff; }
        .info-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .info-title {
            font-size: 1.25rem; font-weight: 700; margin-bottom: 4px;
            display: flex; align-items: center; gap: 10px;
        }
        .info-title .badge {
            display: inline-block; font-size: 0.625rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em;
            padding: 4px 10px; border-radius: var(--radius-full);
        }
        .badge.main { background: rgba(77,166,255,0.2); color: var(--accent-main); }
        .badge.east { background: rgba(0,212,170,0.2); color: var(--accent-east); }
        .badge.west { background: rgba(255,179,71,0.2); color: var(--accent-west); }
        .badge.vip  { background: rgba(199,159,255,0.2); color: var(--accent-vip); }
        .info-desc { font-size: 0.875rem; color: rgba(255,255,255,0.58); margin: 10px 0 16px; line-height: 1.5; }
        .info-features { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .info-feature {
            font-size: 0.75rem; padding: 6px 12px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
            color: rgba(255,255,255,0.58);
            display: flex; align-items: center; gap: 6px;
        }
        .info-action { display: flex; gap: 10px; }
        .info-btn {
            flex: 1; padding: 10px 0; border-radius: var(--radius-sm);
            font-family: inherit; font-size: 0.8125rem; font-weight: 600;
            cursor: pointer; border: none;
            transition: all 0.2s ease; letter-spacing: 0.02em;
        }
        .info-btn.primary { background: var(--accent-main); color: #000; }
        .info-btn.primary:hover { filter: brightness(1.15); }
        .info-btn.ghost {
            background: transparent; color: rgba(255,255,255,0.58); border: 1px solid var(--border-subtle);
        }
        .info-btn.ghost:hover { border-color: var(--border-active); color: #fff; }

        /* 元素图片展示（首页点击线路/点/区域显示） */
        #info-images { display: none; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
        .info-img-thumb {
            width: 60px; height: 60px; object-fit: cover; border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle); cursor: zoom-in; transition: transform 0.15s ease;
        }
        .info-img-thumb:hover { transform: scale(1.06); }
        /* 图片灯箱：点击缩略图放大，多图左右切换 */
        #lightbox {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.88);
            display: none; align-items: center; justify-content: center;
            cursor: zoom-out;
        }
        #lightbox.show { display: flex; }
        #lightbox img {
            max-width: 86vw; max-height: 86vh; width: auto; height: auto;
            object-fit: contain; border-radius: 10px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7); background: #000;
        }
        #lightbox .lb-btn {
            position: absolute; z-index: 1;
            background: rgba(0,0,0,0.5); color: #fff; border: none;
            border-radius: 50%; width: 44px; height: 44px; font-size: 26px; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease;
        }
        #lightbox .lb-btn:hover { background: rgba(0,0,0,0.8); }
        #lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
        #lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
        #lb-close { top: 16px; right: 16px; font-size: 18px; width: 36px; height: 36px; border-radius: 8px; }
        #lb-count {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.75); font-size: 0.85rem; letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            /* 侧边栏 → 左侧抽屉（默认隐藏，汉堡菜单呼出） */
            #sidebar {
                top: 0; left: 0; bottom: 0;
                width: 288px; max-width: 84vw;
                height: 100vh; max-height: 100vh;
                border-radius: 0 18px 18px 0;
                transform: translateX(-105%);
                transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 60;
            }
            #sidebar.open { transform: translateX(0); }
            #sidebar-backdrop {
                display: block;
                position: fixed; inset: 0; z-index: 55;
                background: rgba(0,0,0,0.5);
                opacity: 0; visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
            }
            #sidebar-backdrop.show { opacity: 1; visibility: visible; }
            #btn-menu {
                display: flex; align-items: center; justify-content: center;
                position: fixed; top: 12px; left: 12px; z-index: 50;
                width: 44px; height: 44px; border-radius: 50%;
                border: 1px solid rgba(255,255,255,0.1); background: rgba(12,18,30,0.9);
                backdrop-filter: blur(16px); color: #fff; font-size: 1.25rem;
                cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            }
            #btn-auto-rotate { top: 12px; right: 12px; width: 44px; height: 44px; }
            #weather-panel { top: 64px; right: 12px; width: auto; max-width: 160px; }
            /* 底部控制条 → 底部居中、可横向滚动 */
            #bottom-controls {
                bottom: 12px; left: 50%; right: auto;
                transform: translateX(-50%);
                flex-direction: row; flex-wrap: nowrap;
                gap: 6px; max-width: calc(100vw - 24px);
                overflow-x: auto; padding-bottom: 4px;
                scrollbar-width: none;
            }
            #bottom-controls::-webkit-scrollbar { display: none; }
            .ctrl-group { flex-shrink: 0; }
            .ctrl-group button { padding: 9px 13px; font-size: 0.72rem; }
            /* 信息卡 → 底部抽屉 */
            #info-card {
                bottom: 0; left: 0; right: 0;
                width: 100%; max-width: 100%;
                transform: translateY(105%);
                border-radius: 18px 18px 0 0;
                padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
                max-height: 72vh; overflow-y: auto;
            }
            #info-card.show { transform: translateY(0); }
            #toast { bottom: 84px; }
            #lb-prev { left: 8px; }
            #lb-next { right: 8px; }
            .modal-box { min-width: auto; width: calc(100vw - 48px); padding: 22px 20px; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
    <div class="loader-logo" id="loader-logo"></div>
    <div class="loader-brand" id="loader-brand"></div>
    <div class="loader-sub" id="loader-sub">3D SMART NAVIGATION</div>
    <div class="loader-track"><div class="loader-bar" id="loader-bar"></div></div>
    <div class="loader-pct" id="loader-pct">正在加载地图...</div>
</div>

<!-- Setup hint (shown when no Amap key) -->
<div id="setup-hint">
    <h2>🔑 请配置高德地图 API Key</h2>
    <p>本系统使用高德地图提供真实地理信息（周边道路、建筑）。</p>
    <p>1. 前往 <a href="https://console.amap.com/" target="_blank">高德开放平台</a> 注册并创建应用</p>
    <p>2. 获取 <code>Web端(JS API)</code> 的 Key</p>
    <p>3. 填入 <code>config.json</code> 的 <code>geo.amapKey</code> 字段</p>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ========================================================
// SECTION A: CONFIGURATION
// ========================================================
let CONFIG = null;

const DEFAULT_CONFIG = {
    geo: { amapKey: '', amapSecurityCode: '', center: [116.3894, 39.9976], zoom: 17, pitch: 55, rotation: 20, mapStyle: 'amap://styles/dark' },
    brand: { name: '', subtitle: '', logo: '', logoText: '' },
    areas: [],
    groundSize: 200, fogColor: '#0a0e17', fogNear: 60, fogFar: 220,
    building: {
        main: { w: 10, d: 10, h: 10, color: '#1e2d5a', pos: [0, 0, 0] },
        subs: [],
        roadWidth: 8,
    },
    markers: {},
    routes: {},
    parking: [],
    particles: { count: 0, spread: 90, height: 35 },
    camera: {
        fov: 42, near: 0.5, far: 400,
        initial: { pos: [70, 50, 80], target: [0, 4, 0] },
        presets: {},
        tweenMs: 1400, orbitDamping: 0.08, minDist: 12, maxDist: 160, maxPolarFactor: 0.46,
    },
};

async function loadConfig() {
    try {
        const resp = await fetch('/config.json?t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        CONFIG = await resp.json();
        if (CONFIG.camera.maxPolarFactor) {
            CONFIG.camera.maxPolar = Math.PI * CONFIG.camera.maxPolarFactor;
        }
        console.log('✅ 配置已加载');
        // 应用品牌配置
        if (CONFIG.brand) {
            document.title = (CONFIG.brand.name || '3D 智慧导览') + ' · ' + (CONFIG.brand.subtitle || '');
            document.getElementById('loader-sub').textContent = CONFIG.brand.subtitle || '';
            const logoImgVal = CONFIG.brand.logo || '';
            const logoTextVal = CONFIG.brand.logoText || '';
            const isImgLogo = /^(data:image|https?:\/\/)/i.test(logoImgVal);
            const lb = document.getElementById('loader-brand');
            if (lb) lb.textContent = (logoTextVal ? logoTextVal + ' ' : '') + (CONFIG.brand.name || '');
            const logoEl = document.getElementById('sb-logo');
            logoEl.textContent = '';
            if (isImgLogo) {
                const img = document.createElement('img');
                img.src = logoImgVal;
                img.alt = 'logo';
                img.onload = () => applyLogoBg(img);
                if (img.complete) applyLogoBg(img);
                logoEl.appendChild(img);
            }
            if (logoTextVal) {
                const span = document.createElement('span');
                span.textContent = logoTextVal;
                logoEl.appendChild(span);
            }
            if (!isImgLogo && !logoTextVal) {
                logoEl.textContent = '🏟️';
            }
            document.getElementById('sb-title').textContent = CONFIG.brand.name || '';
            document.getElementById('sb-sub').textContent = CONFIG.brand.subtitle || '';
            const loaderLogoEl = document.getElementById('loader-logo');
            if (loaderLogoEl) {
                loaderLogoEl.textContent = '';
                if (isImgLogo) {
                    const limg = document.createElement('img');
                    limg.src = logoImgVal;
                    limg.alt = 'logo';
                    limg.onload = () => applyLogoBg(limg);
                    if (limg.complete) applyLogoBg(limg);
                    loaderLogoEl.appendChild(limg);
                }
            }
        }
    } catch (err) {
        console.warn('⚠️ 使用默认配置:', err.message);
        CONFIG = DEFAULT_CONFIG;
        CONFIG.camera.maxPolar = Math.PI * (CONFIG.camera.maxPolarFactor || 0.46);
    }
    // 路由颜色转换
    for (const key of Object.keys(CONFIG.routes || {})) {
        const c = CONFIG.routes[key].color;
        if (typeof c === 'string' && c.startsWith('#')) {
            CONFIG.routes[key].color = parseInt(c.slice(1), 16);
        }
    }
}

// 根据 logo 图片明暗自动选底色：浅色 logo → 深底，深色 logo → 白底
function applyLogoBg(img) {
    try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) return;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, w, h).data;
        let sum = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) {
            if (d[i + 3] > 10) {
                sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                n++;
            }
        }
        if (!n) return;
        if (sum / n > 165) {
            img.style.background = '#0b1220';
            img.style.boxShadow = 'inset 0 0 0 1px rgba(255,255,255,0.12)';
        } else {
            img.style.background = '#ffffff';
        }
    } catch (e) { /* 保持默认白底 */ }
}

// ========================================================
// SECTION B: UTILITIES
// ========================================================
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const METERS_PER_DEG_LAT = 111320;

/** 本地坐标 (meters from center) → 经纬度 */
function localToLngLat(localX, localZ, center) {
    const metersPerDegLng = METERS_PER_DEG_LAT * Math.cos((center[1] * Math.PI) / 180);
    return [center[0] + localX / metersPerDegLng, center[1] + localZ / METERS_PER_DEG_LAT];
}

/** 经纬度 → 本地坐标 (meters from center)，localToLngLat 的逆运算 */
function lngLatToLocal(lng, lat, center) {
    const metersPerDegLng = METERS_PER_DEG_LAT * Math.cos((center[1] * Math.PI) / 180);
    return [(lng - center[0]) * metersPerDegLng, (lat - center[1]) * METERS_PER_DEG_LAT];
}

/** 将 config 中的本地坐标转为经纬度 */
function markerLngLat(key) {
    const m = CONFIG.markers[key];
    if (!m) return CONFIG.geo.center;
    return localToLngLat(m.pos[0], m.pos[2], CONFIG.geo.center);
}

// ========================================================
// SECTION C: SIMPLE TWEEN ENGINE
// ========================================================
class TweenManager {
    constructor() { this._map = new Map(); }
    start(key, from, to, duration, easing = easeInOutCubic) {
        this._map.set(key, { from: from.clone(), to: to.clone(), start: performance.now(), duration, easing, value: from.clone() });
    }
    get(key) { const t = this._map.get(key); return t ? t.value : null; }
    isActive(key) { return this._map.has(key); }
    anyActive() { return this._map.size > 0; }
    update(now) {
        for (const [key, t] of this._map) {
            const elapsed = now - t.start;
            if (elapsed >= t.duration) { t.value.copy(t.to); this._map.delete(key); }
            else { const p = t.easing(elapsed / t.duration); t.value.lerpVectors(t.from, t.to, p); }
        }
    }
}

// ========================================================
// SECTION D: THREE.JS SCENE SETUP (GLCustomLayer 共享上下文)
// 坐标统一: x=east, y=north, z=UP (Amap 原生约定)
// camera.up = (0,0,1) 由 getCameraParams 提供
// ========================================================
function setupThreeScene(map) {
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        CONFIG.camera.fov, window.innerWidth / window.innerHeight, 1, 1 << 30);

    let renderer;
    const customCoords = map.customCoords;
    customCoords.setCenter(CONFIG.geo.center);

    // CSS2D Renderer — separate DOM canvas for labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'fixed';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.zIndex = '5';
    document.body.appendChild(labelRenderer.domElement);

    // Promise: resolves in GLCustomLayer.init with coordinate helpers
    let initResolve;
    const waitForInit = () => new Promise(r => { initResolve = r; });

    // GLCustomLayer: Three.js 共享 Amap 的 WebGL 上下文
    let firstFrame = true;
    const gllayer = new AMap.GLCustomLayer({
        zIndex: 10,
        init: (gl) => {
            renderer = new THREE.WebGLRenderer({
                context: gl,
                premultipliedAlpha: false,
            });
            renderer.autoClear = false;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // 计算缩放（init 后 lngLatToCoord 才可靠）
            let lpm;
            try {
                const [cx0, cy0] = customCoords.lngLatToCoord([CONFIG.geo.center[0], CONFIG.geo.center[1]]);
                const [cx1, cy1] = customCoords.lngLatToCoord([CONFIG.geo.center[0], CONFIG.geo.center[1] + 0.001]);
                lpm = Math.abs(cy1 - cy0) / (0.001 * METERS_PER_DEG_LAT);
                if (!lpm || lpm <= 0) lpm = 1;
                console.log('📐 Amap缩放(init): 1米 =', lpm.toFixed(4), '局部单位, cx0=', cx0, 'cy0=', cy0);
            } catch (e) {
                console.warn('⚠️ 缩放计算失败:', e.message);
                lpm = 1;
            }

            // 本地米 → Amap 内部 3D 坐标
            const lta = (localX, localZ, heightM) => {
                const [lng, lat] = localToLngLat(localX, localZ, CONFIG.geo.center);
                const coord = customCoords.lngLatToCoord([lng, lat]);
                return { x: coord[0], y: coord[1], z: heightM * lpm };
            };

            initResolve({ localToAmap: lta, localPerMeter: lpm });
            console.log('✅ Three.js GLCustomLayer init (共享上下文)');
        },
        render: () => {
            customCoords.lngLatsToCoords([[CONFIG.geo.center[0], CONFIG.geo.center[1]]]);

            const params = customCoords.getCameraParams();
            if (!params || !params.position) return;

            if (firstFrame) {
                firstFrame = false;
                console.log('📷 Amap相机:', JSON.stringify({
                    pos: params.position.map(v=>+v.toFixed(1)),
                    lookAt: params.lookAt.map(v=>+v.toFixed(1)),
                    up: params.up.map(v=>+v.toFixed(2)),
                    fov: params.fov, near: params.near, far: params.far
                }));
            }

            camera.near = params.near || 1;
            camera.far = params.far || 1 << 30;
            camera.fov = params.fov || CONFIG.camera.fov;

            // 直接用矩阵构建相机
            const p = params.position;
            const t = params.lookAt;
            const u = params.up;
            const fwd = new THREE.Vector3(t[0]-p[0], t[1]-p[1], t[2]-p[2]).normalize();
            const rgt = new THREE.Vector3().crossVectors(
                new THREE.Vector3(u[0], u[1], u[2]), fwd).normalize();
            const up2 = new THREE.Vector3().crossVectors(fwd, rgt);

            const m = camera.matrix.elements;
            m[0]=rgt.x; m[4]=up2.x; m[8]=-fwd.x; m[12]=p[0];
            m[1]=rgt.y; m[5]=up2.y; m[9]=-fwd.y; m[13]=p[1];
            m[2]=rgt.z; m[6]=up2.z; m[10]=-fwd.z; m[14]=p[2];
            m[3]=0;     m[7]=0;     m[11]=0;      m[15]=1;
            camera.matrixAutoUpdate = false;
            camera.matrixWorld.copy(camera.matrix);
            camera.updateProjectionMatrix();

            // 渲染 Three.js 场景
            renderer.resetState();
            renderer.render(scene, camera);
            renderer.resetState();

            // 渲染 CSS2D 标签
            labelRenderer.render(scene, camera);
        },
    });

    map.add(gllayer);

    // Lighting
    scene.add(new THREE.AmbientLight(0x8899bb, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(80, 120, 60);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x8899cc, 0.5);
    fill.position.set(-40, 80, -50);
    scene.add(fill);

    return { scene, camera, renderer, labelRenderer, customCoords, map, waitForInit };
}

// ========================================================
// SECTION E: BUILD VENUE 3D OBJECTS
// ========================================================

/** Create venue buildings */
function buildVenue(scene, localToAmap) {
    const S = localToAmap(0, 1, 0).y - localToAmap(0, 0, 0).y; // scale: 1 meter in Amap units
    const clickables = [];

    const main = CONFIG.building.main;
    let amap = null, col = null, w = 0, d = 0, h = 0;
    if (main) {
        w = main.w; d = main.d; h = main.h;
        amap = localToAmap(main.pos[0], main.pos[2], 0);
        col = new THREE.Color(main.color);

        // 主建筑（实心）：紫色体块 + 轻微自发光，对齐 Loca cadmall 深色商场风格
        const mainMat = new THREE.MeshStandardMaterial({
            color: col, roughness: 0.5, metalness: 0.15,
            emissive: col, emissiveIntensity: 0.35,
        });
        const mainMesh = new THREE.Mesh(new THREE.BoxGeometry(w * S, d * S, (h || 10) * S), mainMat);
        mainMesh.position.set(amap.x, amap.y, amap.z + (h || 10) * S / 2);
        mainMesh.castShadow = true; mainMesh.receiveShadow = true;
        scene.add(mainMesh);
    }

    // Sub buildings
    for (const sb of CONFIG.building.subs) {
        const _sc = new THREE.Color(sb.color);
        const mat = new THREE.MeshStandardMaterial({
            color: _sc, roughness: 0.45, metalness: 0.15, transparent: true, opacity: 0.8,
            emissive: _sc, emissiveIntensity: 0.3,
        });
        const sa = localToAmap(sb.x, sb.z, 0);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(sb.w * S, sb.d * S, sb.h * S), mat);
        mesh.position.set(sa.x, sa.y, sa.z + sb.h * S / 2);
        mesh.castShadow = true; mesh.receiveShadow = true;
        scene.add(mesh);
    }

    // Venue ground highlight（主建筑存在且未删除道路时才渲染）
    if (main && CONFIG.building.roadVisible !== false) {
        const rw = CONFIG.building.roadWidth || 8;
        const glowGeo = new THREE.PlaneGeometry((w + rw * 2 + 10) * S, (d + rw * 2 + 10) * S);
        const glowMat = new THREE.MeshBasicMaterial({
            color: col, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false,
        });
        const glowPlane = new THREE.Mesh(glowGeo, glowMat);
        glowPlane.position.set(amap.x, amap.y, 0.02);
        scene.add(glowPlane);
    }

    return { clickables };
}

/** Create entrance markers */
function createMarkers(scene, localToAmap) {
    const markerData = [];

    for (const [key, m] of Object.entries(CONFIG.markers)) {
        const amap = localToAmap(m.pos[0], m.pos[2], 0); // convert (east,north) meters → Amap coords
        const col = new THREE.Color(m.color);

        // Glowing cone — ConeGeometry points in Y, rotate to Z (up)
        const cone = new THREE.Mesh(new THREE.ConeGeometry(1.0, 3.2, 16),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.7, transparent: true, opacity: 0.9 }));
        cone.rotation.x = -Math.PI / 2;
        cone.position.set(amap.x, amap.y, amap.z + 1.7);
        cone.castShadow = true;
        cone.userData = { markerKey: key, baseEmissive: 0.7, phase: Math.random() * Math.PI * 2 };
        scene.add(cone);

        // Ground ring (flat on XY, Z is up)
        const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.0, 32),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
        ring.position.set(amap.x, amap.y, amap.z + 0.12);
        ring.userData = { markerKey: key, phase: Math.random() * Math.PI * 2 };
        scene.add(ring);

        // CSS2D Label
        const div = document.createElement('div');
        div.textContent = m.icon + ' ' + m.label;
        div.style.cssText = `
            color:#fff; font-size:14px; font-weight:700;
            text-shadow: 0 0 14px ${m.color}, 0 0 28px ${m.color};
            background: rgba(10,14,23,0.78); padding: 4px 14px;
            border-radius: 16px; border: 1.5px solid ${m.color};
            backdrop-filter: blur(6px); letter-spacing: 1px; white-space: nowrap;
        `;
        const label = new CSS2DObject(div);
        label.position.set(amap.x, amap.y, amap.z + 4.2);
        scene.add(label);

        const lngLat = localToLngLat(m.pos[0], m.pos[2], CONFIG.geo.center);
        markerData.push({ key, pos: [amap.x, amap.y, amap.z], lngLat, color: m.color });
    }

    return markerData;
}

// 流动虚线层：Canvas 覆盖地图，lineDashOffset 滚动（严格贴合 2D 折线）

let flowCanvas = null;              // 流动虚线 canvas
let flowCtx = null;                 // canvas 2D context
let flowRoutes = [];                // 流动虚线路线 [{id, pts, color, width, speed, offset}]
let flowLastT = 0;                  // 上一帧时间戳
let hideRoutes = false;             // 卫星图「隐藏路线」开关：隐藏流动虚线 + 路线名称标签
let routeOverlays = [];             // 路线相关 AMap 覆盖物（透明点击线 + 名称标签），供隐藏开关控制

// —— 水波纹扩散：独立 Canvas 覆盖层（rAF 平滑动画，不闪）——
let rippleCanvas = null;
let rippleCtx = null;
let ripplePoints = [];              // [{lng, lat, color}]
let rippleOn = false;               // 是否绘制（受「呼吸点」开关控制）

// —— 路线引导动画：点击路线后一个发光点从起点匀速滑到终点 ——
let guide = null;                   // { pts, color, t } t∈[0,1]，走完自动清除
const GUIDE_DURATION = 6;           // 完整走完一条路线所需秒数

// —— 首页测量工具：测距（RangingTool）+ 测面积（MouseTool 多边形）——
let measureMouseTool = null;        // AMap.MouseTool（测面积）
let measureRanging = null;          // AMap.RangingTool（测距）
let measureMode = null;             // 'distance' | 'area' | null
let measureOverlays = [];           // 测量产生的临时覆盖物（清除用）

// —— Loca v2 可视化特效：呼吸点(Scatter) + 脉冲线(PulseLine) ——
let locaContainer = null;           // Loca.Container 实例
let locaActive = false;             // 特效总开关状态
// 每个特效独立开关（选择性展示）：routes=路线脉冲 / breathing=呼吸点 / areas=区域3D体块
let locaEffects = { routes: true, breathing: true, areas: true };

function toast(msg){
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

// 测面积：等距圆柱局部近似 + shoelace（校园尺度精度足够）
function polygonAreaMeters(path){
    if (!path || path.length < 3) return 0;
    const R = 6371000, k = R * Math.PI / 180;
    let latSum = 0; path.forEach(p => latSum += p[1]);
    const cos = Math.cos(latSum / path.length * Math.PI / 180);
    const pts = path.map(p => [p[0] * k * cos, p[1] * k]);
    let area = 0;
    for (let i = 0; i < pts.length; i++) { const j = (i + 1) % pts.length; area += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1]; }
    return Math.abs(area / 2);
}
function formatArea(m2){
    if (m2 >= 1e6) return (m2 / 1e6).toFixed(2) + ' 平方公里';
    return Math.round(m2) + ' 平方米';
}

const FLOW_DASH = 12;               // 虚线实线段长度（px）
const FLOW_GAP = 12;                // 虚线空隙长度（px）
const FLOW_SPEED_BASE = 40;         // speed=1 时的滚动速度（px/秒）

function initFlowLayer(map) {
    if (flowCanvas) return;
    const container = document.getElementById('map-container');
    if (!container) return;
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:10;';
    container.appendChild(canvas);
    flowCanvas = canvas;
    flowCtx = canvas.getContext('2d');
    resizeFlowLayer();
    requestAnimationFrame((t) => animateFlow(map, t));
}

function resizeFlowLayer() {
    if (!flowCanvas) return;
    const container = document.getElementById('map-container');
    if (!container) return;
    const dpr = window.devicePixelRatio || 1;
    const w = container.clientWidth, h = container.clientHeight;
    flowCanvas.width = Math.round(w * dpr);
    flowCanvas.height = Math.round(h * dpr);
    flowCanvas.style.width = w + 'px';
    flowCanvas.style.height = h + 'px';
    flowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function addFlowRoute(id, pts, color, width, speed, direction) {
    removeFlowRoute(id);
    flowRoutes.push({
        id,
        pts: pts.map(p => [p[0], p[1]]),
        color: colorToHex(color, '#3b82f6'),
        width: width || 3,
        speed: (speed ?? 0.9),
        dir: (direction === -1 ? -1 : 1),   // 1=正向（起点→终点），-1=反向
        offset: Math.random() * (FLOW_DASH + FLOW_GAP),
    });
}

function removeFlowRoute(id) {
    const i = flowRoutes.findIndex(r => r.id === id);
    if (i >= 0) flowRoutes.splice(i, 1);
}

function drawFlowLayer(map) {
    if (!flowCtx) return;
    const dpr = window.devicePixelRatio || 1;
    const w = flowCanvas.width / dpr, h = flowCanvas.height / dpr;
    flowCtx.clearRect(0, 0, w, h);
    if (!hideRoutes) {   // 卫星图隐藏路线：清空后不绘制流动虚线
        for (const r of flowRoutes) {
            if (!r.pts || r.pts.length < 2) continue;
            const px = [];
            for (const p of r.pts) {
                const c = map.lngLatToContainer(new AMap.LngLat(p[0], p[1]));
                if (c) px.push([c.x, c.y]);
            }
            if (px.length < 2) continue;
            flowCtx.beginPath();
            flowCtx.moveTo(px[0][0], px[0][1]);
            for (let i = 1; i < px.length; i++) flowCtx.lineTo(px[i][0], px[i][1]);
            flowCtx.strokeStyle = r.color;
            flowCtx.lineWidth = r.width;
            flowCtx.lineCap = 'round';
            flowCtx.lineJoin = 'round';
            flowCtx.setLineDash([FLOW_DASH, FLOW_GAP]);
            flowCtx.lineDashOffset = -r.offset * (r.dir || 1);   // dir=1 正向滚，dir=-1 反向滚（每条路线可单独调方向）
            flowCtx.stroke();
        }
    }
    drawGuide(map);   // 引导光点：最上层，独立于「隐藏路线」开关
}

function animateFlow(map, now) {
    if (flowLastT) {
        const dt = Math.min((now - flowLastT) / 1000, 0.1);
        for (const r of flowRoutes) {
            r.offset += FLOW_SPEED_BASE * r.speed * dt;
            if (r.offset > 100000) r.offset = 0;
        }
        if (guide) {
            guide.t += dt / GUIDE_DURATION;
            if (guide.t >= 1) guide = null;   // 走完全程自动清除
        }
    }
    flowLastT = now;
    drawFlowLayer(map);
    requestAnimationFrame((t) => animateFlow(map, t));
}

// —— 路线引导动画：折线弧长参数化 + 发光点绘制 ——
function pathLength(pts) {
    let len = 0;
    for (let i = 1; i < pts.length; i++) {
        len += AMap.GeometryUtil.distance([pts[i - 1][0], pts[i - 1][1]], [pts[i][0], pts[i][1]]);
    }
    return len;
}

// 按弧长比例 t∈[0,1] 取折线上的点（分段线性插值，匀速滑过整条路线）
function pathPointAt(pts, t) {
    if (!pts || !pts.length) return null;
    if (pts.length === 1) return [pts[0][0], pts[0][1]];
    const total = pathLength(pts);
    if (total <= 0) return [pts[0][0], pts[0][1]];
    let target = Math.max(0, Math.min(1, t)) * total, acc = 0;
    for (let i = 1; i < pts.length; i++) {
        const seg = AMap.GeometryUtil.distance([pts[i - 1][0], pts[i - 1][1]], [pts[i][0], pts[i][1]]);
        if (acc + seg >= target) {
            const k = seg > 0 ? (target - acc) / seg : 0;
            return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k];
        }
        acc += seg;
    }
    return [pts[pts.length - 1][0], pts[pts.length - 1][1]];
}

function startGuide(pts, color, name) {
    if (!pts || pts.length < 2) return;
    guide = { pts: pts.map(p => [p[0], p[1]]), color: colorToHex(color, '#f59e0b'), t: 0 };
    toast('✨ 路线引导中' + (name ? '：' + name : ''));
}

// 在流动层画一个发光点（白心 + 颜色光环 + 渐隐拖尾），沿路线滑动
function drawGuide(map) {
    if (!flowCtx || !guide || !guide.pts) return;
    const pt = pathPointAt(guide.pts, guide.t);
    if (!pt) return;
    const c = map.lngLatToContainer(new AMap.LngLat(pt[0], pt[1]));
    if (!c) return;
    flowCtx.globalCompositeOperation = 'lighter';   // 加法混合，让光点更亮
    // 拖尾：沿路向后采样几个点，渐隐缩小
    const TRAIL = 7;
    for (let i = 1; i <= TRAIL; i++) {
        const tt = guide.t - i * 0.015;
        if (tt < 0) break;
        const tp = pathPointAt(guide.pts, tt);
        if (!tp) continue;
        const tc = map.lngLatToContainer(new AMap.LngLat(tp[0], tp[1]));
        if (!tc) continue;
        const k = 1 - i / (TRAIL + 1);
        const rad = 2 + 9 * k;
        const g = flowCtx.createRadialGradient(tc.x, tc.y, 0, tc.x, tc.y, rad);
        g.addColorStop(0, hexToRgba(guide.color, 0.45 * k));
        g.addColorStop(1, hexToRgba(guide.color, 0));
        flowCtx.fillStyle = g;
        flowCtx.beginPath();
        flowCtx.arc(tc.x, tc.y, rad, 0, Math.PI * 2);
        flowCtx.fill();
    }
    // 主光点：白心 + 颜色光环
    const head = flowCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 14);
    head.addColorStop(0, 'rgba(255,255,255,0.95)');
    head.addColorStop(0.35, hexToRgba(guide.color, 0.85));
    head.addColorStop(1, hexToRgba(guide.color, 0));
    flowCtx.fillStyle = head;
    flowCtx.beginPath();
    flowCtx.arc(c.x, c.y, 14, 0, Math.PI * 2);
    flowCtx.fill();
    flowCtx.globalCompositeOperation = 'source-over';
}

// —— 搜索定位：从当前勾选的「地图方案」里收集可搜索地物（标记/区域/路线/画框/圆/椭圆） ——
function buildSearchIndex() {
    const items = [];
    const push = (type, badge, icon, name, lng, lat, desc, images, color, pts, planId, floor, indoor) => {
        if (lng == null || lat == null) return;
        items.push({ type, badge, icon, name, lng, lat, desc: desc || '', images: images || [], color, pts, planId, floor, indoor: !!indoor });
    };
    // 遍历全部方案（含所有楼层），支持跨层搜索；planProjects 已在列表接口返回完整 data
    (planProjects || []).forEach(p => {
        const data = (p && p.data) ? p.data : {};
        const floor = floorOf(p);
        const planId = String(p.id);
        if (data.kind === 'map') {
            Object.entries(data.markers || {}).forEach(([name, m]) => push('marker', '标记点', '📍', name, m.lng, m.lat, m.desc, m.images, m.color, null, planId, floor, false));
            Object.entries(data.areas || {}).forEach(([name, a]) => {
                if (!a.pts || !a.pts.length) return;
                let cx = 0, cy = 0; a.pts.forEach(pt => { cx += pt[0]; cy += pt[1]; });
                push('area', '区域', '🗺️', name, cx / a.pts.length, cy / a.pts.length, a.desc, a.images, a.color, null, planId, floor, false);
            });
            Object.entries(data.routes || {}).forEach(([name, r]) => {
                if (!r.pts || r.pts.length < 2) return;
                const mid = r.pts[Math.floor(r.pts.length / 2)];
                push('route', '路线', '🛣️', name, mid[0], mid[1], r.desc, r.images, r.color, r.pts, planId, floor, false);
            });
            Object.entries(data.rects || {}).forEach(([name, r]) => {
                if (r.bounds && r.bounds[0] && r.bounds[1]) push('rect', '画框', '▭', name, (r.bounds[0][0] + r.bounds[1][0]) / 2, (r.bounds[0][1] + r.bounds[1][1]) / 2, r.desc, r.images, r.color, null, planId, floor, false);
            });
            Object.entries(data.circles || {}).forEach(([name, c]) => { if (c.center) push('circle', '画圆', '◯', name, c.center[0], c.center[1], c.desc, c.images, c.color, null, planId, floor, false); });
            Object.entries(data.ellipses || {}).forEach(([name, e]) => { if (e.center) push('ellipse', '椭圆', '⬭', name, e.center[0], e.center[1], e.desc, e.images, e.color, null, planId, floor, false); });
        } else {
            // 室内方案：elements（路线/区域/文字）用图片坐标 → 经纬度
            const els = Array.isArray(data.elements) ? data.elements : [];
            if (!els.length) return;
            const areaW = data.imageWidth || PLAN_DEFAULT_W;
            const areaH = data.imageHeight || PLAN_DEFAULT_H;
            const bounds = data.geoBounds || defaultPlanBounds();
            els.forEach(el => {
                if (el.visible === false) return;
                const pts = (el.points || []).map(pt => planPointToLngLat(pt.x, pt.y, bounds, areaW, areaH));
                const name = el.label || el.name || '';
                if (el.type === 'route' && pts.length >= 2) {
                    const mid = pts[Math.floor(pts.length / 2)];
                    push('route', '路线', '🛣️', name, mid[0], mid[1], '', [], el.color, pts, planId, floor, true);
                } else if (el.type === 'area' && pts.length >= 3) {
                    let cx = 0, cy = 0; pts.forEach(pt => { cx += pt[0]; cy += pt[1]; });
                    push('area', '区域', '🗺️', name, cx / pts.length, cy / pts.length, '', [], el.color, null, planId, floor, true);
                } else if (el.type === 'text' && pts.length >= 1) {
                    push('text', '文字', '💬', name, pts[0][0], pts[0][1], '', [], el.color, null, planId, floor, true);
                }
            });
        }
    });
    return items;
}

// —— 时段氛围：根据当前小时给地图叠加一层色调 + 暗角，营造昼夜氛围 ——
function updateAtmosphere() {
    const el = document.getElementById('atmosphere');
    if (!el) return;
    const h = new Date().getHours();
    // 每段 [起始时, 顶部色, 底部色, 暗角强度]
    const phases = [
        { from: 5, to: 7,  top: 'rgba(255,170,80,0.20)', bot: 'rgba(120,70,200,0.12)', vig: 0.22 },   // 清晨
        { from: 7, to: 10, top: 'rgba(255,225,170,0.08)', bot: 'rgba(255,255,255,0)',   vig: 0.10 },   // 上午
        { from: 10, to: 15, top: 'rgba(255,255,255,0)',   bot: 'rgba(255,255,255,0)',   vig: 0.06 },   // 正午
        { from: 15, to: 17, top: 'rgba(255,255,255,0)',   bot: 'rgba(255,190,110,0.07)', vig: 0.10 },  // 下午
        { from: 17, to: 19, top: 'rgba(40,60,140,0.20)',  bot: 'rgba(255,140,60,0.14)', vig: 0.28 },   // 黄昏
        { from: 19, to: 24, top: 'rgba(6,14,38,0.32)',    bot: 'rgba(3,6,20,0.22)',    vig: 0.40 },   // 夜晚
        { from: 0, to: 5,   top: 'rgba(6,14,38,0.32)',    bot: 'rgba(3,6,20,0.22)',    vig: 0.40 },   // 深夜
    ];
    const p = phases.find(p => h >= p.from && h < p.to) || phases[4];
    el.style.background = 'radial-gradient(ellipse at 50% 38%, rgba(0,0,0,0) 55%, rgba(0,0,0,' + p.vig + ') 100%), linear-gradient(180deg, ' + p.top + ', ' + p.bot + ')';
}

// —— 水波纹扩散：独立 Canvas 覆盖层，用 rAF 平滑画扩散圆环（不用 Loca setStyle，避免闪）——
function initRippleLayer(map) {
    if (rippleCanvas) return;
    const container = document.getElementById('map-container');
    if (!container) return;
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:10;';

function resizeRippleLayer() {
    if (!rippleCanvas) return;
    const container = document.getElementById('map-container');
    if (!container) return;
    const dpr = window.devicePixelRatio || 1;
    const w = container.clientWidth, h = container.clientHeight;
    rippleCanvas.width = Math.round(w * dpr);
    rippleCanvas.height = Math.round(h * dpr);

const RIPPLE_PERIOD = 1800;       // 一圈扩散的周期（ms）
const RIPPLE_MAX_R_M = 60;        // 最大扩散半径（米，贴地）
const RIPPLE_RINGS = 3;           // 同时存在的圈数
const RIPPLE_SEGMENTS = 24;       // 每圈采样点数（地面圆投影成椭圆）
const RIPPLE_GLOW_R_M = 16;       // 中心光晕半径（米，贴地）
const RIPPLE_GLOW_ALPHA = 0.25;   // 光晕中心不透明度
const RIPPLE_BEAM_PX = 90;        // 光柱基准高度（px，随俯仰缩短）

// 把以 (lng,lat) 为中心、地面半径 Rm 的圆采样成屏幕折线路径，3D 俯仰/旋转下自然压成椭圆
function projectGroundEllipse(map, lng, lat, Rm, dLatPerM, dLngPerM) {
    const path = new Path2D();
    let started = false;
    for (let s = 0; s < RIPPLE_SEGMENTS; s++) {
        const th = (s / RIPPLE_SEGMENTS) * Math.PI * 2;
        const c = map.lngLatToContainer(new AMap.LngLat(
            lng + Rm * dLngPerM * Math.cos(th),
            lat + Rm * dLatPerM * Math.sin(th)
        ));
        if (!c) continue;
        if (!started) { path.moveTo(c.x, c.y); started = true; }
        else path.lineTo(c.x, c.y);
    }
    if (!started) return null;
    path.closePath();
    return path;
}

function drawRipple(map, now) {
    if (!rippleCtx) return;
    const dpr = window.devicePixelRatio || 1;
    const w = rippleCanvas.width / dpr, h = rippleCanvas.height / dpr;
    rippleCtx.clearRect(0, 0, w, h);
    if (!rippleOn || !ripplePoints.length) return;
    rippleCtx.globalCompositeOperation = 'lighter';   // 加法混合：重叠发光互相叠亮
    rippleCtx.lineWidth = 2.5;
    for (const p of ripplePoints) {
        // 地面半径 → 经纬度偏移（经度方向除以 cos(lat) 做球面修正）
        const cosLat = Math.cos(p.lat * Math.PI / 180);
        const dLatPerM = 1 / METERS_PER_DEG_LAT;
        const dLngPerM = 1 / (METERS_PER_DEG_LAT * cosLat);
        const c0 = map.lngLatToContainer(new AMap.LngLat(p.lng, p.lat));
        if (!c0) continue;

        // 屏幕尺度：光晕半径对应的像素，光晕和光柱都按它定大小
        const ce = map.lngLatToContainer(new AMap.LngLat(p.lng + RIPPLE_GLOW_R_M * dLngPerM, p.lat));
        const gradR = ce ? Math.hypot(ce.x - c0.x, ce.y - c0.y) : RIPPLE_GLOW_R_M;

        // 中心光晕：软径向渐变填充贴地椭圆，让标记点有发光感（无硬点）
        const glow = projectGroundEllipse(map, p.lng, p.lat, RIPPLE_GLOW_R_M, dLatPerM, dLngPerM);
        if (glow) {
            const grad = rippleCtx.createRadialGradient(c0.x, c0.y, 0, c0.x, c0.y, gradR);
            grad.addColorStop(0, hexToRgba(p.color, RIPPLE_GLOW_ALPHA));
            grad.addColorStop(1, hexToRgba(p.color, 0));
            rippleCtx.fillStyle = grad;
            rippleCtx.fill(glow);
        }

        // 光柱：从标记点向上的一道竖向光束（加法混合，顶部渐隐，俯仰越大越矮）
        const pitch = (typeof map.getPitch === 'function') ? map.getPitch() : 55;
        const beamH = RIPPLE_BEAM_PX * (0.35 + 0.65 * Math.cos(pitch * Math.PI / 180));
        if (beamH > 8) {
            const halfW = Math.max(3, gradR * 0.18);
            const bg = rippleCtx.createLinearGradient(0, c0.y - beamH, 0, c0.y);
            bg.addColorStop(0, hexToRgba(p.color, 0));
            bg.addColorStop(0.72, hexToRgba(p.color, 0.16));
            bg.addColorStop(1, hexToRgba(p.color, 0.38));
            rippleCtx.fillStyle = bg;
            rippleCtx.beginPath();
            rippleCtx.moveTo(c0.x - halfW, c0.y);
            rippleCtx.lineTo(c0.x + halfW, c0.y);
            rippleCtx.lineTo(c0.x, c0.y - beamH);
            rippleCtx.closePath();
            rippleCtx.fill();
        }

        // 扩散圆环
        for (let i = 0; i < RIPPLE_RINGS; i++) {
            const t = ((now / RIPPLE_PERIOD) + i / RIPPLE_RINGS) % 1;   // 0..1
            const R = RIPPLE_MAX_R_M * t;
            const alpha = 0.75 * Math.sin(Math.PI * t);                  // 平滑淡入淡出
            if (R < 1) continue;                                         // 刚冒出时太小不画
            const ring = projectGroundEllipse(map, p.lng, p.lat, R, dLatPerM, dLngPerM);
            if (!ring) continue;
            rippleCtx.strokeStyle = hexToRgba(p.color, Math.max(0, alpha));
            rippleCtx.stroke(ring);
        }
    }
    rippleCtx.globalCompositeOperation = 'source-over';
}

function animateRipple(map, now) {
    drawRipple(map, now);
    requestAnimationFrame((t) => animateRipple(map, t));
}

class UIController {

    }

    /** 显示路线/区域的名称/介绍（复用信息卡，隐藏导航按钮与特征列表） */
    showFeature({ icon, title, badge, desc, images, lng, lat }) {

        document.getElementById('info-title-text').textContent = title || '';
        const badgeEl = document.getElementById('info-badge');

        else badgeEl.style.display = 'none';

        document.getElementById('info-features').innerHTML = '';

        document.getElementById('info-btn-end').addEventListener('click', () => setNavPoint('end'));

}

function loadScript(url) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Failed to load: ' + url));
        document.head.appendChild(s);
    });
}

async function initAmap() {
    const geo = CONFIG.geo;
    // 优先用服务端 .env 注入的高德 Key/安全密钥（高德官方建议：key 不进仓库）
    let amapKey = geo && geo.amapKey;
    let amapSecurityCode = geo && geo.amapSecurityCode;
    try {
        const r = await fetch('/api/amap');
        const d = await r.json();
        if (d && d.key) amapKey = d.key;
        if (d && d.securityJsCode) amapSecurityCode = d.securityJsCode;
    } catch (_) { /* 回退到 config.json 中的值 */ }

    if (!amapKey || amapKey === 'YOUR_AMAP_KEY_HERE') {
        // Show setup hint, fallback to classic
        document.getElementById('setup-hint').classList.add('show');
        document.getElementById('loading-screen').classList.add('hidden');
        console.warn('⚠️ 未配置高德地图 Key，使用经典 3D 模式');
        // Try loading classic version
        window.location.href = '/index-classic.html';
        return null;
    }

    // Set security code BEFORE loading Amap (required for keys created after 2021-12)
    if (amapSecurityCode) {
        window._AMapSecurityConfig = { securityJsCode: amapSecurityCode };
    }

    // Load Amap JS API
    const amapUrl = `https://webapi.amap.com/maps?v=2.0&key=${amapKey}`;
    await loadScript(amapUrl);

    // 加载 Loca v2（数据可视化）SDK，失败不阻塞主地图
    try { await loadScript(`https://webapi.amap.com/loca?v=2.0.0&key=${amapKey}`); }
    catch (_) { console.warn('⚠️ Loca SDK 加载失败，可视化特效不可用'); }

    // Also load AMap helper plugins if needed
    if (!window.AMap) {
        console.error('❌ 高德地图加载失败');
        return null;
    }

    const map = new AMap.Map('map-container', {
        viewMode: '3D',
        center: geo.center,
        zoom: geo.zoom || 17,
        pitch: geo.pitch || 55,
        rotation: geo.rotation || 20,
        mapStyle: geo.mapStyle || 'amap://styles/dark',
        features: ['bg', 'road', 'building', 'point'],
        showBuildingBlock: false,
        showLabel: true,
        buildingAnimation: true,
        // 允许 WebGL 内容
        webglParams: { preserveDrawingBuffer: false },
    });

    console.log('✅ 高德地图 3D 初始化完成');
    return map;
}

/** 颜色统一转为 #hex 字符串（config 中路线颜色已被 loadConfig 转为 int） */
function colorToHex(c, fallback = '#3b82f6') {
    if (c == null) return fallback;
    if (typeof c === 'string') return c.startsWith('#') ? c : '#' + c;
    if (typeof c === 'number') return '#' + c.toString(16).padStart(6, '0');
    return fallback;
}

/** 覆盖物点击：阻止冒泡并短暂屏蔽 map click 的 hideInfo，再执行展示逻辑 */
function onFeatureClick(e, fn) {
    if (e && e.originalEvent && e.originalEvent.stopPropagation) e.originalEvent.stopPropagation();
    suppressMapClickUntil = performance.now() + 300;
    fn();
}

/** 图片灯箱：点击缩略图放大，多图左右切换 */
let lbImages = []; let lbIndex = 0;
function openLightbox(imgs, idx) {
    lbImages = Array.isArray(imgs) ? imgs : (imgs ? [imgs] : []);
    lbIndex = idx || 0;
    renderLightbox();
    document.getElementById('lightbox').classList.add('show');
}
function renderLightbox() {
    document.getElementById('lightbox-img').src = lbImages[lbIndex] || '';
    document.getElementById('lb-count').textContent = lbImages.length > 1 ? (lbIndex + 1) + ' / ' + lbImages.length : '';
    document.getElementById('lb-prev').style.display = lbImages.length > 1 ? 'flex' : 'none';
    document.getElementById('lb-next').style.display = lbImages.length > 1 ? 'flex' : 'none';
}
function lightboxStep(d) {
    if (!lbImages.length) return;
    lbIndex = (lbIndex + d + lbImages.length) % lbImages.length;
    renderLightbox();
}
document.getElementById('lightbox').addEventListener('click', () => document.getElementById('lightbox').classList.remove('show'));
document.getElementById('lightbox-img').addEventListener('click', (e) => e.stopPropagation());
document.getElementById('lb-prev').addEventListener('click', (e) => { e.stopPropagation(); lightboxStep(-1); });
document.getElementById('lb-next').addEventListener('click', (e) => { e.stopPropagation(); lightboxStep(1); });
document.getElementById('lb-close').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('lightbox').classList.remove('show'); });
document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightbox').classList.contains('show')) return;
    if (e.key === 'ArrowLeft') lightboxStep(-1);
    else if (e.key === 'ArrowRight') lightboxStep(1);
    else if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('show');
});
