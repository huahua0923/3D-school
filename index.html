<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 智慧导览</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Inter', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background: #0a0e17;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        :root {
            --accent-main:  #4da6ff;
            --accent-east:  #00d4aa;
            --accent-west:  #ffb347;
            --accent-vip:   #c79fff;
            --bg-panel:   rgba(12, 18, 30, 0.88);
            --border-subtle: rgba(255,255,255,0.08);
            --border-active: rgba(255,255,255,0.18);
            --shadow-panel: 0 8px 32px rgba(0,0,0,0.45);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --radius-full: 9999px;
        }

        /* Map + Canvas containers */
        #map-container { position: fixed; inset: 0; z-index: 0; }
        #app-canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        /* Loading */
        #loading-screen {
            position: fixed; inset: 0; z-index: 100; background: #0a0e17;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-logo { width: 68px; height: 68px; margin: 0 auto 22px; display: flex; align-items: center; justify-content: center; }
        .loader-logo:empty { display: none; }
        .loader-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 14px; padding: 8px; box-sizing: border-box; }
        .loader-brand { font-size: 2rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
        .loader-brand span { color: var(--accent-main); }
        .loader-sub { font-size: 0.875rem; color: rgba(255,255,255,0.58); margin-bottom: 40px; letter-spacing: 0.06em; }
        .loader-track { width: 240px; height: 3px; background: rgba(255,255,255,0.08); border-radius: var(--radius-full); overflow: hidden; }
        .loader-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-main), var(--accent-vip)); border-radius: var(--radius-full); transition: width 0.3s ease; }
        .loader-pct { margin-top: 12px; font-size: 0.75rem; color: rgba(255,255,255,0.32); }

        #setup-hint {
            display: none; position: fixed; inset: 0; z-index: 101; background: #0a0e17;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px;
        }
        #setup-hint.show { display: flex; }
        #setup-hint h2 { font-size: 1.5rem; margin-bottom: 12px; color: #f0f6fc; }
        #setup-hint p { color: rgba(255,255,255,0.58); max-width: 520px; line-height: 1.7; margin-bottom: 8px; }
        #setup-hint code { background: #1c2128; padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; color: var(--accent-main); }
        #setup-hint a { color: var(--accent-main); }

        /* ====== Left Sidebar ====== */
        #sidebar {
            position: fixed; top: 16px; left: 16px; z-index: 20;
            width: 240px; max-height: calc(100vh - 32px); overflow-y: auto;
            background: rgba(12,18,30,0.92); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            padding: 0; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex; flex-direction: column;
        }
        .sb-brand { padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sb-logo { display: flex; align-items: center; gap: 8px; font-size: 1.7rem; margin-bottom: 6px; color: #f0f6fc; }
        .sb-logo img { flex: none; width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 9px; padding: 4px; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
        .sb-logo span { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
        .sb-title { font-size: 1.1rem; font-weight: 700; color: #f0f6fc; letter-spacing: 0.02em; }
        .sb-sub { font-size: 0.65rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
        .sb-section { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .sb-label { font-size: 0.6rem; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .sb-tools { display: flex; gap: 4px; }
        .sb-tools button {
            width: 42px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.5);
            font-size: 1rem; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .sb-tools button:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .sb-tools button.active { color: #fff; background: var(--accent-main); border-color: var(--accent-main); box-shadow: 0 0 16px rgba(77,166,255,0.3); }
        .sb-tools button:disabled { opacity: 0.25; cursor: default; }
        .sb-search { position: relative; }
        .sb-search input {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04); color: #f0f6fc; font-size: 0.8rem;
            font-family: inherit; outline: none;
        }
        .sb-search input:focus { border-color: var(--accent-main); }
        .sb-search input::placeholder { color: rgba(255,255,255,0.25); }
        #search-results {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            background: rgba(12,18,30,0.98); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; margin-top: 4px; max-height: 200px; overflow-y: auto; z-index: 30;
        }
        .search-item { padding: 8px 12px; font-size: 0.8rem; cursor: pointer; color: rgba(255,255,255,0.7); border-bottom: 1px solid rgba(255,255,255,0.04); }
        .search-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sb-layers { display: flex; flex-direction: column; gap: 4px; }
        .sb-layer-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 10px;
            border-radius: 6px; font-size: 0.78rem; color: rgba(255,255,255,0.55);
        }
        .layer-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .sb-actions { display: flex; flex-direction: column; gap: 6px; }
        .sb-btn {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.7);
            font-size: 0.8rem; font-family: inherit; cursor: pointer; text-align: center;
        }
        .sb-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sb-btn.primary { background: var(--accent-main); border-color: var(--accent-main); color: #fff; font-weight: 600; }
        .sb-status { font-size: 0.7rem; color: rgba(255,255,255,0.35); text-align: center; }
.plan-list { display: flex; flex-direction: column; gap: 6px; }
.plan-item { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: rgba(255,255,255,0.7); cursor: pointer; padding: 2px 0; }
.plan-item input { accent-color: var(--accent-main); cursor: pointer; flex-shrink: 0; }
.plan-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ====== Top-Right & Bottom-Right ====== */
        #btn-auto-rotate {
            position: fixed; top: 20px; right: 20px; z-index: 20;
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(12,18,30,0.9);
            backdrop-filter: blur(16px); color: rgba(255,255,255,0.5); font-size: 1.1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        #btn-auto-rotate:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        #bottom-controls {
            position: fixed; bottom: 24px; right: 24px; z-index: 20; display: flex; gap: 8px;
        }
        .ctrl-group {
            display: flex; gap: 2px; padding: 3px; border-radius: 24px;
            background: rgba(12,18,30,0.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .ctrl-group button {
            padding: 5px 12px; border-radius: 20px; border: none; background: transparent;
            color: rgba(255,255,255,0.4); font-size: 0.7rem; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: all 0.2s;
        }
        .ctrl-group button:hover { color: rgba(255,255,255,0.7); }
        .ctrl-group button.active { background: rgba(255,255,255,0.1); color: #fff; }

        
        @keyframes bannerIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

        /* Login modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: rgba(22,27,34,0.98); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 28px 32px; min-width: 360px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5); animation: modalIn 0.2s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } }
        .modal-box h2 { font-size: 1.1rem; color: #f0f6fc; margin-bottom: 4px; }
        .modal-box input {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
            color: #f0f6fc; font-size: 0.9rem; font-family: inherit; outline: none;
        }
        .modal-box input:focus { border-color: var(--accent-main); }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }


        /* Info card */
        #info-card-backdrop {
            position: fixed; inset: 0; z-index: 25;
            background: rgba(0,0,0,0.35);
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #info-card-backdrop.show { opacity: 1; visibility: visible; }
        #info-card {
            position: fixed; z-index: 30;
            bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
            width: 420px; max-width: calc(100vw - 32px);
            background: var(--bg-panel); backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 28px 24px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #info-card.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .info-close {
            position: absolute; top: 12px; right: 14px;
            width: 32px; height: 32px; border-radius: var(--radius-full);
            border: none; background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.58); font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .info-close:hover { background: rgba(255,255,255,0.14); color: #fff; }
        .info-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .info-title {
            font-size: 1.25rem; font-weight: 700; margin-bottom: 4px;
            display: flex; align-items: center; gap: 10px;
        }
        .info-title .badge {
            display: inline-block; font-size: 0.625rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em;
            padding: 4px 10px; border-radius: var(--radius-full);
        }
        .badge.main { background: rgba(77,166,255,0.2); color: var(--accent-main); }
        .badge.east { background: rgba(0,212,170,0.2); color: var(--accent-east); }
        .badge.west { background: rgba(255,179,71,0.2); color: var(--accent-west); }
        .badge.vip  { background: rgba(199,159,255,0.2); color: var(--accent-vip); }
        .info-desc { font-size: 0.875rem; color: rgba(255,255,255,0.58); margin: 10px 0 16px; line-height: 1.5; }
        .info-features { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .info-feature {
            font-size: 0.75rem; padding: 6px 12px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
            color: rgba(255,255,255,0.58);
            display: flex; align-items: center; gap: 6px;
        }
        .info-action { display: flex; gap: 10px; }
        .info-btn {
            flex: 1; padding: 10px 0; border-radius: var(--radius-sm);
            font-family: inherit; font-size: 0.8125rem; font-weight: 600;
            cursor: pointer; border: none;
            transition: all 0.2s ease; letter-spacing: 0.02em;
        }
        .info-btn.primary { background: var(--accent-main); color: #000; }
        .info-btn.primary:hover { filter: brightness(1.15); }
        .info-btn.ghost {
            background: transparent; color: rgba(255,255,255,0.58); border: 1px solid var(--border-subtle);
        }
        .info-btn.ghost:hover { border-color: var(--border-active); color: #fff; }

        /* Responsive */
        @media (max-width: 768px) {
            #sidebar { width: 200px; top: 8px; left: 8px; max-height: calc(100vh - 16px); }
            #info-card { bottom: 100px; width: calc(100vw - 24px); }
            #bottom-controls { bottom: 12px; right: 12px; flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
    <div class="loader-logo" id="loader-logo"></div>
    <div class="loader-brand" id="loader-brand"></div>
    <div class="loader-sub" id="loader-sub">3D SMART NAVIGATION</div>
    <div class="loader-track"><div class="loader-bar" id="loader-bar"></div></div>
    <div class="loader-pct" id="loader-pct">正在加载地图...</div>
</div>

<!-- Setup hint (shown when no Amap key) -->
<div id="setup-hint">
    <h2>🔑 请配置高德地图 API Key</h2>
    <p>本系统使用高德地图提供真实地理信息（周边道路、建筑）。</p>
    <p>1. 前往 <a href="https://console.amap.com/" target="_blank">高德开放平台</a> 注册并创建应用</p>
    <p>2. 获取 <code>Web端(JS API)</code> 的 Key</p>
    <p>3. 填入 <code>config.json</code> 的 <code>geo.amapKey</code> 字段</p>
    <p style="margin-top:16px;font-size:0.85rem;">也可通过 <a href="/admin.html">后台管理</a> → 地理信息 进行配置</p>
</div>

<!-- Map container (Amap) -->
<div id="map-container"></div>

<!-- ====== Left Sidebar Panel ====== -->
<div id="sidebar">
    <!-- Brand -->
    <div class="sb-brand">
        <div class="sb-logo" id="sb-logo">🏟️</div>
        <div class="sb-title" id="sb-title"></div>
        <div class="sb-sub" id="sb-sub">3D 智慧导览</div>
    </div>

    <!-- Search -->
    <div class="sb-section">
        <div class="sb-search">
            <input type="text" id="search-input" placeholder="搜索地点..." autocomplete="off" />
            <div id="search-results"></div>
        </div>
    </div>

    <!-- Plans (导览方案) -->
    <div class="sb-section">
        <div class="sb-label">🗂️ 导览方案</div>
        <div class="plan-list" id="plan-list"></div>
        <div style="display:flex;gap:6px;margin-top:8px;">
            <button class="sb-btn" id="btn-clear-plan" style="font-size:0.72rem;padding:6px 8px;flex:1;">清除全部</button>
        </div>
    </div>

    <!-- Location & Navigation -->
    <div class="sb-section">
        <div class="sb-label">📍 室内定位</div>
        <button class="sb-btn" id="btn-my-location" style="margin-bottom:6px;">📍 设置我的位置</button>
        <div id="location-info" style="display:none;font-size:0.72rem;color:rgba(255,255,255,0.5);">
            <span id="loc-coords"></span>
            <button class="sb-btn" id="btn-clear-location" style="margin-top:4px;font-size:0.7rem;">清除位置</button>
        </div>
        <div style="display:none;margin-top:4px;font-size:0.72rem;color:var(--accent-main);" id="nav-info"></div>
    </div>

    <!-- Links -->
    <div class="sb-section sb-actions">
        <a href="/admin.html" class="sb-btn" style="text-decoration:none;display:block;margin-top:4px;">⚙️ 系统配置</a>
    </div>
</div>

<!-- ====== Top Right Controls ====== -->
<button id="btn-auto-rotate" title="自动旋转">⟳</button>

<!-- ====== Bottom Right Controls ====== -->
<div id="bottom-controls">
    <div class="ctrl-group">
        <button data-mode="3d" class="active">3D</button>
        <button data-mode="2d">2D</button>
    </div>
    <div class="ctrl-group" id="camera-presets" style="display:none;"></div>
    <div class="ctrl-group">
        <button data-layer="dark" class="active">暗黑</button>
        <button data-layer="normal">标准</button>
        <button data-layer="satellite">卫星</button>
    </div>
</div>

<!-- Info card -->
<div id="info-card-backdrop"></div>
<div id="info-card">
    <button class="info-close">✕</button>
    <div class="info-icon" id="info-icon">🚪</div>
    <div class="info-title">
        <span id="info-title-text">主入口</span>
        <span class="badge main" id="info-badge">MAIN</span>
    </div>
    <p class="info-desc" id="info-desc"></p>
    <div class="info-features" id="info-features"></div>
    <div class="info-action">
        <button class="info-btn primary" id="info-btn-nav">📍 导航至此</button>
        <button class="info-btn ghost" id="info-btn-close">关闭</button>
    </div>
</div>

<!-- ============================================================
Three.js Import Map
============================================================ -->
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ========================================================
// SECTION A: CONFIGURATION
// ========================================================
let CONFIG = null;

const DEFAULT_CONFIG = {
    geo: { amapKey: '', amapSecurityCode: '', center: [116.3894, 39.9976], zoom: 17, pitch: 55, rotation: 20, mapStyle: 'amap://styles/dark' },
    brand: { name: '', subtitle: '', logo: '', logoText: '' },
    areas: [],
    groundSize: 200, fogColor: '#0a0e17', fogNear: 60, fogFar: 220,
    building: {
        main: { w: 10, d: 10, h: 10, color: '#1e2d5a', pos: [0, 0, 0] },
        subs: [],
        roadWidth: 8,
    },
    markers: {},
    routes: {},
    parking: [],
    particles: { count: 0, spread: 90, height: 35 },
    camera: {
        fov: 42, near: 0.5, far: 400,
        initial: { pos: [70, 50, 80], target: [0, 4, 0] },
        presets: {},
        tweenMs: 1400, orbitDamping: 0.08, minDist: 12, maxDist: 160, maxPolarFactor: 0.46,
    },
};

async function loadConfig() {
    try {
        const resp = await fetch('/config.json?t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        CONFIG = await resp.json();
        if (CONFIG.camera.maxPolarFactor) {
            CONFIG.camera.maxPolar = Math.PI * CONFIG.camera.maxPolarFactor;
        }
        console.log('✅ 配置已加载');
        // 应用品牌配置
        if (CONFIG.brand) {
            document.title = (CONFIG.brand.name || '3D 智慧导览') + ' · ' + (CONFIG.brand.subtitle || '');
            document.getElementById('loader-sub').textContent = CONFIG.brand.subtitle || '';
            const logoImgVal = CONFIG.brand.logo || '';
            const logoTextVal = CONFIG.brand.logoText || '';
            const isImgLogo = /^(data:image|https?:\/\/)/i.test(logoImgVal);
            const lb = document.getElementById('loader-brand');
            if (lb) lb.textContent = (logoTextVal ? logoTextVal + ' ' : '') + (CONFIG.brand.name || '');
            const logoEl = document.getElementById('sb-logo');
            logoEl.textContent = '';
            if (isImgLogo) {
                const img = document.createElement('img');
                img.src = logoImgVal;
                img.alt = 'logo';
                img.onload = () => applyLogoBg(img);
                if (img.complete) applyLogoBg(img);
                logoEl.appendChild(img);
            }
            if (logoTextVal) {
                const span = document.createElement('span');
                span.textContent = logoTextVal;
                logoEl.appendChild(span);
            }
            if (!isImgLogo && !logoTextVal) {
                logoEl.textContent = '🏟️';
            }
            document.getElementById('sb-title').textContent = CONFIG.brand.name || '';
            document.getElementById('sb-sub').textContent = CONFIG.brand.subtitle || '';
            const loaderLogoEl = document.getElementById('loader-logo');
            if (loaderLogoEl) {
                loaderLogoEl.textContent = '';
                if (isImgLogo) {
                    const limg = document.createElement('img');
                    limg.src = logoImgVal;
                    limg.alt = 'logo';
                    limg.onload = () => applyLogoBg(limg);
                    if (limg.complete) applyLogoBg(limg);
                    loaderLogoEl.appendChild(limg);
                }
            }
        }
    } catch (err) {
        console.warn('⚠️ 使用默认配置:', err.message);
        CONFIG = DEFAULT_CONFIG;
        CONFIG.camera.maxPolar = Math.PI * (CONFIG.camera.maxPolarFactor || 0.46);
    }
    // 路由颜色转换
    for (const key of Object.keys(CONFIG.routes || {})) {
        const c = CONFIG.routes[key].color;
        if (typeof c === 'string' && c.startsWith('#')) {
            CONFIG.routes[key].color = parseInt(c.slice(1), 16);
        }
    }
}

// 根据 logo 图片明暗自动选底色：浅色 logo → 深底，深色 logo → 白底
function applyLogoBg(img) {
    try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) return;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, w, h).data;
        let sum = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) {
            if (d[i + 3] > 10) {
                sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                n++;
            }
        }
        if (!n) return;
        if (sum / n > 165) {
            img.style.background = '#0b1220';
            img.style.boxShadow = 'inset 0 0 0 1px rgba(255,255,255,0.12)';
        } else {
            img.style.background = '#ffffff';
        }
    } catch (e) { /* 保持默认白底 */ }
}

// SECTION B: UTILITIES
// ========================================================
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const METERS_PER_DEG_LAT = 111320;

/** 本地坐标 (meters from center) → 经纬度 */
function localToLngLat(localX, localZ, center) {
    const metersPerDegLng = METERS_PER_DEG_LAT * Math.cos((center[1] * Math.PI) / 180);
    return [center[0] + localX / metersPerDegLng, center[1] + localZ / METERS_PER_DEG_LAT];
}

/** 经纬度 → 本地坐标 (meters from center)，localToLngLat 的逆运算 */
function lngLatToLocal(lng, lat, center) {
    const metersPerDegLng = METERS_PER_DEG_LAT * Math.cos((center[1] * Math.PI) / 180);
    return [(lng - center[0]) * metersPerDegLng, (lat - center[1]) * METERS_PER_DEG_LAT];
}

/** 将 config 中的本地坐标转为经纬度 */
function markerLngLat(key) {
    const m = CONFIG.markers[key];
    if (!m) return CONFIG.geo.center;
    return localToLngLat(m.pos[0], m.pos[2], CONFIG.geo.center);
}

// ========================================================
// SECTION C: SIMPLE TWEEN ENGINE
// ========================================================
class TweenManager {
    constructor() { this._map = new Map(); }
    start(key, from, to, duration, easing = easeInOutCubic) {
        this._map.set(key, { from: from.clone(), to: to.clone(), start: performance.now(), duration, easing, value: from.clone() });
    }
    get(key) { const t = this._map.get(key); return t ? t.value : null; }
    isActive(key) { return this._map.has(key); }
    anyActive() { return this._map.size > 0; }
    update(now) {
        for (const [key, t] of this._map) {
            const elapsed = now - t.start;
            if (elapsed >= t.duration) { t.value.copy(t.to); this._map.delete(key); }
            else { const p = t.easing(elapsed / t.duration); t.value.lerpVectors(t.from, t.to, p); }
        }
    }
}

// ========================================================
// SECTION D: THREE.JS SCENE SETUP (GLCustomLayer 共享上下文)
// 坐标统一: x=east, y=north, z=UP (Amap 原生约定)
// camera.up = (0,0,1) 由 getCameraParams 提供
// ========================================================
function setupThreeScene(map) {
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        CONFIG.camera.fov, window.innerWidth / window.innerHeight, 1, 1 << 30);

    let renderer;
    const customCoords = map.customCoords;
    customCoords.setCenter(CONFIG.geo.center);

    // CSS2D Renderer — separate DOM canvas for labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'fixed';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    labelRenderer.domElement.style.zIndex = '5';
    document.body.appendChild(labelRenderer.domElement);

    // Promise: resolves in GLCustomLayer.init with coordinate helpers
    let initResolve;
    const waitForInit = () => new Promise(r => { initResolve = r; });

    // GLCustomLayer: Three.js 共享 Amap 的 WebGL 上下文
    let firstFrame = true;
    const gllayer = new AMap.GLCustomLayer({
        zIndex: 10,
        init: (gl) => {
            renderer = new THREE.WebGLRenderer({
                context: gl,
                premultipliedAlpha: false,
            });
            renderer.autoClear = false;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // 计算缩放（init 后 lngLatToCoord 才可靠）
            let lpm;
            try {
                const [cx0, cy0] = customCoords.lngLatToCoord([CONFIG.geo.center[0], CONFIG.geo.center[1]]);
                const [cx1, cy1] = customCoords.lngLatToCoord([CONFIG.geo.center[0], CONFIG.geo.center[1] + 0.001]);
                lpm = Math.abs(cy1 - cy0) / (0.001 * METERS_PER_DEG_LAT);
                if (!lpm || lpm <= 0) lpm = 1;
                console.log('📐 Amap缩放(init): 1米 =', lpm.toFixed(4), '局部单位, cx0=', cx0, 'cy0=', cy0);
            } catch (e) {
                console.warn('⚠️ 缩放计算失败:', e.message);
                lpm = 1;
            }

            // 本地米 → Amap 内部 3D 坐标
            const lta = (localX, localZ, heightM) => {
                const [lng, lat] = localToLngLat(localX, localZ, CONFIG.geo.center);
                const coord = customCoords.lngLatToCoord([lng, lat]);
                return { x: coord[0], y: coord[1], z: heightM * lpm };
            };

            initResolve({ localToAmap: lta, localPerMeter: lpm });
            console.log('✅ Three.js GLCustomLayer init (共享上下文)');
        },
        render: () => {
            customCoords.lngLatsToCoords([[CONFIG.geo.center[0], CONFIG.geo.center[1]]]);

            const params = customCoords.getCameraParams();
            if (!params || !params.position) return;

            if (firstFrame) {
                firstFrame = false;
                console.log('📷 Amap相机:', JSON.stringify({
                    pos: params.position.map(v=>+v.toFixed(1)),
                    lookAt: params.lookAt.map(v=>+v.toFixed(1)),
                    up: params.up.map(v=>+v.toFixed(2)),
                    fov: params.fov, near: params.near, far: params.far
                }));
            }

            camera.near = params.near || 1;
            camera.far = params.far || 1 << 30;
            camera.fov = params.fov || CONFIG.camera.fov;

            // 直接用矩阵构建相机
            const p = params.position;
            const t = params.lookAt;
            const u = params.up;
            const fwd = new THREE.Vector3(t[0]-p[0], t[1]-p[1], t[2]-p[2]).normalize();
            const rgt = new THREE.Vector3().crossVectors(
                new THREE.Vector3(u[0], u[1], u[2]), fwd).normalize();
            const up2 = new THREE.Vector3().crossVectors(fwd, rgt);

            const m = camera.matrix.elements;
            m[0]=rgt.x; m[4]=up2.x; m[8]=-fwd.x; m[12]=p[0];
            m[1]=rgt.y; m[5]=up2.y; m[9]=-fwd.y; m[13]=p[1];
            m[2]=rgt.z; m[6]=up2.z; m[10]=-fwd.z; m[14]=p[2];
            m[3]=0;     m[7]=0;     m[11]=0;      m[15]=1;
            camera.matrixAutoUpdate = false;
            camera.matrixWorld.copy(camera.matrix);
            camera.updateProjectionMatrix();

            // 渲染 Three.js 场景
            renderer.resetState();
            renderer.render(scene, camera);
            renderer.resetState();

            // 渲染 CSS2D 标签
            labelRenderer.render(scene, camera);
        },
    });

    map.add(gllayer);

    // Lighting
    scene.add(new THREE.AmbientLight(0x8899bb, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(80, 120, 60);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x8899cc, 0.5);
    fill.position.set(-40, 80, -50);
    scene.add(fill);

    return { scene, camera, renderer, labelRenderer, customCoords, map, waitForInit };
}

/** Create venue buildings */
function buildVenue(scene, localToAmap) {
    const S = localToAmap(0, 1, 0).y - localToAmap(0, 0, 0).y; // scale: 1 meter in Amap units
    const clickables = [];

    const main = CONFIG.building.main;
    let amap = null, col = null, w = 0, d = 0, h = 0;
    if (main) {
        w = main.w; d = main.d; h = main.h;
        amap = localToAmap(main.pos[0], main.pos[2], 0);
        col = new THREE.Color(main.color);

        // 主建筑（实心）
        const mainMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.4, metalness: 0.2 });
        const mainMesh = new THREE.Mesh(new THREE.BoxGeometry(w * S, d * S, (h || 10) * S), mainMat);
        mainMesh.position.set(amap.x, amap.y, amap.z + (h || 10) * S / 2);
        mainMesh.castShadow = true; mainMesh.receiveShadow = true;
        scene.add(mainMesh);
    }

    // Sub buildings
    for (const sb of CONFIG.building.subs) {
        const mat = new THREE.MeshStandardMaterial({ color: sb.color, roughness: 0.45, metalness: 0.15, transparent: true, opacity: 0.8 });
        const sa = localToAmap(sb.x, sb.z, 0);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(sb.w * S, sb.d * S, sb.h * S), mat);
        mesh.position.set(sa.x, sa.y, sa.z + sb.h * S / 2);
        mesh.castShadow = true; mesh.receiveShadow = true;
        scene.add(mesh);
    }

    // Venue ground highlight（主建筑存在且未删除道路时才渲染）
    if (main && CONFIG.building.roadVisible !== false) {
        const rw = CONFIG.building.roadWidth || 8;
        const glowGeo = new THREE.PlaneGeometry((w + rw * 2 + 10) * S, (d + rw * 2 + 10) * S);
        const glowMat = new THREE.MeshBasicMaterial({
            color: col, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false,
        });
        const glowPlane = new THREE.Mesh(glowGeo, glowMat);
        glowPlane.position.set(amap.x, amap.y, 0.02);
        scene.add(glowPlane);
    }

    return { clickables };
}

/** Create entrance markers */
function createMarkers(scene, localToAmap) {
    const markerData = [];

    for (const [key, m] of Object.entries(CONFIG.markers)) {
        const amap = localToAmap(m.pos[0], m.pos[2], 0); // convert (east,north) meters → Amap coords
        const col = new THREE.Color(m.color);

        // Glowing cone — ConeGeometry points in Y, rotate to Z (up)
        const cone = new THREE.Mesh(new THREE.ConeGeometry(1.0, 3.2, 16),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.7, transparent: true, opacity: 0.9 }));
        cone.rotation.x = -Math.PI / 2;
        cone.position.set(amap.x, amap.y, amap.z + 1.7);
        cone.castShadow = true;
        cone.userData = { markerKey: key, baseEmissive: 0.7, phase: Math.random() * Math.PI * 2 };
        scene.add(cone);

        // Ground ring (flat on XY, Z is up)
        const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.0, 32),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
        ring.position.set(amap.x, amap.y, amap.z + 0.12);
        ring.userData = { markerKey: key, phase: Math.random() * Math.PI * 2 };
        scene.add(ring);

        // CSS2D Label
        const div = document.createElement('div');
        div.textContent = m.icon + ' ' + m.label;
        div.style.cssText = `
            color:#fff; font-size:14px; font-weight:700;
            text-shadow: 0 0 14px ${m.color}, 0 0 28px ${m.color};
            background: rgba(10,14,23,0.78); padding: 4px 14px;
            border-radius: 16px; border: 1.5px solid ${m.color};
            backdrop-filter: blur(6px); letter-spacing: 1px; white-space: nowrap;
        `;
        const label = new CSS2DObject(div);
        label.position.set(amap.x, amap.y, amap.z + 4.2);
        scene.add(label);

        const lngLat = localToLngLat(m.pos[0], m.pos[2], CONFIG.geo.center);
        markerData.push({ key, pos: [amap.x, amap.y, amap.z], lngLat, color: m.color });
    }

    return markerData;
}

// ========================================================
// 流动虚线层：Canvas 覆盖地图，lineDashOffset 滚动（严格贴合 2D 折线）
// ========================================================
let flowCanvas = null;              // 流动虚线 canvas
let flowCtx = null;                 // canvas 2D context
let flowRoutes = [];                // 流动虚线路线 [{id, pts, color, width, speed, offset}]
let flowLastT = 0;                  // 上一帧时间戳

const FLOW_DASH = 12;               // 虚线实线段长度（px）
const FLOW_GAP = 12;                // 虚线空隙长度（px）
const FLOW_SPEED_BASE = 40;         // speed=1 时的滚动速度（px/秒）

function initFlowLayer(map) {
    if (flowCanvas) return;
    const container = document.getElementById('map-container');
    if (!container) return;
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:10;';
    container.appendChild(canvas);
    flowCanvas = canvas;
    flowCtx = canvas.getContext('2d');
    resizeFlowLayer();
    requestAnimationFrame((t) => animateFlow(map, t));
}

function resizeFlowLayer() {
    if (!flowCanvas) return;
    const container = document.getElementById('map-container');
    if (!container) return;
    const dpr = window.devicePixelRatio || 1;
    const w = container.clientWidth, h = container.clientHeight;
    flowCanvas.width = Math.round(w * dpr);
    flowCanvas.height = Math.round(h * dpr);
    flowCanvas.style.width = w + 'px';
    flowCanvas.style.height = h + 'px';
    flowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function addFlowRoute(id, pts, color, width, speed, direction) {
    removeFlowRoute(id);
    flowRoutes.push({
        id,
        pts: pts.map(p => [p[0], p[1]]),
        color: colorToHex(color, '#3b82f6'),
        width: width || 3,
        speed: (speed ?? 0.9),
        dir: (direction === -1 ? -1 : 1),   // 1=正向（起点→终点），-1=反向
        offset: Math.random() * (FLOW_DASH + FLOW_GAP),
    });
}

function removeFlowRoute(id) {
    const i = flowRoutes.findIndex(r => r.id === id);
    if (i >= 0) flowRoutes.splice(i, 1);
}

function drawFlowLayer(map) {
    if (!flowCtx) return;
    const dpr = window.devicePixelRatio || 1;
    const w = flowCanvas.width / dpr, h = flowCanvas.height / dpr;
    flowCtx.clearRect(0, 0, w, h);
    for (const r of flowRoutes) {
        if (!r.pts || r.pts.length < 2) continue;
        const px = [];
        for (const p of r.pts) {
            const c = map.lngLatToContainer(new AMap.LngLat(p[0], p[1]));
            if (c) px.push([c.x, c.y]);
        }
        if (px.length < 2) continue;
        flowCtx.beginPath();
        flowCtx.moveTo(px[0][0], px[0][1]);
        for (let i = 1; i < px.length; i++) flowCtx.lineTo(px[i][0], px[i][1]);
        flowCtx.strokeStyle = r.color;
        flowCtx.lineWidth = r.width;
        flowCtx.lineCap = 'round';
        flowCtx.lineJoin = 'round';
        flowCtx.setLineDash([FLOW_DASH, FLOW_GAP]);
        flowCtx.lineDashOffset = -r.offset * (r.dir || 1);   // dir=1 正向滚，dir=-1 反向滚（每条路线可单独调方向）
        flowCtx.stroke();
    }
}

function animateFlow(map, now) {
    if (flowLastT) {
        const dt = Math.min((now - flowLastT) / 1000, 0.1);
        for (const r of flowRoutes) {
            r.offset += FLOW_SPEED_BASE * r.speed * dt;
            if (r.offset > 100000) r.offset = 0;
        }
    }
    flowLastT = now;
    drawFlowLayer(map);
    requestAnimationFrame((t) => animateFlow(map, t));
}

function loadScript(url) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Failed to load: ' + url));
        document.head.appendChild(s);
    });
}

async function initAmap() {
    const geo = CONFIG.geo;
    // 优先用服务端 .env 注入的高德 Key/安全密钥（高德官方建议：key 不进仓库）
    let amapKey = geo && geo.amapKey;
    let amapSecurityCode = geo && geo.amapSecurityCode;
    try {
        const r = await fetch('/api/amap');
        const d = await r.json();
        if (d && d.key) amapKey = d.key;
        if (d && d.securityJsCode) amapSecurityCode = d.securityJsCode;
    } catch (_) { /* 回退到 config.json 中的值 */ }

    if (!amapKey || amapKey === 'YOUR_AMAP_KEY_HERE') {
        // Show setup hint, fallback to classic
        document.getElementById('setup-hint').classList.add('show');
        document.getElementById('loading-screen').classList.add('hidden');
        console.warn('⚠️ 未配置高德地图 Key，使用经典 3D 模式');
        // Try loading classic version
        window.location.href = '/index-classic.html';
        return null;
    }

    // Set security code BEFORE loading Amap (required for keys created after 2021-12)
    if (amapSecurityCode) {
        window._AMapSecurityConfig = { securityJsCode: amapSecurityCode };
    }

    // Load Amap JS API
    const amapUrl = `https://webapi.amap.com/maps?v=2.0&key=${amapKey}`;
    await loadScript(amapUrl);

    // Also load AMap helper plugins if needed
    if (!window.AMap) {
        console.error('❌ 高德地图加载失败');
        return null;
    }

    const map = new AMap.Map('map-container', {
        viewMode: '3D',
        center: geo.center,
        zoom: geo.zoom || 17,
        pitch: geo.pitch || 55,
        rotation: geo.rotation || 20,
        mapStyle: geo.mapStyle || 'amap://styles/dark',
        features: ['bg', 'road', 'building', 'point'],
        showBuildingBlock: true,
        showLabel: true,
        buildingAnimation: true,
        // 允许 WebGL 内容
        webglParams: { preserveDrawingBuffer: false },
    });

    console.log('✅ 高德地图 3D 初始化完成');
    return map;
}

/** 颜色统一转为 #hex 字符串（config 中路线颜色已被 loadConfig 转为 int） */
function colorToHex(c, fallback = '#3b82f6') {
    if (c == null) return fallback;
    if (typeof c === 'string') return c.startsWith('#') ? c : '#' + c;
    if (typeof c === 'number') return '#' + c.toString(16).padStart(6, '0');
    return fallback;
}

/** 覆盖物点击：阻止冒泡并短暂屏蔽 map click 的 hideInfo，再执行展示逻辑 */
function onFeatureClick(e, fn) {
    if (e && e.originalEvent && e.originalEvent.stopPropagation) e.originalEvent.stopPropagation();
    suppressMapClickUntil = performance.now() + 300;
    fn();
}

// 路线和区域展示（纯展示，无编辑功能）
function displayRoutesAndAreas(map) {
    initFlowLayer(map);
    if (CONFIG.routes) {
        Object.entries(CONFIG.routes).forEach(([name, r]) => {
            if (!r.pts || r.pts.length < 2) return;
            // 路线点由「地图编辑器」存储为 [lng, lat]，直接用经纬度
            const path = r.pts.map(p => new AMap.LngLat(p[0], p[1]));
            // 透明折线仅作点击热区，虚线视觉由 flow 层绘制
            const line = new AMap.Polyline({ path, strokeColor: colorToHex(r.color), strokeWeight: 8, strokeOpacity: 0.01, zIndex: 10 });
            line.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '🛣️', title: name, badge: '路线', desc: r.desc || '' })));
            map.add(line);
            addFlowRoute('config:' + name, r.pts, r.color, 3, r.speed);
            const mid = r.pts[Math.floor(r.pts.length / 2)];
            addNameLabel(map, name, mid, 'center');
        });
    }
    if (CONFIG.areas) {
        Object.entries(CONFIG.areas).forEach(([name, a]) => {
            if (!a.pts || a.pts.length < 3) return;
            const path = a.pts.map(p => new AMap.LngLat(p[0], p[1]));
            const poly = new AMap.Polygon({ path, strokeColor: colorToHex(a.color, '#10b981'), strokeWeight: a.strokeWidth || 2, fillColor: colorToHex(a.color, '#10b981'), fillOpacity: a.opacity || 0.2, zIndex: 5 });
            poly.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '🗺️', title: name, badge: '区域', desc: a.desc || '' })));
            map.add(poly);
            let cx = 0, cy = 0;
            a.pts.forEach(p => { cx += p[0]; cy += p[1]; });
            cx /= a.pts.length; cy /= a.pts.length;
            addNameLabel(map, name, [cx, cy], 'center');
        });
    }
}

// ========================================================
// 导览方案：把「路线图编辑器」保存的方案叠加到 3D 地图
// 支持多方案同时叠加、勾选记忆（localStorage）
const PLAN_DEFAULT_W = 1200, PLAN_DEFAULT_H = 800;
const PLAN_HALF_LNG = 0.002, PLAN_HALF_LAT = 0.0014;
const PLAN_MEMORY_KEY = 'active_plans';
let planMap = null;                     // 当前地图实例
let planProjects = [];                  // 方案列表缓存 {id,name}
let planOverlayGroups = {};             // planId -> { overlays:[], route:0, area:0 }
let planFetching = {};                  // planId -> Promise（防重复 fetch）
let ui = null;                          // UI 控制器引用（供 applyPlan / displayRoutesAndAreas 显示名称）
let suppressMapClickUntil = 0;          // 覆盖物点击后短暂屏蔽 map click 的 hideInfo

function defaultPlanBounds(center) {
    const [clng, clat] = center || (CONFIG.geo ? CONFIG.geo.center : [104.14141, 30.67133]);
    return { nw: [clng - PLAN_HALF_LNG, clat + PLAN_HALF_LAT], se: [clng + PLAN_HALF_LNG, clat - PLAN_HALF_LAT] };
}

function planPointToLngLat(x, y, bounds, areaW, areaH) {
    const rot = bounds.rotation || 0;
    let px = x, py = y;
    if (rot) {
        // 底图旋转对位：像素绕图片中心顺时针旋转（与编辑器 CSS rotate 一致），再线性投影到经纬度
        const rad = rot * Math.PI / 180;
        const dx = x - areaW / 2, dy = y - areaH / 2;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        px = areaW / 2 + (dx * cos - dy * sin);
        py = areaH / 2 + (dx * sin + dy * cos);
    }
    const lng = bounds.nw[0] + (px / areaW) * (bounds.se[0] - bounds.nw[0]);
    const lat = bounds.nw[1] + (py / areaH) * (bounds.se[1] - bounds.nw[1]);
    return [lng, lat];
}

// 旋转后四角的轴对齐外接 bounds（供 ImageLayer 使用）
function rotatedBounds(bounds, areaW, areaH) {
    const rot = bounds.rotation || 0;
    if (!rot) return bounds;
    const corners = [[0, 0], [areaW, 0], [areaW, areaH], [0, areaH]];
    const lls = corners.map(c => planPointToLngLat(c[0], c[1], bounds, areaW, areaH));
    const lngs = lls.map(p => p[0]), lats = lls.map(p => p[1]);
    return { nw: [Math.min(...lngs), Math.max(...lats)], se: [Math.max(...lngs), Math.min(...lats)] };
}

// 把底图旋转 rotation 度烘焙成新图（轴对齐外接矩形，四角透明）
function bakeRotatedImage(dataUrl, w, h, rotation) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            const rad = rotation * Math.PI / 180;
            const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
            const bw = Math.max(1, Math.ceil(w * cos + h * sin));
            const bh = Math.max(1, Math.ceil(w * sin + h * cos));
            const canvas = document.createElement('canvas');
            canvas.width = bw; canvas.height = bh;
            const ctx = canvas.getContext('2d');
            ctx.translate(bw / 2, bh / 2);
            ctx.rotate(rad);
            ctx.drawImage(img, -w / 2, -h / 2, w, h);
            resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => reject(new Error('底图加载失败'));
        img.src = dataUrl;
    });
}

// 方框旋转：bounds（西南/东北角）绕中心顺时针旋转，返回 4 顶点
function rectCorners(bounds, rotation) {
    const sw = bounds[0], ne = bounds[1];
    const cx = (sw[0] + ne[0]) / 2, cy = (sw[1] + ne[1]) / 2;
    const hl = (ne[0] - sw[0]) / 2, hla = (ne[1] - sw[1]) / 2;
    const corners = [[cx - hl, cy - hla], [cx + hl, cy - hla], [cx + hl, cy + hla], [cx - hl, cy + hla]];
    if (!rotation) return corners;
    const rad = rotation * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
    const mLng = 111320 * Math.cos(cy * Math.PI / 180);
    return corners.map(([lng, lat]) => {
        const dx = (lng - cx) * mLng, dy = (lat - cy) * 111320;
        const dx2 = dx * cos + dy * sin, dy2 = -dx * sin + dy * cos;
        return [cx + dx2 / mLng, cy + dy2 / 111320];
    });
}

// 统一销毁图层/覆盖物：Layer 用 setMap(null)，Overlay 用 map.remove
function disposeOverlay(o, map) {
    try {
        if (o && typeof o.setMap === 'function') o.setMap(null);
        else if (o) map.remove(o);
    } catch (_) {}
}

/** 地图上放置名称标签（AMap.Text）：白字 + 半透明深底，可读 */
function addNameLabel(map, text, lngLat, anchor, offsetPx) {
    if (!text) return null;
    const t = new AMap.Text({
        text,
        position: new AMap.LngLat(lngLat[0], lngLat[1]),
        anchor: anchor || 'center',
        offset: offsetPx ? new AMap.Pixel(offsetPx[0], offsetPx[1]) : new AMap.Pixel(0, 0),
        style: {
            'background-color': 'rgba(0,0,0,0.62)',
            'color': '#ffffff',
            'font-size': '12px',
            'font-weight': '600',
            'padding': '3px 8px',
            'border-radius': '4px',
            'border': '1px solid rgba(255,255,255,0.22)',
        },
        zIndex: 20,
    });
    map.add(t);
    return t;
}

function removePlanOverlay(map, planId) {
    const g = planOverlayGroups[planId];
    if (!g) return;
    g.overlays.forEach(o => disposeOverlay(o, map));
    // 移除该方案的流动虚线
    (g.flowIds || []).forEach(id => removeFlowRoute(id));
    delete planOverlayGroups[planId];
}

function applyPlan(map, plan) {
    removePlanOverlay(map, plan.id);
    const overlays = [];
    const group = { overlays, route: 0, area: 0, rect: 0, circle: 0, ellipse: 0, text: 0, flowIds: [] };
    planOverlayGroups[plan.id] = group;

    const data = plan.data || {};

    // 「地图绘制」方案：routes/areas 直接存经纬度 [lng, lat]，无需底图对齐
    if (data.kind === 'map') {
        let added = 0;
        if (data.routes) {
            Object.entries(data.routes).forEach(([name, r]) => {
                if (!r.pts || r.pts.length < 2) return;
                const path = r.pts.map(p => new AMap.LngLat(p[0], p[1]));
                const o = new AMap.Polyline({ path, strokeColor: colorToHex(r.color), strokeWeight: 8, strokeOpacity: 0.01, zIndex: 10 });
                o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '🛣️', title: name, badge: '路线', desc: r.desc || '' })));
                map.add(o); overlays.push(o); group.route++; added++;
                // 流动虚线（Canvas 层绘制，严格贴线）
                const flowId = 'plan:' + plan.id + ':' + name;
                addFlowRoute(flowId, r.pts, r.color, r.strokeWidth || 3, r.speed, r.direction);
                group.flowIds.push(flowId);
                // 路线名称标签（中点）
                const mid = r.pts[Math.floor(r.pts.length / 2)];
                overlays.push(addNameLabel(map, name, mid, 'center'));
            });
        }
        if (data.areas) {
            Object.entries(data.areas).forEach(([name, a]) => {
                if (!a.pts || a.pts.length < 3) return;
                const path = a.pts.map(p => new AMap.LngLat(p[0], p[1]));
                const o = new AMap.Polygon({ path, strokeColor: colorToHex(a.color, '#10b981'), strokeWeight: a.strokeWidth || 2, fillColor: colorToHex(a.color, '#10b981'), fillOpacity: a.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '🗺️', title: name, badge: '区域', desc: a.desc || '' })));
                map.add(o); overlays.push(o); group.area++; added++;
                // 区域名称标签（质心）
                let cx = 0, cy = 0;
                a.pts.forEach(p => { cx += p[0]; cy += p[1]; });
                cx /= a.pts.length; cy /= a.pts.length;
                overlays.push(addNameLabel(map, name, [cx, cy], 'center'));
            });
        }
        if (data.markers) {
            Object.entries(data.markers).forEach(([name, m]) => {
                if (m.lng == null || m.lat == null) return;
                const color = colorToHex(m.color, '#f59e0b');
                const mk = new AMap.Marker({
                    position: new AMap.LngLat(m.lng, m.lat),
                    content: '<div style="width:12px;height:12px;background:' + color + ';border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,0.6)"></div>',
                    offset: new AMap.Pixel(-8, -8),
                    zIndex: 15,
                });
                mk.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '📍', title: name, badge: '标记点', desc: m.desc || '' })));
                map.add(mk); overlays.push(mk); added++;
                // 标记点名称标签（圆点下方）
                overlays.push(addNameLabel(map, name, [m.lng, m.lat], 'top-center', [0, 10]));
            });
        }
        if (data.rects) {
            Object.entries(data.rects).forEach(([name, r]) => {
                if (!r.bounds || !r.bounds[0] || !r.bounds[1]) return;
                const rot = r.rotation || 0;
                const o = rot
                    ? new AMap.Polygon({ path: rectCorners(r.bounds, rot), strokeColor: colorToHex(r.color, '#8b5cf6'), strokeWeight: r.strokeWidth || 2, fillColor: colorToHex(r.color, '#8b5cf6'), fillOpacity: r.opacity ?? 0.2, zIndex: 5 })
                    : new AMap.Rectangle({ bounds: new AMap.Bounds(r.bounds[0], r.bounds[1]), strokeColor: colorToHex(r.color, '#8b5cf6'), strokeWeight: r.strokeWidth || 2, fillColor: colorToHex(r.color, '#8b5cf6'), fillOpacity: r.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '▭', title: name, badge: '画框', desc: r.desc || '' })));
                map.add(o); overlays.push(o); group.rect++; added++;
                const c = [(r.bounds[0][0] + r.bounds[1][0]) / 2, (r.bounds[0][1] + r.bounds[1][1]) / 2];
                overlays.push(addNameLabel(map, name, c, 'center'));
            });
        }
        if (data.circles) {
            Object.entries(data.circles).forEach(([name, c]) => {
                if (!c.center || c.radius == null) return;
                const o = new AMap.Circle({ center: c.center, radius: c.radius, strokeColor: colorToHex(c.color, '#ec4899'), strokeWeight: c.strokeWidth || 2, fillColor: colorToHex(c.color, '#ec4899'), fillOpacity: c.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '◯', title: name, badge: '画圆', desc: c.desc || '' })));
                map.add(o); overlays.push(o); group.circle++; added++;
                overlays.push(addNameLabel(map, name, c.center, 'center'));
            });
        }
        if (data.ellipses) {
            Object.entries(data.ellipses).forEach(([name, e]) => {
                if (!e.center || e.radius == null) return;
                const r = Array.isArray(e.radius) ? e.radius : [e.radius, e.radius];
                const o = new AMap.Ellipse({ center: e.center, radius: r, strokeColor: colorToHex(e.color, '#06b6d4'), strokeWeight: e.strokeWidth || 2, fillColor: colorToHex(e.color, '#06b6d4'), fillOpacity: e.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (ev) => onFeatureClick(ev, () => ui && ui.showFeature({ icon: '⬭', title: name, badge: '椭圆', desc: e.desc || '' })));
                map.add(o); overlays.push(o); group.ellipse++; added++;
                overlays.push(addNameLabel(map, name, e.center, 'center'));
            });
        }
        if (data.texts) {
            Object.entries(data.texts).forEach(([name, t]) => {
                if (t.lng == null || t.lat == null) return;
                const o = new AMap.Text({ text: name, position: new AMap.LngLat(t.lng, t.lat), anchor: 'center', style: { 'color': t.color || '#ffffff', 'font-size': '14px', 'font-weight': '600', 'background-color': 'rgba(0,0,0,0.55)', 'padding': '3px 8px', 'border-radius': '4px', 'border': '1px solid rgba(255,255,255,0.25)' }, zIndex: 20 });
                map.add(o); overlays.push(o); group.text++; added++;
            });
        }
        return overlays.length;
    }

    const els = Array.isArray(data.elements) ? data.elements : [];
    const bounds = data.geoBounds || defaultPlanBounds();
    const areaW = data.imageWidth || PLAN_DEFAULT_W;
    const areaH = data.imageHeight || PLAN_DEFAULT_H;

    // 底图：场地平面图，按 geoBounds 对齐到地图（支持旋转烘焙）
    if (data.backgroundImage) {
        const rot = bounds.rotation || 0;
        const bbox = rotatedBounds(bounds, areaW, areaH);
        const makeLayer = (url) => {
            try {
                const imgLayer = new AMap.ImageLayer({
                    url,
                    bounds: new AMap.Bounds(
                        new AMap.LngLat(bbox.nw[0], bbox.nw[1]),
                        new AMap.LngLat(bbox.se[0], bbox.se[1])
                    ),
                    opacity: data.bgOpacity ?? 1,
                    zooms: [3, 20],
                    zIndex: 1,
                });
                imgLayer.setMap(map);
                overlays.push(imgLayer);
            } catch (err) {
                console.warn('⚠️ 底图叠加失败:', err.message);
            }
        };
        if (rot) {
            bakeRotatedImage(data.backgroundImage, areaW, areaH, rot).then(url => {
                if (planOverlayGroups[plan.id] !== group) return; // 方案已移除，丢弃
                makeLayer(url);
            }).catch(err => console.warn('⚠️ 底图旋转失败:', err.message));
        } else {
            makeLayer(data.backgroundImage);
        }
    }

    els.forEach(el => {
        if (el.visible === false) return;
        const pts = (el.points || []).map(p => planPointToLngLat(p.x, p.y, bounds, areaW, areaH));
        const path = pts.map(p => new AMap.LngLat(p[0], p[1]));
        let o = null;
        if (el.type === 'route' && pts.length >= 2) {
            o = new AMap.Polyline({ path, strokeColor: colorToHex(el.color, '#3b82f6'), strokeWeight: el.strokeWidth || 3, strokeOpacity: el.opacity ?? 0.9, zIndex: 10 });
            group.route++;
        } else if (el.type === 'area' && pts.length >= 3) {
            o = new AMap.Polygon({ path, strokeColor: colorToHex(el.color, '#10b981'), strokeWeight: el.strokeWidth || 2, fillColor: colorToHex(el.color, '#10b981'), fillOpacity: (el.opacity ?? 1) * 0.25, zIndex: 5 });
            group.area++;
        } else if (el.type === 'text' && pts.length >= 1) {
            o = new AMap.Text({
                text: el.label || '', position: new AMap.LngLat(pts[0][0], pts[0][1]),
                style: {
                    'background-color': el.backgroundColor || 'rgba(0,0,0,0.7)',
                    'color': el.color || '#ffffff', 'font-size': (el.fontSize || 16) + 'px',
                    'padding': '4px 8px', 'border-radius': '14px',
                },
            });
        }
        if (o) { map.add(o); overlays.push(o); }
    });
    return overlays.length;
}

function getActivePlanIds() {
    try { return JSON.parse(localStorage.getItem(PLAN_MEMORY_KEY) || '[]'); }
    catch (_) { return []; }
}
function saveActivePlanIds(ids) {
    try { localStorage.setItem(PLAN_MEMORY_KEY, JSON.stringify(ids)); } catch (_) {}
}

function renderPlanList() {
    const box = document.getElementById('plan-list');
    if (!box) return;
    box.innerHTML = '';
    if (planProjects.length === 0) {
        box.innerHTML = '<div style="font-size:0.72rem;color:rgba(255,255,255,0.35);padding:4px 0;">暂无方案</div>';
        return;
    }
    const active = new Set(getActivePlanIds().map(String));
    planProjects.forEach(p => {
        const item = document.createElement('label');
        item.className = 'plan-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = active.has(String(p.id));
        cb.addEventListener('change', () => togglePlan(p.id, cb.checked));
        const name = document.createElement('span');
        name.className = 'plan-name';
        name.textContent = p.name || ('方案 ' + p.id);
        name.title = p.name || '';
        item.appendChild(cb);
        item.appendChild(name);
        box.appendChild(item);
    });
}

function togglePlan(planId, on) {
    const active = getActivePlanIds().filter(id => String(id) !== String(planId));
    if (on) {
        active.push(String(planId));
        saveActivePlanIds(active);
        if (!planMap) return;
        fetchPlanData(planId).then(plan => {
            if (!plan) { console.warn('⚠️ 方案加载失败'); return; }
            const n = applyPlan(planMap, plan);
            console.log(`✅ 已叠加方案「${plan.name}」，${n} 个对象`);
        });
    } else {
        saveActivePlanIds(active);
        if (planMap) removePlanOverlay(planMap, planId);
    }
}

async function fetchPlanData(id) {
    if (planFetching[id]) return planFetching[id];
    planFetching[id] = (async () => {
        try {
            const res = await fetch('/api/editor/projects/' + id);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            return json.data;
        } catch (err) {
            console.error('❌ 加载方案失败:', err.message);
            return null;
        } finally {
            delete planFetching[id];
        }
    })();
    return planFetching[id];
}

async function initPlanSelector(map) {
    planMap = map;
    try {
        const res = await fetch('/api/editor/projects');
        const json = await res.json();
        planProjects = json.data || [];
    } catch (err) {
        console.warn('⚠️ 加载方案列表失败:', err.message);
    }
    renderPlanList();

    const btnClear = document.getElementById('btn-clear-plan');
    if (btnClear) btnClear.addEventListener('click', () => {
        getActivePlanIds().forEach(id => removePlanOverlay(map, Number(id)));
        saveActivePlanIds([]);
        renderPlanList();
    });

    // 恢复上次勾选的方案（跨页面刷新记忆）
    getActivePlanIds().forEach(id => {
        fetchPlanData(id).then(plan => {
            if (!plan) return;
            applyPlan(map, plan);
            console.log(`✅ 已恢复方案「${plan.name}」`);
        });
    });

    // 无勾选方案时，自动激活最新保存的方案（保存后首页立即可见）
    if (getActivePlanIds().length === 0 && planProjects.length > 0) {
        const first = planProjects[0];
        saveActivePlanIds([String(first.id)]);
        renderPlanList();
        fetchPlanData(first.id).then(plan => {
            if (!plan) return;
            applyPlan(map, plan);
            console.log(`✅ 已自动激活最新方案「${plan.name}」`);
        });
    }
}


async function boot() {
    ui = new UIController();
    ui.setProgress('加载配置...', 5);

    // Load config
    await loadConfig();

    // Init Amap
    ui.setProgress('初始化地图...', 20);
    const map = await initAmap();
    if (!map) return; // Fallback handled in initAmap

    // Setup Three.js — wait for GLCustomLayer init, then create objects
    ui.setProgress('初始化 3D 引擎...', 40);
    const { scene, camera, renderer, labelRenderer, waitForInit } = setupThreeScene(map);

    // waitForInit returns a promise that resolves after GLCustomLayer.init runs
    ui.setProgress('等待图层就绪...', 50);
    const { localToAmap } = await waitForInit();

    ui.setProgress('构建场馆模型...', 60);
    buildVenue(scene, localToAmap);

    ui.setProgress('放置入口标记...', 70);
    const markerData = createMarkers(scene, localToAmap);

    ui.setProgress('生成流动路线...', 80);

    // Init drawing manager
    displayRoutesAndAreas(map);

    // 加载「导览方案」下拉并支持叠加渲染
    initPlanSelector(map);

    // 搜索：优先匹配本地场馆标记，其次高德 POI
    AMap.plugin('AMap.AutoComplete', () => {
        const auto = new AMap.AutoComplete({ city: '成都', citylimit: true });
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        searchInput.addEventListener('input', () => {
            const val = searchInput.value.trim();
            if (!val) { searchResults.style.display = 'none'; return; }
            searchResults.innerHTML = '';
            const q = val.toLowerCase();
            // 1) 本地场馆标记
            for (const [key, m] of Object.entries(CONFIG.markers || {})) {
                if ((m.label || key).toLowerCase().includes(q)) {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.dataset.venueKey = key;
                    div.textContent = (m.icon || '📍') + ' ' + (m.label || key);
                    searchResults.appendChild(div);
                }
            }
            searchResults.style.display = searchResults.children.length ? 'block' : 'none';
            // 3) 高德 POI
            auto.search(val, (status, result) => {
                if (status === 'complete' && result.tips) {
                    result.tips.slice(0, 6).forEach(t => {
                        const div = document.createElement('div');
                        div.className = 'search-item';
                        div.dataset.lng = t.location?.lng || '';
                        div.dataset.lat = t.location?.lat || '';
                        div.textContent = '📍 ' + (t.name || '');
                        searchResults.appendChild(div);
                    });
                    searchResults.style.display = searchResults.children.length ? 'block' : 'none';
                }
            });
        });
        searchResults.addEventListener('click', (e) => {
            const item = e.target.closest('.search-item');
            if (!item) return;
            if (item.dataset.venueKey) {
                const vk = item.dataset.venueKey;
                searchResults.style.display = 'none';
                searchInput.value = item.textContent.replace(/^[^\s]+\s/, '');
                {
                    const md = markerData.find(m => m.key === vk);
                    if (md) { map.setZoomAndCenter(18, md.lngLat); ui.showInfo(vk); }
                }
                return;
            }
            const lng = parseFloat(item.dataset.lng), lat = parseFloat(item.dataset.lat);
            if (lng && lat) {
                map.setZoomAndCenter(18, [lng, lat]);
                searchResults.style.display = 'none';
                searchInput.value = item.textContent.replace('📍 ', '');
            }
        });
        document.addEventListener('click', (e) => { if (!e.target.closest('.sb-search')) searchResults.style.display = 'none'; });
    });

    // ====== Indoor Positioning & Navigation ======
    let myLocation = null;       // {lng, lat}
    let locationMarker = null;   // blue dot on map
    let navLine = null;          // route line

    document.getElementById('btn-my-location').addEventListener('click', function() {
        this.textContent = '👆 请点击地图设置位置';
        this.style.background = '#f59e0b';
        this.style.borderColor = '#f59e0b';
        this.style.color = '#fff';
    });

    document.getElementById('btn-clear-location').addEventListener('click', () => {
        myLocation = null;
        if (locationMarker) { map.remove(locationMarker); locationMarker = null; }
        if (navLine) { map.remove(navLine); navLine = null; }
        document.getElementById('location-info').style.display = 'none';
        document.getElementById('nav-info').style.display = 'none';
        const btn = document.getElementById('btn-my-location');
        btn.textContent = '📍 设置我的位置';
        btn.style.background = ''; btn.style.borderColor = ''; btn.style.color = '';
    });

    // Map click handler for location setting
    map.on('click', (e) => {
        const btn = document.getElementById('btn-my-location');
        if (btn.textContent.includes('请点击')) {
            // User is setting their location
            myLocation = { lng: e.lnglat.lng, lat: e.lnglat.lat };
            if (locationMarker) map.remove(locationMarker);
            locationMarker = new AMap.Marker({
                position: [myLocation.lng, myLocation.lat],
                icon: new AMap.Icon({
                    size: new AMap.Size(24, 24),
                    image: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png',
                    imageSize: new AMap.Size(24, 24),
                }),
                zIndex: 100,
                title: '我的位置'
            });
            map.add(locationMarker);
            document.getElementById('location-info').style.display = 'block';
            document.getElementById('loc-coords').textContent = '已定位: ' + myLocation.lng.toFixed(5) + ', ' + myLocation.lat.toFixed(5);
            btn.textContent = '📍 我的位置';
            btn.style.background = ''; btn.style.borderColor = ''; btn.style.color = '';
        }
    });

    // 导航到指定标记：绘制步行路线并计算距离/时间
    function navigateTo(key) {
        const info = document.getElementById('nav-info');
        if (!myLocation) {
            info.style.display = 'block';
            info.textContent = '⚠️ 请先点击「设置我的位置」';
            return;
        }
        const md = markerData.find(m => m.key === key);
        if (!md || !md.lngLat) return;

        // Draw walking route
        if (navLine) map.remove(navLine);
        navLine = new AMap.Polyline({
            path: [[myLocation.lng, myLocation.lat], [md.lngLat[0], md.lngLat[1]]],
            strokeColor: '#f59e0b', strokeWeight: 3, strokeOpacity: 0.8,
            strokeStyle: 'dashed', lineJoin: 'round', zIndex: 50,
            showDir: true,
        });
        map.add(navLine);

        // Calculate distance
        const dist = AMap.GeometryUtil.distance(
            [myLocation.lng, myLocation.lat],
            [md.lngLat[0], md.lngLat[1]]
        );
        const walkTime = Math.ceil(dist / 80); // 80m/min walking speed
        info.style.display = 'block';
        info.textContent = '📍 ' + dist.toFixed(0) + 'm · 步行约 ' + (walkTime < 1 ? '<1' : walkTime) + ' 分钟';
    }
    ui._onNavigate = navigateTo;

    // 打开信息卡时若已定位，自动绘制路线
    const origShowInfo = ui.showInfo;
    ui.showInfo = function(key) {
        origShowInfo.call(this, key);
        if (myLocation) navigateTo(key);
    };
    map.on('click', (e) => {
        // 刚点击了路线/区域覆盖物时，不触发这里的 hideInfo（避免信息卡闪退）
        if (performance.now() < suppressMapClickUntil) return;
        const clicked = e.lnglat;
        for (const md of markerData) {
            const dist = AMap.GeometryUtil.distance(
                [clicked.lng, clicked.lat],
                [md.lngLat[0], md.lngLat[1]]
            );
            if (dist < 25) {
                ui.showInfo(md.key);
                return;
            }
        }
        ui.hideInfo();
    });

    // Smooth camera animation helper
    function flyTo(targetLngLat, targetZoom, targetPitch, targetRotation, duration = 1200) {
        const startZoom = map.getZoom();
        const startPitch = map.getPitch();
        const startRotation = map.getRotation();
        const startCenter = map.getCenter();
        const startTime = performance.now();

        return new Promise(resolve => {
            function step(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                // easeInOutCubic
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

                map.setZoom(startZoom + (targetZoom - startZoom) * ease);
                map.setPitch(startPitch + (targetPitch - startPitch) * ease);
                map.setRotation(startRotation + (targetRotation - startRotation) * ease);

                const lng = startCenter.lng + (targetLngLat[0] - startCenter.lng) * ease;
                const lat = startCenter.lat + (targetLngLat[1] - startCenter.lat) * ease;
                map.setCenter([lng, lat]);

                if (t < 1) {
                    requestAnimationFrame(step);
                } else {
                    resolve();
                }
            }
            requestAnimationFrame(step);
        });
    }

    // Map style switching (bottom-right controls)
    const layerStyles = { dark: 'amap://styles/dark', normal: 'amap://styles/light', satellite: 'amap://styles/light' };
    let satelliteLayer = null;
    document.querySelectorAll('#bottom-controls button[data-layer]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#bottom-controls button[data-layer]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const layer = btn.dataset.layer;
            if (layer === 'satellite') {
                if (!satelliteLayer) satelliteLayer = new AMap.TileLayer.Satellite();
                map.setLayers([new AMap.TileLayer(), satelliteLayer]);
            } else {
                map.setLayers([new AMap.TileLayer()]);
            }
            map.setMapStyle(layerStyles[layer] || 'amap://styles/dark');
        });
    });

    // 2D/3D toggle (bottom-right controls)
    let savedPitch = CONFIG.geo.pitch || 55;
    let savedRotation = CONFIG.geo.rotation || 20;
    document.querySelectorAll('#bottom-controls button[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#bottom-controls button[data-mode]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.mode === '2d') {
                savedPitch = map.getPitch() || savedPitch;
                savedRotation = map.getRotation() || 0;
                map.setPitch(0);
                map.setRotation(0);
            } else {
                map.setPitch(savedPitch);
                map.setRotation(savedRotation);
            }
        });
    });

    // 视角预设：飞至后台配置的相机视角
    function applyPreset(name) {
        const p = CONFIG.camera.presets && CONFIG.camera.presets[name];
        if (!p) return;
        const target = localToLngLat(p.target[0], p.target[2], CONFIG.geo.center);
        const dx = p.pos[0] - p.target[0];
        const dy = p.pos[1] - p.target[1];
        const dz = p.pos[2] - p.target[2];
        const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy + dz * dz));
        const pitch = Math.round(Math.atan2(dy, Math.hypot(dx, dz)) * 180 / Math.PI);
        const zoom = Math.max(14, Math.min(20, 19 - Math.log2(dist)));
        map.setZoomAndCenter(zoom, target);
        map.setPitch(Math.max(0, Math.min(80, pitch)));
        map.setRotation(CONFIG.geo.rotation || 20);
        document.querySelectorAll('#camera-presets button').forEach(b => b.classList.toggle('active', b.dataset.preset === name));
    }
    function renderCameraPresets() {
        const container = document.getElementById('camera-presets');
        if (!container) return;
        const presets = Object.entries(CONFIG.camera.presets || {});
        container.innerHTML = '';
        if (!presets.length) { container.style.display = 'none'; return; }
        container.style.display = 'flex';
        for (const [name] of presets) {
            const btn = document.createElement('button');
            btn.textContent = name;
            btn.dataset.preset = name;
            btn.addEventListener('click', () => applyPreset(name));
            container.appendChild(btn);
        }
    }
    renderCameraPresets();

    // Auto-rotate (orbit the Amap camera)
    let autoRotate = false;
    let rotationAngle = CONFIG.geo.rotation || 20;
    document.getElementById('btn-auto-rotate').addEventListener('click', () => {
        autoRotate = !autoRotate;
        const btn = document.getElementById('btn-auto-rotate');
        if (autoRotate) { btn.textContent = '⏸'; btn.style.color = 'var(--accent-main)'; }
        else { btn.textContent = '⟳'; btn.style.color = ''; }
    });

    // Animation loop — update objects, trigger GLCustomLayer render
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);
        const elapsed = clock.elapsedTime;

        // Auto-rotate
        if (autoRotate) {
            rotationAngle += dt * 8;
            map.setRotation(rotationAngle % 360);
        }


        // Pulse marker rings & cones
        scene.children.forEach(child => {
            if (child.isMesh && child.geometry.type === 'RingGeometry' && child.userData.phase !== undefined) {
                const s = 1 + 0.25 * Math.sin(elapsed * 2.2 + child.userData.phase);
                child.scale.set(s, s, 1);
                child.material.opacity = 0.25 + 0.2 * Math.sin(elapsed * 2.2 + child.userData.phase);
            }
            if (child.isMesh && child.geometry.type === 'ConeGeometry' && child.userData.baseEmissive !== undefined) {
                const base = child.userData.baseEmissive;
                child.material.emissiveIntensity = base + 0.3 * Math.sin(elapsed * 2.5 + (child.userData.phase || 0));
            }
        });

        // Trigger Amap re-render → GLCustomLayer.render() → Three.js renders
        map.render();
    }

    // Simulate loading finish
    ui.setProgress('就绪', 100);
    await new Promise(r => setTimeout(r, 500));
    ui.hideLoading();

    // Start animation loop
    animate();

    // Resize
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        resizeFlowLayer();
    });

    console.log('✅ ' + (CONFIG.brand?.name||'3D 智慧导览') + ' 已就绪');
    console.log('   🗺️  高德地图底图 + Three.js 3D 叠加层');
    console.log('   📍 点击入口标记查看详情');
    console.log('   🎯 右侧按钮切换视角');
    console.log('   🅿️  右下角查看停车位实时数据');
    console.log('   🌓 右下角切换地图样式');
}

// Launch
boot().catch(err => {
    console.error('启动失败:', err);
    document.getElementById('loading-screen').innerHTML =
        '<div style="color:#f85149;font-size:1.2rem;">⚠️ 加载失败: ' + err.message + '<br><small>请刷新页面重试</small></div>';
});
</script>
</body>
</html>
