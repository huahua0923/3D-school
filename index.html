// 路线和区域展示（纯展示，无编辑功能）
function displayRoutesAndAreas(map) {
    initFlowLayer(map);
    if (CONFIG.routes) {
        Object.entries(CONFIG.routes).forEach(([name, r]) => {
            if (!r.pts || r.pts.length < 2) return;
            // 路线点由「地图编辑器」存储为 [lng, lat]，直接用经纬度
            const path = r.pts.map(p => new AMap.LngLat(p[0], p[1]));
            // 透明折线仅作点击热区，虚线视觉由 flow 层绘制
            const line = new AMap.Polyline({ path, strokeColor: colorToHex(r.color), strokeWeight: 8, strokeOpacity: 0.01, zIndex: 10 });
            line.on('click', (e) => onFeatureClick(e, () => { const mp = r.pts[Math.floor(r.pts.length / 2)]; ui && ui.showFeature({ icon: '🛣️', title: name, badge: '路线', desc: r.desc || '', images: r.images || [], lng: mp[0], lat: mp[1] }); startGuide(r.pts, r.color, name); }));
            map.add(line);
            addFlowRoute('config:' + name, r.pts, r.color, 3, r.speed);
            const mid = r.pts[Math.floor(r.pts.length / 2)];
            routeOverlays.push(line, addNameLabel(map, name, mid, 'center'));
        });
    }
    if (CONFIG.areas) {
        Object.entries(CONFIG.areas).forEach(([name, a]) => {
            if (!a.pts || a.pts.length < 3) return;
            const path = a.pts.map(p => new AMap.LngLat(p[0], p[1]));
            const poly = new AMap.Polygon({ path, strokeColor: colorToHex(a.color, '#10b981'), strokeWeight: a.strokeWidth || 2, fillColor: colorToHex(a.color, '#10b981'), fillOpacity: a.opacity || 0.2, zIndex: 5 });
            poly.on('click', (e) => onFeatureClick(e, () => { let ax = 0, ay = 0; a.pts.forEach(p => { ax += p[0]; ay += p[1]; }); ui && ui.showFeature({ icon: '🗺️', title: name, badge: '区域', desc: a.desc || '', images: a.images || [], lng: ax / a.pts.length, lat: ay / a.pts.length }); }));
            map.add(poly);
            let cx = 0, cy = 0;
            a.pts.forEach(p => { cx += p[0]; cy += p[1]; });
            cx /= a.pts.length; cy /= a.pts.length;
            addNameLabel(map, name, [cx, cy], 'center');
        });
    }
}

// ========================================================
// Loca v2 可视化特效：呼吸点(Scatter) + 脉冲线(PulseLine)
// 叠加在现有 2D 覆盖物之上，由开关控制；Loca 与 GLCustomLayer 共用 WebGL 上下文
// ========================================================
function buildLocaFeatures() {
    const features = [];
    // 数据源 = 首页勾选的「地图方案」（admin-map.html 绘制）。config.json 的旧 markers/routes/areas 已废弃。
    Object.entries(activePlanData).forEach(([, data]) => {
        if (!data || data.kind !== 'map') return;
        // 标记点 → Point（地图方案直接存经纬度 lng/lat）
        Object.entries(data.markers || {}).forEach(([name, m]) => {
            if (m.lng == null || m.lat == null) return;
            features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [m.lng, m.lat] },
                properties: { name, icon: m.icon || '📍', color: colorToHex(m.color, '#f59e0b') } });
        });
        // 路线 → LineString（贴地，无海拔分层）
        Object.entries(data.routes || {}).forEach(([name, r]) => {
            if (!r.pts || r.pts.length < 2) return;
            features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: r.pts },
                properties: { name, color: colorToHex(r.color, '#3b82f6') } });
        });
        // 区域 → Polygon（GeoJSON 外环需闭合，编辑器存的 pts 可能未闭合，这里补齐）
        Object.entries(data.areas || {}).forEach(([name, a]) => {
            if (!a.pts || a.pts.length < 3) return;
            const ring = a.pts.map(p => [p[0], p[1]]);
            const f0 = ring[0], fl = ring[ring.length - 1];
            if (f0[0] !== fl[0] || f0[1] !== fl[1]) ring.push([f0[0], f0[1]]);
            features.push({ type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] },
                properties: { name, color: colorToHex(a.color, '#10b981') } });
        });
    });
    return features;
}

// 从 Loca 回调参数里安全取颜色（不同图层回调签名可能是 (feature) 或 (index, feature)）
function locaColorOf(...args) {
    let fallback = '#3b82f6';
    for (const a of args) {
        if (a && a.properties && a.properties.color) return a.properties.color;
        if (a && a.color) return a.color;
        if (typeof a === 'string' && a.charAt(0) === '#') fallback = a;
    }
    return fallback;
}

// hex → rgba() 字符串（canvas 渐变用）
function hexToRgba(hex, alpha) {
    const h = String(hex || '#f59e0b').replace('#', '');
    const full = h.length === 3 ? h.split('').map(c => c + c).join('') : (h.length === 6 ? h : 'f59e0b');
    const r = parseInt(full.slice(0, 2), 16), g = parseInt(full.slice(2, 4), 16), b = parseInt(full.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// hex 颜色明暗调整（amount 负=变暗，正=变亮），用于 3D 体块侧面
function shadeHex(hex, amount) {
    const h = String(hex || '#10b981').replace('#', '');
    const full = h.length === 3 ? h.split('').map(c => c + c).join('') : (h.length === 6 ? h : '10b981');
    const n = parseInt(full, 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amount < 0) { r = Math.round(r * (1 + amount)); g = Math.round(g * (1 + amount)); b = Math.round(b * (1 + amount)); }
    else { r = Math.round(r + (255 - r) * amount); g = Math.round(g + (255 - g) * amount); b = Math.round(b + (255 - b) * amount); }
    return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
}

function initLoca(map) {
    if (!window.Loca) { toast('⚠️ Loca SDK 未加载'); return; }
    if (locaContainer) return;
    try {
        const loca = new Loca.Container({ map });
        // 光照：参照 cadmall 剖面图案例（环境光 + 平行光 + 点光），让 3D 面图层有明暗立体感
        loca.ambLight = { intensity: 0.2, color: '#fff' };
        loca.dirLight = { intensity: 0.2, color: '#fff', target: [0, 0, 0], position: [0, -1, 1] };
        let plLng = 116.3894, plLat = 39.9976;
        try { const _mc = map.getCenter(); plLng = _mc.getLng(); plLat = _mc.getLat(); } catch (_) {}
        loca.pointLight = { color: '#c2beff', position: [plLng, plLat, 120], intensity: 2.5, distance: 300 };
        const all = buildLocaFeatures();
        const pts = all.filter(f => f.geometry.type === 'Point');
        const lines = all.filter(f => f.geometry.type === 'LineString');
        const polys = all.filter(f => f.geometry.type === 'Polygon');

        // 呼吸点 → 水波纹扩散：用独立 Canvas 覆盖层画扩散圆环（rAF 平滑，不闪）
        if (pts.length && locaEffects.breathing) {
            ripplePoints = pts.map(f => ({
                lng: f.geometry.coordinates[0],
                lat: f.geometry.coordinates[1],
                color: (f.properties && f.properties.color) || '#f59e0b',
            }));
            initRippleLayer(map);
            rippleOn = true;
        }

        // 区域 → 3D 体块挤出（参照 cadmall：topColor 顶面 + sideColor 侧面 + 光照立体感）
        if (polys.length && locaEffects.areas) {
            const src = new Loca.GeoJSONSource({ data: { type: 'FeatureCollection', features: polys } });
            const areaLayer = new Loca.PolygonLayer({ zIndex: 105, opacity: 0.9, shininess: 8 });
            areaLayer.setSource(src);
            areaLayer.setStyle({
                topColor: (...a) => locaColorOf(...a),
                sideColor: (...a) => shadeHex(locaColorOf(...a), -0.35),
                height: 8,
                altitude: 0,
            });
            loca.add(areaLayer);
        }

        // 路线：贴地脉冲流动动画（去掉海拔分层，只留脉冲）
        if (lines.length && locaEffects.routes) {
            const src = new Loca.GeoJSONSource({ data: { type: 'FeatureCollection', features: lines } });
            const pulseLayer = new Loca.PulseLineLayer({ zIndex: 111 });
            pulseLayer.setSource(src);
            pulseLayer.setStyle({ lineWidth: 4, trailColor: (...a) => locaColorOf(...a), headColor: '#ffffff', duration: 1800 });
            loca.add(pulseLayer);
        }

        loca.animate.start();
        locaContainer = loca;
    } catch (e) {
        console.error('❌ Loca 特效初始化失败', e);
        toast('⚠️ 特效初始化失败：' + (e && e.message ? e.message : e));
    }
}

function destroyLoca() {
    rippleOn = false;
    try {
        if (locaContainer && typeof locaContainer.destroy === 'function') locaContainer.destroy();
    } catch (_) {}
    locaContainer = null;
}

function updateLocaToggleBtn() {
    const btn = document.getElementById('btn-loca-toggle');
    if (btn) { btn.textContent = locaActive ? '🎆 关闭 3D 特效' : '🎆 开启 3D 特效'; btn.classList.toggle('active', locaActive); }
}

function updateLocaEffectButtons() {
    document.querySelectorAll('#loca-effects button[data-effect]').forEach(b => {
        b.classList.toggle('active', !!locaEffects[b.dataset.effect]);
    });
}

function toggleLoca(map) {
    if (locaActive) { destroyLoca(); locaActive = false; }
    else { initLoca(map); if (locaContainer) locaActive = true; }
    updateLocaToggleBtn();
}

// 单个特效开关：切换后重建 Loca 图层（仅当特效已开启时生效）
function toggleLocaEffect(name, on) {
    if (!(name in locaEffects)) return;
    locaEffects[name] = on;
    updateLocaEffectButtons();
    if (locaActive) rebuildLocaIfActive();
}

// 方案勾选变化后，若特效已开启则重建 Loca 图层（数据源变了）
function rebuildLocaIfActive() {
    if (!locaActive || !planMap) return;
    destroyLoca();
    initLoca(planMap);
}

// ========================================================
// 天气预报：AMap.Weather 插件（实时 + 3 天预报），右上角面板
// 城市默认「成都市」，可在 config.json 的 weather.city 覆盖
// ========================================================
function initWeather() {
    const panel = document.getElementById('weather-panel');
    if (!panel) return;
    const deg = (t) => String(t == null ? '--' : t).replace('℃', '').replace('°', '');
    const emoji = (w) => {
        const s = (w || '');
        if (s.includes('雪')) return '❄️';
        if (s.includes('雷')) return '⛈️';
        if (s.includes('雨')) return '🌧️';
        if (s.includes('雾') || s.includes('霾')) return '🌫️';
        if (s.includes('阴')) return '☁️';
        if (s.includes('云')) return '⛅';
        if (s.includes('晴')) return '☀️';
        return '🌤️';
    };
    let live = null;      // QWeather /v7/weather/now 的 now 对象
    let forecasts = [];   // QWeather /v7/weather/3d 的 daily 数组
    function render() {
        if (!live && forecasts.length === 0) { panel.style.display = 'none'; return; }
        let head, detail;
        if (live) {
            head = '<div class="w-head"><span class="w-emoji">' + emoji(live.text) + '</span>' +
                   '<span class="w-temp">' + deg(live.temp) + '°</span>' +
                   '<span class="w-cond">' + (live.text || '') + '</span></div>';
        } else {
            head = '<div class="w-head"><span class="w-emoji">🌤️</span><span class="w-cond">场馆天气</span></div>';
        }
        let inner = '';
        if (live) {
            inner += '<div class="w-city">📍 场馆实时</div>' +
                     '<div class="w-meta">' + (live.windDir || '') + ' ' + (live.windScale || '') + '级 · 湿度 ' + (live.humidity || '--') + '%</div>';
        }
        let fc = '';
        forecasts.forEach(f => {
            fc += '<div class="w-frow"><span class="w-fdate">' + (f.fxDate || '').slice(5) + '</span>' +
                  '<span class="w-fcond">' + emoji(f.textDay) + ' ' + (f.textDay || '') + '</span>' +
                  '<span class="w-ftemp">' + deg(f.tempMin) + '~' + deg(f.tempMax) + '°</span></div>';
        });
        if (fc) inner += '<div class="w-forecast">' + fc + '</div>';
        if (inner) detail = '<div class="w-detail">' + inner + '</div>';
        else detail = '';
        panel.innerHTML = head + detail;
        panel.style.display = 'block';
    }
    // 服务端代理和风天气 QWeather（key 只在 .env，前端不接触）
    async function load() {
        try {
            const [nowRes, fcRes] = await Promise.all([
                fetch('/api/weather?type=now', { cache: 'no-store' }),
                fetch('/api/weather?type=3d', { cache: 'no-store' }),
            ]);
            const nowJson = await nowRes.json();
            const fcJson = await fcRes.json();
            if (nowJson && nowJson.code === '200' && nowJson.now) live = nowJson.now;
            else console.warn('⚠️ 天气实时数据获取失败', nowJson);
            if (fcJson && fcJson.code === '200' && fcJson.daily) forecasts = fcJson.daily.slice(0, 3);
            else console.warn('⚠️ 天气预报数据获取失败', fcJson);
        } catch (err) {
            console.warn('⚠️ 天气请求失败', err.message);
        }
        render();
    }
    load();
    setInterval(load, 30 * 60 * 1000);   // 每 30 分钟刷新一次
    panel.addEventListener('click', () => panel.classList.toggle('expanded'));
}

// ========================================================
// 导览方案：把「路线图编辑器」保存的方案叠加到 3D 地图
// 支持多方案同时叠加、勾选记忆（localStorage）
const PLAN_DEFAULT_W = 1200, PLAN_DEFAULT_H = 800;
const PLAN_HALF_LNG = 0.002, PLAN_HALF_LAT = 0.0014;
const PLAN_MEMORY_KEY = 'active_plans';
const FLOOR_MEMORY_KEY = 'current_floor';
let currentFloor = parseInt(localStorage.getItem(FLOOR_MEMORY_KEY) || '0', 10) || 0;  // 当前楼层（0=默认/未配置）
let planMap = null;                     // 当前地图实例
let planProjects = [];                  // 方案列表缓存 {id,name}
let planOverlayGroups = {};             // planId -> { overlays:[], route:0, area:0 }
let activePlanData = {};                // planId -> { kind:'map', routes, areas, markers, ... }（供 Loca 特效读取）
let planFetching = {};                  // planId -> Promise（防重复 fetch）
let ui = null;                          // UI 控制器引用（供 applyPlan / displayRoutesAndAreas 显示名称）
let suppressMapClickUntil = 0;          // 覆盖物点击后短暂屏蔽 map click 的 hideInfo
let navStart = null;                    // 路径起点 {lng,lat,title,floor}
let navEnd = null;                      // 路径终点 {lng,lat,title,floor}
let navOverlay = null;                  // 路径直线 AMap.Polyline
let currentFeature = null;              // 当前详情卡地物 {lng,lat,title,floor}

function defaultPlanBounds(center) {
    const [clng, clat] = center || (CONFIG.geo ? CONFIG.geo.center : [104.14141, 30.67133]);
    return { nw: [clng - PLAN_HALF_LNG, clat + PLAN_HALF_LAT], se: [clng + PLAN_HALF_LNG, clat - PLAN_HALF_LAT] };
}

function planPointToLngLat(x, y, bounds, areaW, areaH) {
    const rot = bounds.rotation || 0;
    let px = x, py = y;
    if (rot) {
        // 底图旋转对位：像素绕图片中心顺时针旋转（与编辑器 CSS rotate 一致），再线性投影到经纬度
        const rad = rot * Math.PI / 180;
        const dx = x - areaW / 2, dy = y - areaH / 2;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        px = areaW / 2 + (dx * cos - dy * sin);
        py = areaH / 2 + (dx * sin + dy * cos);
    }
    const lng = bounds.nw[0] + (px / areaW) * (bounds.se[0] - bounds.nw[0]);
    const lat = bounds.nw[1] + (py / areaH) * (bounds.se[1] - bounds.nw[1]);
    return [lng, lat];
}

// 旋转后四角的轴对齐外接 bounds（供 ImageLayer 使用）
function rotatedBounds(bounds, areaW, areaH) {
    const rot = bounds.rotation || 0;
    if (!rot) return bounds;
    const corners = [[0, 0], [areaW, 0], [areaW, areaH], [0, areaH]];
    const lls = corners.map(c => planPointToLngLat(c[0], c[1], bounds, areaW, areaH));
    const lngs = lls.map(p => p[0]), lats = lls.map(p => p[1]);
    return { nw: [Math.min(...lngs), Math.max(...lats)], se: [Math.max(...lngs), Math.min(...lats)] };
}

// 把底图旋转 rotation 度烘焙成新图（轴对齐外接矩形，四角透明）
function bakeRotatedImage(dataUrl, w, h, rotation) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            const rad = rotation * Math.PI / 180;
            const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
            const bw = Math.max(1, Math.ceil(w * cos + h * sin));
            const bh = Math.max(1, Math.ceil(w * sin + h * cos));
            const canvas = document.createElement('canvas');
            canvas.width = bw; canvas.height = bh;
            const ctx = canvas.getContext('2d');
            ctx.translate(bw / 2, bh / 2);
            ctx.rotate(rad);
            ctx.drawImage(img, -w / 2, -h / 2, w, h);
            resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => reject(new Error('底图加载失败'));
        img.src = dataUrl;
    });
}

// 方框旋转：bounds（西南/东北角）绕中心顺时针旋转，返回 4 顶点
function rectCorners(bounds, rotation) {
    const sw = bounds[0], ne = bounds[1];
    const cx = (sw[0] + ne[0]) / 2, cy = (sw[1] + ne[1]) / 2;
    const hl = (ne[0] - sw[0]) / 2, hla = (ne[1] - sw[1]) / 2;
    const corners = [[cx - hl, cy - hla], [cx + hl, cy - hla], [cx + hl, cy + hla], [cx - hl, cy + hla]];
    if (!rotation) return corners;
    const rad = rotation * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
    const mLng = 111320 * Math.cos(cy * Math.PI / 180);
    return corners.map(([lng, lat]) => {
        const dx = (lng - cx) * mLng, dy = (lat - cy) * 111320;
        const dx2 = dx * cos + dy * sin, dy2 = -dx * sin + dy * cos;
        return [cx + dx2 / mLng, cy + dy2 / 111320];
    });
}

// 统一销毁图层/覆盖物：Layer 用 setMap(null)，Overlay 用 map.remove
function disposeOverlay(o, map) {
    try {
        const i = routeOverlays.indexOf(o);
        if (i >= 0) routeOverlays.splice(i, 1);
        if (o && typeof o.setMap === 'function') o.setMap(null);
        else if (o) map.remove(o);
    } catch (_) {}
}

/** 地图上放置名称标签（AMap.Text）：白字 + 半透明深底，可读 */
function addNameLabel(map, text, lngLat, anchor, offsetPx) {
    if (!text) return null;
    const t = new AMap.Text({
        text,
        position: new AMap.LngLat(lngLat[0], lngLat[1]),
        anchor: anchor || 'center',
        offset: offsetPx ? new AMap.Pixel(offsetPx[0], offsetPx[1]) : new AMap.Pixel(0, 0),
        style: {
            'background-color': 'rgba(0,0,0,0.62)',
            'color': '#ffffff',
            'font-size': '12px',
            'font-weight': '600',
            'padding': '3px 8px',
            'border-radius': '4px',
            'border': '1px solid rgba(255,255,255,0.22)',
        },
        zIndex: 20,
    });
    map.add(t);
    return t;
}

function removePlanOverlay(map, planId) {
    const g = planOverlayGroups[planId];
    if (!g) return;
    g.overlays.forEach(o => disposeOverlay(o, map));
    // 移除该方案的流动虚线
    (g.flowIds || []).forEach(id => removeFlowRoute(id));
    delete planOverlayGroups[planId];
    delete activePlanData[planId];
}

function applyPlan(map, plan) {
    removePlanOverlay(map, plan.id);
    const overlays = [];
    const group = { overlays, route: 0, area: 0, rect: 0, circle: 0, ellipse: 0, text: 0, flowIds: [] };
    planOverlayGroups[plan.id] = group;

    const data = plan.data || {};
    activePlanData[plan.id] = data;   // 缓存方案数据，供 Loca 特效读取

    // 「地图绘制」方案：routes/areas 直接存经纬度 [lng, lat]，无需底图对齐
    if (data.kind === 'map') {
        let added = 0;
        if (data.routes) {
            Object.entries(data.routes).forEach(([name, r]) => {
                if (!r.pts || r.pts.length < 2) return;
                const path = r.pts.map(p => new AMap.LngLat(p[0], p[1]));
                const o = new AMap.Polyline({ path, strokeColor: colorToHex(r.color), strokeWeight: 8, strokeOpacity: 0.01, zIndex: 10 });
                o.on('click', (e) => onFeatureClick(e, () => { const mp = r.pts[Math.floor(r.pts.length / 2)]; ui && ui.showFeature({ icon: '🛣️', title: name, badge: '路线', desc: r.desc || '', images: r.images || [], lng: mp[0], lat: mp[1] }); startGuide(r.pts, r.color, name); }));
                map.add(o); overlays.push(o); group.route++; added++;
                // 流动虚线（Canvas 层绘制，严格贴线）
                const flowId = 'plan:' + plan.id + ':' + name;
                addFlowRoute(flowId, r.pts, r.color, r.strokeWidth || 3, r.speed, r.direction);
                group.flowIds.push(flowId);
                // 路线名称标签（中点）
                const mid = r.pts[Math.floor(r.pts.length / 2)];
                const lbl = addNameLabel(map, name, mid, 'center');
                overlays.push(lbl);
                routeOverlays.push(o, lbl);
            });
        }
        if (data.areas) {
            Object.entries(data.areas).forEach(([name, a]) => {
                if (!a.pts || a.pts.length < 3) return;
                const path = a.pts.map(p => new AMap.LngLat(p[0], p[1]));
                const o = new AMap.Polygon({ path, strokeColor: colorToHex(a.color, '#10b981'), strokeWeight: a.strokeWidth || 2, fillColor: colorToHex(a.color, '#10b981'), fillOpacity: a.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (e) => onFeatureClick(e, () => { let ax = 0, ay = 0; a.pts.forEach(p => { ax += p[0]; ay += p[1]; }); ui && ui.showFeature({ icon: '🗺️', title: name, badge: '区域', desc: a.desc || '', images: a.images || [], lng: ax / a.pts.length, lat: ay / a.pts.length }); }));
                map.add(o); overlays.push(o); group.area++; added++;
                // 区域名称标签（质心）
                let cx = 0, cy = 0;
                a.pts.forEach(p => { cx += p[0]; cy += p[1]; });
                cx /= a.pts.length; cy /= a.pts.length;
                overlays.push(addNameLabel(map, name, [cx, cy], 'center'));
            });
        }
        if (data.markers) {
            Object.entries(data.markers).forEach(([name, m]) => {
                if (m.lng == null || m.lat == null) return;
                const color = colorToHex(m.color, '#f59e0b');
                const mk = new AMap.Marker({
                    position: new AMap.LngLat(m.lng, m.lat),
                    content: '<div style="width:12px;height:12px;background:' + color + ';border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,0.6)"></div>',
                    offset: new AMap.Pixel(-8, -8),
                    zIndex: 15,
                });
                mk.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '📍', title: name, badge: '标记点', desc: m.desc || '', images: m.images || [], lng: m.lng, lat: m.lat })));
                map.add(mk); overlays.push(mk); added++;
                // 标记点名称标签（圆点下方）
                overlays.push(addNameLabel(map, name, [m.lng, m.lat], 'top-center', [0, 10]));
            });
        }
        if (data.rects) {
            Object.entries(data.rects).forEach(([name, r]) => {
                if (!r.bounds || !r.bounds[0] || !r.bounds[1]) return;
                const rot = r.rotation || 0;
                const o = rot
                    ? new AMap.Polygon({ path: rectCorners(r.bounds, rot), strokeColor: colorToHex(r.color, '#8b5cf6'), strokeWeight: r.strokeWidth || 2, fillColor: colorToHex(r.color, '#8b5cf6'), fillOpacity: r.opacity ?? 0.2, zIndex: 5 })
                    : new AMap.Rectangle({ bounds: new AMap.Bounds(r.bounds[0], r.bounds[1]), strokeColor: colorToHex(r.color, '#8b5cf6'), strokeWeight: r.strokeWidth || 2, fillColor: colorToHex(r.color, '#8b5cf6'), fillOpacity: r.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '▭', title: name, badge: '画框', desc: r.desc || '', images: r.images || [], lng: (r.bounds[0][0] + r.bounds[1][0]) / 2, lat: (r.bounds[0][1] + r.bounds[1][1]) / 2 })));
                map.add(o); overlays.push(o); group.rect++; added++;
                const c = [(r.bounds[0][0] + r.bounds[1][0]) / 2, (r.bounds[0][1] + r.bounds[1][1]) / 2];
                overlays.push(addNameLabel(map, name, c, 'center'));
            });
        }
        if (data.circles) {
            Object.entries(data.circles).forEach(([name, c]) => {
                if (!c.center || c.radius == null) return;
                const o = new AMap.Circle({ center: c.center, radius: c.radius, strokeColor: colorToHex(c.color, '#ec4899'), strokeWeight: c.strokeWidth || 2, fillColor: colorToHex(c.color, '#ec4899'), fillOpacity: c.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '◯', title: name, badge: '画圆', desc: c.desc || '', images: c.images || [], lng: c.center[0], lat: c.center[1] })));
                map.add(o); overlays.push(o); group.circle++; added++;
                overlays.push(addNameLabel(map, name, c.center, 'center'));
            });
        }
        if (data.ellipses) {
            Object.entries(data.ellipses).forEach(([name, e]) => {
                if (!e.center || e.radius == null) return;
                const r = Array.isArray(e.radius) ? e.radius : [e.radius, e.radius];
                const o = new AMap.Ellipse({ center: e.center, radius: r, strokeColor: colorToHex(e.color, '#06b6d4'), strokeWeight: e.strokeWidth || 2, fillColor: colorToHex(e.color, '#06b6d4'), fillOpacity: e.opacity ?? 0.2, zIndex: 5 });
                o.on('click', (ev) => onFeatureClick(ev, () => ui && ui.showFeature({ icon: '⬭', title: name, badge: '椭圆', desc: e.desc || '', images: e.images || [], lng: e.center[0], lat: e.center[1] })));
                map.add(o); overlays.push(o); group.ellipse++; added++;
                overlays.push(addNameLabel(map, name, e.center, 'center'));
            });
        }
        if (data.texts) {
            Object.entries(data.texts).forEach(([name, t]) => {
                if (t.lng == null || t.lat == null) return;
                const o = new AMap.Text({ text: name, position: new AMap.LngLat(t.lng, t.lat), anchor: 'center', style: { 'color': t.color || '#ffffff', 'font-size': '14px', 'font-weight': '600', 'background-color': 'rgba(0,0,0,0.55)', 'padding': '3px 8px', 'border-radius': '4px', 'border': '1px solid rgba(255,255,255,0.25)' }, zIndex: 20 });
                map.add(o); overlays.push(o); group.text++; added++;
            });
        }
        return overlays.length;
    }

    const els = Array.isArray(data.elements) ? data.elements : [];
    const areaW = data.imageWidth || PLAN_DEFAULT_W;
    const areaH = data.imageHeight || PLAN_DEFAULT_H;
    const bounds = normalizeGeoBounds(data.geoBounds || defaultPlanBounds(), areaW, areaH);

    // 底图：场地平面图，按 geoBounds 对齐到地图（支持旋转烘焙）
    if (data.backgroundImage) {
        const rot = bounds.rotation || 0;
        const bbox = rotatedBounds(bounds, areaW, areaH);
        const makeLayer = (url) => {
            try {
                const imgLayer = new AMap.ImageLayer({
                    url,
                    bounds: new AMap.Bounds(
                        new AMap.LngLat(bbox.nw[0], bbox.nw[1]),
                        new AMap.LngLat(bbox.se[0], bbox.se[1])
                    ),
                    opacity: data.bgOpacity ?? 1,
                    zooms: [3, 20],
                    zIndex: 1,
                });
                imgLayer.setMap(map);
                overlays.push(imgLayer);
            } catch (err) {
                console.warn('⚠️ 底图叠加失败:', err.message);
            }
        };
        if (rot) {
            bakeRotatedImage(data.backgroundImage, areaW, areaH, rot).then(url => {
                if (planOverlayGroups[plan.id] !== group) return; // 方案已移除，丢弃
                makeLayer(url);
            }).catch(err => console.warn('⚠️ 底图旋转失败:', err.message));
        } else {
            makeLayer(data.backgroundImage);
        }
    }

    els.forEach(el => {
        if (el.visible === false) return;
        const pts = (el.points || []).map(p => planPointToLngLat(p.x, p.y, bounds, areaW, areaH));
        const path = pts.map(p => new AMap.LngLat(p[0], p[1]));
        let o = null;
        const title = el.label || el.name || '';
        if (el.type === 'route' && pts.length >= 2) {
            o = new AMap.Polyline({ path, strokeColor: colorToHex(el.color, '#3b82f6'), strokeWeight: el.strokeWidth || 3, strokeOpacity: el.opacity ?? 0.9, zIndex: 10 });
            const mid = pts[Math.floor(pts.length / 2)];
            o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '🛣️', title, badge: '路线', desc: '', images: [], lng: mid[0], lat: mid[1] })));
            group.route++;
        } else if (el.type === 'area' && pts.length >= 3) {
            o = new AMap.Polygon({ path, strokeColor: colorToHex(el.color, '#10b981'), strokeWeight: el.strokeWidth || 2, fillColor: colorToHex(el.color, '#10b981'), fillOpacity: (el.opacity ?? 1) * 0.25, zIndex: 5 });
            let ax = 0, ay = 0; pts.forEach(p => { ax += p[0]; ay += p[1]; });
            o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '🗺️', title, badge: '区域', desc: '', images: [], lng: ax / pts.length, lat: ay / pts.length })));
            group.area++;
        } else if (el.type === 'text' && pts.length >= 1) {
            o = new AMap.Text({
                text: el.label || '', position: new AMap.LngLat(pts[0][0], pts[0][1]),
                style: {
                    'background-color': el.backgroundColor || 'rgba(0,0,0,0.7)',
                    'color': el.color || '#ffffff', 'font-size': (el.fontSize || 16) + 'px',
                    'padding': '4px 8px', 'border-radius': '14px',
                },
            });
            o.on('click', (e) => onFeatureClick(e, () => ui && ui.showFeature({ icon: '💬', title, badge: '文字', desc: '', images: [], lng: pts[0][0], lat: pts[0][1] })));
        }
        if (o) { map.add(o); overlays.push(o); }
    });
    return overlays.length;
}

function getActivePlanIds() {
    try { return JSON.parse(localStorage.getItem(PLAN_MEMORY_KEY) || '[]'); }
    catch (_) { return []; }
}
function saveActivePlanIds(ids) {
    try { localStorage.setItem(PLAN_MEMORY_KEY, JSON.stringify(ids)); } catch (_) {}
}

// —— 路径导航：详情卡设起点/终点 → 画直线 + 距离 + 楼层提示 ——
function setNavPoint(which) {
    if (!currentFeature) return;
    if (which === 'start') navStart = currentFeature;
    else navEnd = currentFeature;
    if (ui) ui.hideInfo();
    updateNavPanel();
    if (navStart && navEnd) drawNavRoute();
}

function formatNavDistance(m) {
    return m >= 1000 ? (m / 1000).toFixed(1) + ' 公里' : Math.round(m) + ' 米';
}

function updateNavPanel() {
    const sl = document.getElementById('nav-start-line');
    const el = document.getElementById('nav-end-line');
    const dl = document.getElementById('nav-dist-line');
    if (sl) sl.textContent = '起点：' + (navStart ? (navStart.title + ' · ' + navStart.floor + 'F') : '未设置');
    if (el) el.textContent = '终点：' + (navEnd ? (navEnd.title + ' · ' + navEnd.floor + 'F') : '未设置');
    if (dl) dl.textContent = '';
}

function clearNavRoute() {
    if (navOverlay) { navOverlay.setMap(null); navOverlay = null; }
}

function clearNav() {
    navStart = null; navEnd = null; clearNavRoute(); updateNavPanel();
}

function drawNavRoute() {
    if (!planMap || !navStart || !navEnd) return;
    clearNavRoute();
    navOverlay = new AMap.Polyline({
        path: [new AMap.LngLat(navStart.lng, navStart.lat), new AMap.LngLat(navEnd.lng, navEnd.lat)],
        strokeColor: '#22d3ee', strokeWeight: 4, strokeStyle: 'dashed', strokeOpacity: 0.95, zIndex: 30,
    });
    navOverlay.setMap(planMap);
    const dist = AMap.GeometryUtil.distance(
        new AMap.LngLat(navStart.lng, navStart.lat),
        new AMap.LngLat(navEnd.lng, navEnd.lat)
    );
    const dl = document.getElementById('nav-dist-line');
    if (dl) dl.textContent = '直线距离：约 ' + formatNavDistance(dist);
    if (navStart.floor !== navEnd.floor) {
        toast('⚠️ 终点「' + navEnd.title + '」在 ' + navEnd.floor + 'F，请切换楼层查看');
    }
    planMap.setZoomAndCenter(Math.max(planMap.getZoom(), 17), [navStart.lng, navStart.lat]);
}

// 方案楼层：取 floor 字段，非法/缺失回退 0F（默认/未配置）
function floorOf(p) { return (p.floor && Number(p.floor) > 0) ? Number(p.floor) : 0; }

function renderPlanList() {

function renderFloorSwitcher() {

}

function renderOnePlanList(box, plans, active) {
    if (!box) return;
    box.innerHTML = '';
    if (plans.length === 0) {
        box.innerHTML = '<div style="font-size:0.72rem;color:rgba(255,255,255,0.35);padding:4px 0;">暂无方案</div>';
        return;
    }
    plans.forEach(p => {
        const item = document.createElement('div');
        item.className = 'plan-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = active.has(String(p.id));
        cb.addEventListener('change', () => togglePlan(p.id, cb.checked));
        const name = document.createElement('span');
        name.className = 'plan-name';
        name.textContent = p.name || ('方案 ' + p.id);
        name.title = p.name || '';
        name.addEventListener('click', () => { cb.checked = !cb.checked; togglePlan(p.id, cb.checked); });
        item.appendChild(cb);
        item.appendChild(name);
        box.appendChild(item);
    });
}

// 首页登录（角色决定方案可见性）
// 未登录 = 访客（等同普通用户，仅公开方案）；超级用户/管理员 = 全部方案
// 首页为纯查看：无编辑、无删除，登录只影响「能看到哪些方案」
const AUTH_KEY = 'viewer_token';
const ROLE_NAMES = { admin: '管理员', super: '超级用户', user: '普通用户' };
let viewerAuth = { token: null, username: null, role: null };

function authHeaders() {
    return viewerAuth.token ? { 'Authorization': 'Bearer ' + viewerAuth.token } : {};
}

function openLogin() {
    const overlay = document.getElementById('login-modal');
    if (overlay) { overlay.style.display = 'flex'; setTimeout(() => document.getElementById('login-user').focus(), 50); }
}
function closeLogin() {
    const overlay = document.getElementById('login-modal');
    if (overlay) overlay.style.display = 'none';
}

async function doLogin() {
    const username = (document.getElementById('login-user').value || '').trim();
    const password = document.getElementById('login-pwd').value;
    if (!username || !password) { alert('请输入用户名和密码'); return; }
    try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const j = await r.json();
        if (!r.ok) { alert('登录失败：' + (j.error || ('HTTP ' + r.status))); return; }
        viewerAuth = { token: j.token, username: j.username, role: j.role };
        localStorage.setItem(AUTH_KEY, j.token);
        closeLogin();
        renderAuthState();
        await refreshPlansAfterAuthChange();
    } catch (e) { alert('登录失败：' + e.message); }
}

async function logout() {
    viewerAuth = { token: null, username: null, role: null };
    localStorage.removeItem(AUTH_KEY);
    renderAuthState();
    await refreshPlansAfterAuthChange();
}

async function initAuth() {
    try {
        const token = localStorage.getItem(AUTH_KEY);
        if (!token) { renderAuthState(); return; }
        viewerAuth.token = token;
        const r = await fetch('/api/check', { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.ok) {
            const j = await r.json();
            viewerAuth.username = j.username;
            viewerAuth.role = j.role;
        } else {
            viewerAuth = { token: null, username: null, role: null };
            localStorage.removeItem(AUTH_KEY);
        }
    } catch (_) {
        viewerAuth = { token: null, username: null, role: null };
    }
    renderAuthState();
}

function renderAuthState() {
    const btn = document.getElementById('btn-auth');
    const badge = document.getElementById('auth-badge');
    const hint = document.getElementById('auth-hint');
    if (viewerAuth.role) {
        if (btn) btn.textContent = '🚪 退出';
        if (badge) { badge.textContent = ROLE_NAMES[viewerAuth.role] || viewerAuth.role; badge.style.display = 'inline-block'; }
        if (hint) hint.textContent = (viewerAuth.role === 'user') ? '仅显示公开方案' : '显示全部方案';
    } else {
        if (btn) btn.textContent = '👤 登录';
        if (badge) badge.style.display = 'none';
        if (hint) hint.textContent = '未登录 · 仅显示公开方案';
    }
}

// 登录/退出后清空已叠加方案，按新角色重新加载可见方案
async function refreshPlansAfterAuthChange() {
    if (planMap) getActivePlanIds().forEach(id => removePlanOverlay(planMap, Number(id)));
    saveActivePlanIds([]);
    await refreshPlanList();
    rebuildLocaIfActive();
    const allIds = planProjects.map(p => String(p.id));
    saveActivePlanIds(allIds);
    renderPlanList();
    if (planMap && allIds.length > 0) {
        Promise.all(allIds.map(id => fetchPlanData(id))).then(plans => {
            plans.forEach(plan => { if (plan) applyPlan(planMap, plan); });
            rebuildLocaIfActive();
        });
    }
}

document.getElementById('login-cancel').addEventListener('click', closeLogin);
document.getElementById('login-submit').addEventListener('click', doLogin);
document.getElementById('login-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeLogin(); });
document.getElementById('login-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('login-user').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('btn-auth').addEventListener('click', () => { viewerAuth.role ? logout() : openLogin(); });

async function refreshPlanList() {
    try {
        const res = await fetch('/api/editor/projects', { headers: authHeaders(), cache: 'no-store' });
        const json = await res.json();
        planProjects = json.data || [];
    } catch (e) {}
    renderPlanList();
}

function togglePlan(planId, on) {
    const active = getActivePlanIds().filter(id => String(id) !== String(planId));
    if (on) {
        active.push(String(planId));
        saveActivePlanIds(active);
        if (!planMap) return;
        fetchPlanData(planId).then(plan => {
            if (!plan) { console.warn('⚠️ 方案加载失败'); return; }
            const n = applyPlan(planMap, plan);
            console.log(`✅ 已叠加方案「${plan.name}」，${n} 个对象`);
            rebuildLocaIfActive();
        });
    } else {
        saveActivePlanIds(active);
        if (planMap) removePlanOverlay(planMap, planId);
        rebuildLocaIfActive();
    }
}

async function fetchPlanData(id) {
    if (planFetching[id]) return planFetching[id];
    planFetching[id] = (async () => {
        try {
            const res = await fetch('/api/editor/projects/' + id, { headers: authHeaders(), cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const json = await res.json();
            return json.data;
        } catch (err) {
            console.error('❌ 加载方案失败:', err.message);
            return null;
        } finally {
            delete planFetching[id];
        }
    })();
    return planFetching[id];
}

async function initPlanSelector(map) {
    planMap = map;
    try {
        const res = await fetch('/api/editor/projects', { headers: authHeaders(), cache: 'no-store' });
        const json = await res.json();
        planProjects = json.data || [];
    } catch (err) {
        console.warn('⚠️ 加载方案列表失败:', err.message);
    }
    renderPlanList();

    const btnClear = document.getElementById('btn-clear-plan');
    if (btnClear) btnClear.addEventListener('click', () => {
        getActivePlanIds().forEach(id => removePlanOverlay(map, Number(id)));
        saveActivePlanIds([]);
        renderPlanList();
        rebuildLocaIfActive();
    });

    // 所有方案自然显示：已有勾选记忆则恢复之；否则激活全部方案
    const allIds = planProjects.map(p => String(p.id));
    const savedIds = getActivePlanIds().filter(id => allIds.includes(String(id)));
    const toActivate = (savedIds.length > 0) ? savedIds : allIds;
    saveActivePlanIds(toActivate);
    toActivate.forEach(id => {
        fetchPlanData(id).then(plan => {
            if (!plan) return;
            applyPlan(map, plan);
            console.log(`✅ 已激活方案「${plan.name}」`);
        });
    });
    renderPlanList();
    rebuildLocaIfActive();
}


// 活动方案自动刷新：后台删除/编辑路线、区域后，切回首页（focus/visibility）或定时轮询时立即同步，不保留旧数据
async function refreshActivePlans() {
    if (!planMap) return;
    const ids = getActivePlanIds();
    let changed = false;
    for (const id of ids) {
        try {
            const plan = await fetchPlanData(id);
            if (!plan) continue;
            const prev = JSON.stringify(activePlanData[id] || null);
            const next = JSON.stringify(plan.data || null);
            if (prev !== next) { applyPlan(planMap, plan); changed = true; }
        } catch (_) {}
    }
    if (changed) rebuildLocaIfActive();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshActivePlans(); });
window.addEventListener('focus', refreshActivePlans);
setInterval(refreshActivePlans, 30000);

// 首页测量工具：测距 + 测面积（复用高德官方 RangingTool / MouseTool）
function initMeasureTools(map){
    const btnDist = document.getElementById('btn-measure-distance');
    const btnArea = document.getElementById('btn-measure-area');
    const btnClear = document.getElementById('btn-measure-clear');
    const btnClearNav = document.getElementById('btn-clear-nav');
    if (btnClearNav) btnClearNav.addEventListener('click', () => clearNav());
    if (!btnDist || !btnArea || !btnClear) return;

    function stopMeasure(){
        measureMode = null;
        if (measureRanging) { try { measureRanging.turnOff(); } catch(_){} }
        if (measureMouseTool) { try { measureMouseTool.close(); } catch(_){} }
        btnDist.classList.remove('active'); btnArea.classList.remove('active');
    }
    function clearMeasure(){
        stopMeasure();
        measureOverlays.forEach(o => { try { o.setMap(null); } catch(_){} });
        measureOverlays = [];
    }
    function startDistance(){
        if (measureMode === 'distance') { stopMeasure(); return; }
        clearMeasure();
        measureMode = 'distance';
        btnDist.classList.add('active'); btnArea.classList.remove('active');
        measureRanging.turnOn();
        toast('📏 测距 — 点击加测量点，双击结束');
    }
    function startArea(){
        if (measureMode === 'area') { stopMeasure(); return; }
        clearMeasure();
        measureMode = 'area';
        btnArea.classList.add('active'); btnDist.classList.remove('active');
        measureMouseTool.polygon({ strokeColor:'#f59e0b', strokeWeight:2, strokeOpacity:0.8, fillColor:'#f59e0b', fillOpacity:0.2 });
        toast('🧮 测面积 — 点击加顶点，双击出面积');
    }

    AMap.plugin(['AMap.MouseTool', 'AMap.RangingTool'], () => {
        measureMouseTool = new AMap.MouseTool(map);
        measureMouseTool.on('draw', (e) => {
            if (measureMode !== 'area') return;
            const path = e.obj.getPath().map(p => [p.lng, p.lat]);
            e.obj.setMap(null);
            const area = polygonAreaMeters(path);
            stopMeasure();
            toast('🧮 面积: ' + formatArea(area));
        });

        // 与高德官方测距一致：起点/中间点/终点用官方图标，实线 + 虚线预览
        const mkIcon = (n) => new AMap.Icon({ size:new AMap.Size(19,31), imageSize:new AMap.Size(19,31), image:'https://webapi.amap.com/theme/v1.3/markers/b/' + n + '.png' });
        const mkOpt = (n) => ({ icon: mkIcon(n), offset: new AMap.Pixel(-9,-31) });
        measureRanging = new AMap.RangingTool(map, {
            lineOptions: { strokeColor:'#3366FF', strokeWeight:6, strokeStyle:'solid' },
            tmpLineOptions: { strokeColor:'#3366FF', strokeWeight:3, strokeStyle:'dashed', strokeOpacity:0.6 },
            startMarkerOptions: mkOpt('start'),
            midMarkerOptions: mkOpt('mid'),
            endMarkerOptions: mkOpt('end'),
        });
        measureRanging.on('end', (e) => {
            if (measureMode !== 'distance') return;
            const d = e && typeof e.distance === 'number' ? e.distance : null;
            stopMeasure();
            if (d != null) toast('📐 距离: ' + (d >= 1000 ? (d / 1000).toFixed(2) + ' 公里' : Math.round(d) + ' 米'));
        });

        btnDist.addEventListener('click', startDistance);
        btnArea.addEventListener('click', startArea);
        btnClear.addEventListener('click', clearMeasure);
    });
}

async function boot() {
    ui = new UIController();
    ui.setProgress('加载配置...', 5);

    // Load config
    await loadConfig();

    // Init Amap
    ui.setProgress('初始化地图...', 20);
    const map = await initAmap();
    if (!map) return; // Fallback handled in initAmap

    // Setup Three.js — wait for GLCustomLayer init, then create objects
    ui.setProgress('初始化 3D 引擎...', 40);
    const { scene, camera, renderer, labelRenderer, waitForInit } = setupThreeScene(map);

    // waitForInit returns a promise that resolves after GLCustomLayer.init runs
    ui.setProgress('等待图层就绪...', 50);
    const { localToAmap } = await waitForInit();

    ui.setProgress('构建场馆模型...', 60);
    buildVenue(scene, localToAmap);

    ui.setProgress('放置入口标记...', 70);
    const markerData = createMarkers(scene, localToAmap);

    ui.setProgress('生成流动路线...', 80);

    // Init drawing manager
    displayRoutesAndAreas(map);

    // 先解析登录态（角色决定方案可见性），再加载「导览方案」
    await initAuth();
    initPlanSelector(map);

    // 首页测量工具：测距 + 测面积
    initMeasureTools(map);

    // 可视化特效开关（Loca v2）
    const btnLoca = document.getElementById('btn-loca-toggle');
    if (btnLoca) btnLoca.addEventListener('click', () => toggleLoca(map));

    // 单个特效选择性展示（路线/呼吸点）
    document.querySelectorAll('#loca-effects button[data-effect]').forEach(b => {
        b.addEventListener('click', () => toggleLocaEffect(b.dataset.effect, !locaEffects[b.dataset.effect]));
    });
    updateLocaEffectButtons();

    // 天气预报（AMap.Weather）
    initWeather();

    // 时段氛围：初始渲染 + 每分钟刷新（小时变化才真正跳档）
    updateAtmosphere();
    setInterval(updateAtmosphere, 60000);

    // 搜索：优先匹配本地场馆标记，其次高德 POI
    AMap.plugin('AMap.AutoComplete', () => {
        const auto = new AMap.AutoComplete({ city: '成都', citylimit: true });
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const itemCache = {};   // 方案地物结果缓存：itemId → {type,badge,icon,name,lng,lat,desc,images,pts}
        searchInput.addEventListener('input', () => {
            const val = searchInput.value.trim();
            if (!val) { searchResults.style.display = 'none'; return; }
            searchResults.innerHTML = '';
            const q = val.toLowerCase();
            // 1) 本地场馆标记
            for (const [key, m] of Object.entries(CONFIG.markers || {})) {
                if ((m.label || key).toLowerCase().includes(q)) {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.dataset.venueKey = key;
                    div.textContent = (m.icon || '📍') + ' ' + (m.label || key);
                    searchResults.appendChild(div);
                }
            }
            // 2) 方案地物（标记/区域/路线/画框/圆/椭圆 + 室内元素）
            let seq = 0;
            for (const it of buildSearchIndex()) {
                if (!(it.name || '').toLowerCase().includes(q)) continue;
                const id = 'pi' + (seq++);
                itemCache[id] = it;
                const div = document.createElement('div');
                div.className = 'search-item';
                div.dataset.itemId = id;
                const floorTag = it.floor ? (' · ' + it.floor + 'F') : '';
                div.textContent = (it.indoor ? '🏠 ' : '') + (it.icon || '📍') + ' ' + it.name + floorTag;
                searchResults.appendChild(div);
            }
            searchResults.style.display = searchResults.children.length ? 'block' : 'none';
            // 3) 高德 POI
            auto.search(val, (status, result) => {
                if (status === 'complete' && result.tips) {
                    result.tips.slice(0, 6).forEach(t => {
                        const div = document.createElement('div');
                        div.className = 'search-item';
                        div.dataset.lng = t.location?.lng || '';
                        div.dataset.lat = t.location?.lat || '';
                        div.textContent = '📍 ' + (t.name || '');
                        searchResults.appendChild(div);
                    });
                    searchResults.style.display = searchResults.children.length ? 'block' : 'none';
                }
            });
        });
        searchResults.addEventListener('click', (e) => {
            const item = e.target.closest('.search-item');
            if (!item) return;
            if (item.dataset.venueKey) {
                const vk = item.dataset.venueKey;
                searchResults.style.display = 'none';
                searchInput.value = item.textContent.replace(/^[^\s]+\s/, '');
                {
                    const md = markerData.find(m => m.key === vk);
                    if (md) { map.setZoomAndCenter(18, md.lngLat); ui.showInfo(vk); }
                }
                return;
            }
            if (item.dataset.itemId) {
                const it = itemCache[item.dataset.itemId];
                if (it) {
                    searchResults.style.display = 'none';
                    searchInput.value = it.name;
                    flyTo([it.lng, it.lat], 18, map.getPitch(), map.getRotation());
                    ui.showFeature({ icon: it.icon, title: it.name, badge: it.badge, desc: it.desc, images: it.images, lng: it.lng, lat: it.lat });
                    if (it.type === 'route' && it.pts) startGuide(it.pts, it.color, it.name);
                }
                return;
            }
            const lng = parseFloat(item.dataset.lng), lat = parseFloat(item.dataset.lat);
            if (lng && lat) {
                map.setZoomAndCenter(18, [lng, lat]);
                searchResults.style.display = 'none';
                searchInput.value = item.textContent.replace('📍 ', '');
            }
        });
        document.addEventListener('click', (e) => { if (!e.target.closest('.sb-search')) searchResults.style.display = 'none'; });
    });

    map.on('click', (e) => {
        // 刚点击了路线/区域覆盖物时，不触发这里的 hideInfo（避免信息卡闪退）
        if (performance.now() < suppressMapClickUntil) return;
        const clicked = e.lnglat;
        for (const md of markerData) {
            const dist = AMap.GeometryUtil.distance(
                [clicked.lng, clicked.lat],
                [md.lngLat[0], md.lngLat[1]]
            );
            if (dist < 25) {
                ui.showInfo(md.key);
                return;
            }
        }
        ui.hideInfo();
    });

    // Smooth camera animation helper
    function flyTo(targetLngLat, targetZoom, targetPitch, targetRotation, duration = 1200) {
        const startZoom = map.getZoom();
        const startPitch = map.getPitch();
        const startRotation = map.getRotation();
        const startCenter = map.getCenter();
        const startTime = performance.now();

        return new Promise(resolve => {
            function step(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                // easeInOutCubic
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

                map.setZoom(startZoom + (targetZoom - startZoom) * ease);
                map.setPitch(startPitch + (targetPitch - startPitch) * ease);
                map.setRotation(startRotation + (targetRotation - startRotation) * ease);

                const lng = startCenter.lng + (targetLngLat[0] - startCenter.lng) * ease;
                const lat = startCenter.lat + (targetLngLat[1] - startCenter.lat) * ease;
                map.setCenter([lng, lat]);

                if (t < 1) {
                    requestAnimationFrame(step);
                } else {
                    resolve();
                }
            }
            requestAnimationFrame(step);
        });
    }

    // Map style switching (bottom-right controls)
    const layerStyles = { dark: 'amap://styles/dark', normal: 'amap://styles/light', satellite: 'amap://styles/light' };
    let satelliteLayer = null;

    // 卫星图「隐藏路线」：切换流动虚线 + 路线名称标签的显隐
    function applyHideRoutes() {
        routeOverlays.forEach(o => {
            try {
                if (hideRoutes) o.setMap(null);
                else o.setMap(map);
            } catch (_) {}
        });
        const btn = document.getElementById('btn-hide-routes');
        if (btn) btn.textContent = hideRoutes ? '🛣️ 显示路线' : '🚫 隐藏路线';
    }
    const btnHideRoutes = document.getElementById('btn-hide-routes');
    if (btnHideRoutes) btnHideRoutes.addEventListener('click', () => { hideRoutes = !hideRoutes; applyHideRoutes(); });

    document.querySelectorAll('#bottom-controls button[data-layer]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#bottom-controls button[data-layer]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const layer = btn.dataset.layer;
            const visGroup = document.getElementById('route-visibility');
            if (layer === 'satellite') {
                // 卫星层只 add 一次，之后用 show/hide 切换；绝不用 setLayers 替换底图
                //（否则底图被换成默认栅格层，setMapStyle 切不回暗黑/标准矢量样式）
                if (!satelliteLayer) { satelliteLayer = new AMap.TileLayer.Satellite(); map.add(satelliteLayer); }
                satelliteLayer.show();
                if (visGroup) visGroup.style.display = '';   // 卫星图下显示「隐藏路线」开关
            } else {
                // 非卫星：隐藏卫星层，用 setMapStyle 切回矢量样式（暗黑/标准）
                if (satelliteLayer) { try { satelliteLayer.hide(); } catch (_) {} }
                map.setMapStyle(layerStyles[layer] || 'amap://styles/dark');
                if (visGroup) visGroup.style.display = 'none';
                // 离开卫星图自动恢复显示路线
                if (hideRoutes) { hideRoutes = false; applyHideRoutes(); }
            }
        });
    });

    // 2D/3D toggle (bottom-right controls)
    let savedPitch = CONFIG.geo.pitch || 55;
    let savedRotation = CONFIG.geo.rotation || 20;
    document.querySelectorAll('#bottom-controls button[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#bottom-controls button[data-mode]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.mode === '2d') {
                savedPitch = map.getPitch() || savedPitch;
                savedRotation = map.getRotation() || 0;
                map.setPitch(0);
                map.setRotation(0);
            } else {
                map.setPitch(savedPitch);
                map.setRotation(savedRotation);
            }
        });
    });

    // 视角预设：飞至后台配置的相机视角
    function applyPreset(name) {
        const p = CONFIG.camera.presets && CONFIG.camera.presets[name];
        if (!p) return;
        const target = localToLngLat(p.target[0], p.target[2], CONFIG.geo.center);
        const dx = p.pos[0] - p.target[0];
        const dy = p.pos[1] - p.target[1];
        const dz = p.pos[2] - p.target[2];
        const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy + dz * dz));
        const pitch = Math.round(Math.atan2(dy, Math.hypot(dx, dz)) * 180 / Math.PI);
        const zoom = Math.max(14, Math.min(20, 19 - Math.log2(dist)));
        map.setZoomAndCenter(zoom, target);
        map.setPitch(Math.max(0, Math.min(80, pitch)));
        map.setRotation(CONFIG.geo.rotation || 20);
        document.querySelectorAll('#camera-presets button').forEach(b => b.classList.toggle('active', b.dataset.preset === name));
    }
    function renderCameraPresets() {
        const container = document.getElementById('camera-presets');
        if (!container) return;
        const presets = Object.entries(CONFIG.camera.presets || {});
        container.innerHTML = '';
        if (!presets.length) { container.style.display = 'none'; return; }
        container.style.display = 'flex';
        for (const [name] of presets) {
            const btn = document.createElement('button');
            btn.textContent = name;
            btn.dataset.preset = name;
            btn.addEventListener('click', () => applyPreset(name));
            container.appendChild(btn);
        }
    }
    renderCameraPresets();

    // Auto-rotate (orbit the Amap camera)
    let autoRotate = false;
    let rotationAngle = CONFIG.geo.rotation || 20;
    document.getElementById('btn-auto-rotate').addEventListener('click', () => {
        autoRotate = !autoRotate;
        const btn = document.getElementById('btn-auto-rotate');
        if (autoRotate) { btn.textContent = '⏸'; btn.style.color = 'var(--accent-main)'; }
        else { btn.textContent = '⟳'; btn.style.color = ''; }
    });

    // —— 手机端侧边栏抽屉 ——
    const sidebarEl = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    const btnMenu = document.getElementById('btn-menu');
    function closeSidebar() {
        if (sidebarEl) sidebarEl.classList.remove('open');
        if (sidebarBackdrop) sidebarBackdrop.classList.remove('show');
    }
    function toggleSidebar() {
        if (sidebarEl && sidebarEl.classList.contains('open')) closeSidebar();
        else {
            if (sidebarEl) sidebarEl.classList.add('open');
            if (sidebarBackdrop) sidebarBackdrop.classList.add('show');
        }
    }
    if (btnMenu) btnMenu.addEventListener('click', toggleSidebar);
    if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);
    // 选中方案/搜索结果后自动收起抽屉
    document.addEventListener('click', e => {
        if (window.innerWidth > 768) return;
        if (e.target.closest('.plan-item') || e.target.closest('.search-item')) closeSidebar();
    });

    // Animation loop — update objects, trigger GLCustomLayer render
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);
        const elapsed = clock.elapsedTime;

        // Auto-rotate
        if (autoRotate) {
            rotationAngle += dt * 8;
            map.setRotation(rotationAngle % 360);
        }


        // Pulse marker rings & cones
        scene.children.forEach(child => {
            if (child.isMesh && child.geometry.type === 'RingGeometry' && child.userData.phase !== undefined) {
                const s = 1 + 0.25 * Math.sin(elapsed * 2.2 + child.userData.phase);
                child.scale.set(s, s, 1);
                child.material.opacity = 0.25 + 0.2 * Math.sin(elapsed * 2.2 + child.userData.phase);
            }
            if (child.isMesh && child.geometry.type === 'ConeGeometry' && child.userData.baseEmissive !== undefined) {
                const base = child.userData.baseEmissive;
                child.material.emissiveIntensity = base + 0.3 * Math.sin(elapsed * 2.5 + (child.userData.phase || 0));
            }
        });

        // Trigger Amap re-render → GLCustomLayer.render() → Three.js renders
        map.render();
    }

    // Simulate loading finish
    ui.setProgress('就绪', 100);
    await new Promise(r => setTimeout(r, 500));
    ui.hideLoading();

    // Start animation loop
    animate();

    // Resize
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        resizeFlowLayer();
        resizeRippleLayer();
    });

    console.log('✅ ' + (CONFIG.brand?.name||'3D 智慧导览') + ' 已就绪');
    console.log('   🗺️  高德地图底图 + Three.js 3D 叠加层');
    console.log('   📍 点击入口标记查看详情');
    console.log('   🎯 右侧按钮切换视角');
    console.log('   🅿️  右下角查看停车位实时数据');
    console.log('   🌓 右下角切换地图样式');
}

// Launch
boot().catch(err => {
    console.error('启动失败:', err);
    document.getElementById('loading-screen').innerHTML =
        '<div style="color:#f85149;font-size:1.2rem;">⚠️ 加载失败: ' + err.message + '<br><small>请刷新页面重试</small></div>';
});
</script>
</body>
</html>
